[package]
name = "cinders-launcher"
version = "0.1.0"
edition = "2021"
description = "Cinders of Chaos game launcher (O314): updates the exe, the DLLs and chaos.pack from the signed manifest, then starts the game"
publish = false

[lib]
name = "cinders_launcher"
path = "src/lib.rs"

[[bin]]
name = "cinders-launcher"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dep:eframe"]

[dependencies]
cinders-selfupdate = { path = "../crates/selfupdate" }
ed25519-compact = { version = "2", default-features = false, features = ["std"] }
eframe = { version = "0.29", optional = true, default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde_json = "1.0"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
