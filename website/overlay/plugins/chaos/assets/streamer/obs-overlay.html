<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cinders of Chaos: OBS overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<style>
html, body { margin: 0; background: transparent; overflow: hidden; }
body { width: 640px; height: 120px; display: flex; align-items: center; justify-content: center;
  font-family: Georgia, "Times New Roman", serif; }
.bar { box-sizing: border-box; width: 636px; height: 116px; padding: 0 20px; display: flex; flex-direction: column;
  align-items: center; justify-content: center; background: rgba(14, 8, 8, 0.92); border: 2px solid #b8923a; outline: 1px solid #5a1612;
  outline-offset: -6px; }
.name { color: #e8c76a; font-size: 26px; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 2px 0 #000; }
.line { color: #d6c9ae; font-size: 22px; margin-top: 6px; text-shadow: 0 1px 0 #000; }
.code { color: #ffd98a; font-weight: bold; letter-spacing: 2px; }
</style>
</head>
<body>
<div class="bar">
  <div class="name">Cinders of Chaos</div>
  <div class="line"><span id="lead">use code</span> <span class="code" id="code">YOURCODE</span></div>
</div>
<script src="obs-overlay.js"></script>
</body>
</html>
