name: Update of an installed server

# tools/ci/upgrade_install.sh: install_all.py of the code the live server runs, then this commit's over it, on the base
# server and the map master of windows-assets. The package build only installs from scratch; this catches a step that
# refuses its own older work (2026-10-30: packitems, contentareas). About 15 minutes.

on:
  workflow_dispatch:
    inputs:
      from_ref:
        description: "Commit or tag to update from (empty: the commit of the newest winpkg release with a Linux server)"
        required: false
        default: ""
  pull_request:
    paths:
      - "server/tools/**"
      - "server/data/**"
      - "tools/ci/upgrade_install.sh"
      - ".github/workflows/upgrade-install.yml"

permissions:
  contents: read

concurrency:
  group: upgrade-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upgrade:
    name: Update from the live code
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out Cinders of Chaos
        uses: actions/checkout@v4
        with:
          path: chaos
          fetch-depth: 0

      - name: Check out the assets
        uses: actions/checkout@v4
        with:
          ref: windows-assets
          path: assets
          sparse-checkout: |
            server
            world
            SHA256SUMS.parts
          sparse-checkout-cone-mode: true

      - name: Commit to update from
        id: from
        run: |
          from="${{ inputs.from_ref }}"
          if [ -z "$from" ]; then
            # the VPS takes its engine from the newest winpkg release with a Linux server (chaos_kit_update.sh)
            for tag in $(gh release list -R "$GITHUB_REPOSITORY" --limit 20 --json tagName --jq '.[].tagName' | grep '^winpkg-'); do
              if gh release view "$tag" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'CindersOfChaos-Server-Linux.tar.gz'; then
                from=$(gh release view "$tag" -R "$GITHUB_REPOSITORY" --json targetCommitish --jq .targetCommitish)
                echo "release $tag"
                break
              fi
            done
          fi
          [ -n "$from" ] || { echo "::error::no winpkg release with a Linux server; give from_ref"; exit 1; }
          echo "ref=$from" >> "$GITHUB_OUTPUT"
          echo "update from $from"

      - name: Base server
        run: |
          # install step contentareas: numpy (area_plan_place.py) and luajit (hunt_teleports_dump.lua)
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-numpy luajit
          (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts)
          mkdir -p base work
          tar -xJf assets/server/base-server.tar.xz -C base
          mv base/*/ work/server
          rm -rf base

      - name: Install the live code, then this commit over it
        run: bash chaos/tools/ci/upgrade_install.sh "${{ steps.from.outputs.ref }}" work/server assets/world
