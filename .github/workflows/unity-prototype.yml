# Unity prototype client (unity/README.md, ROADMAP O405).
#
# core: the pure C# core (protocol, map, dat/spr readers) built and tested with the .NET SDK on every push and pull
#   request that touches unity/. No Unity needed.
# build: MANUAL ONLY (workflow_dispatch). The Unity editor in a container (game-ci). Needs the repository secrets
#   UNITY_LICENSE (the .ulf file text), UNITY_EMAIL and UNITY_PASSWORD; without them the job says so and stops green.
#   The server's RSA modulus comes from the secret CHAOS_RSA_PUBLIC (public data, baked in). The client guard key goes in
#   only when the input embed_client_key is true AND the secret CHAOS_CLIENT_KEY is set: this repository is public and a
#   build artifact can be downloaded by anyone with access to the run, so the default build answers with the dev key.
name: Unity prototype

on:
  push:
    branches: [main]
    paths: ["unity/**", ".github/workflows/unity-prototype.yml"]
  pull_request:
    paths: ["unity/**", ".github/workflows/unity-prototype.yml"]
  workflow_dispatch:
    inputs:
      target:
        description: "Unity build target"
        type: choice
        options: [StandaloneWindows64, StandaloneLinux64, Android]
        default: StandaloneWindows64
      embed_client_key:
        description: "Embed CHAOS_CLIENT_KEY in the build (private use only; default: dev key)"
        type: boolean
        default: false
      client_build:
        description: "Client build number the guard expects"
        required: false
        default: "30"

permissions:
  contents: read

concurrency:
  group: unity-prototype-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Core tests
        working-directory: unity/Core.Tests
        run: dotnet run -c Release
      - name: Unity scripts compile (reference assemblies, no license)
        working-directory: unity/Client.Check
        run: dotnet build -c Release

  build:
    if: github.event_name == 'workflow_dispatch'
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Unity license present?
        id: lic
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::warning::No UNITY_LICENSE secret: the Unity build is skipped (unity/README.md 'Build in GitHub Actions')."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.lic.outputs.ok == '1'
      - uses: actions/cache@v4
        if: steps.lic.outputs.ok == '1'
        with:
          path: unity/Client/Library
          key: unity-library-${{ inputs.target }}-${{ hashFiles('unity/Client/Packages/manifest.json', 'unity/Client/ProjectSettings/ProjectVersion.txt') }}
      - name: Bake server data into Resources
        if: steps.lic.outputs.ok == '1'
        env:
          CHAOS_RSA_PUBLIC: ${{ secrets.CHAOS_RSA_PUBLIC }}
          CHAOS_CLIENT_KEY: ${{ secrets.CHAOS_CLIENT_KEY }}
          CLIENT_BUILD: ${{ inputs.client_build }}
          EMBED: ${{ inputs.embed_client_key }}
        run: |
          res=unity/Client/Assets/Chaos/Generated/Resources
          mkdir -p "$res"
          case "$CLIENT_BUILD" in ''|*[!0-9]*) echo "client_build must be a number"; exit 1;; esac
          printf '%s' "$CLIENT_BUILD" > "$res/chaos_build.txt"
          if [ -n "$CHAOS_RSA_PUBLIC" ]; then printf '%s' "$CHAOS_RSA_PUBLIC" > "$res/chaos_rsa.txt"
          else echo "::warning::No CHAOS_RSA_PUBLIC secret: the build uses the open RSA key and cannot log in to the live server."; fi
          if [ "$EMBED" = "true" ]; then
            if [ -z "$CHAOS_CLIENT_KEY" ]; then echo "embed_client_key: no CHAOS_CLIENT_KEY secret"; exit 1; fi
            printf '%s' "$CHAOS_CLIENT_KEY" > "$res/chaos_client_key.txt"
            echo "::warning::The client guard key is inside this build: do not share the artifact."
          fi
      - name: Build
        if: steps.lic.outputs.ok == '1'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity/Client
          targetPlatform: ${{ inputs.target }}
          buildMethod: Chaos.Client.Editor.ChaosBuild.Build
          buildName: ChaosUnity
          allowDirtyBuild: true
      # HD-2D screenshots (unity/README.md "HD-2D view (O432)"): the Linux player renders the offline demo room once in the
      # classic view and once in HD-2D (flag -chaosHd2dShot), under a virtual display with Mesa software OpenGL. It needs no
      # server and no game files. A failure here never fails the build; the log says why.
      # the real sprite pair for the screenshots (the temple room of pair 60), from the private branch windows-assets as
      # windows-package.yml gets it; without it the demo room uses its synthetic sprites. Only the PNGs leave the job.
      - name: Check out the sprite pair (screenshots)
        if: steps.lic.outputs.ok == '1' && inputs.target == 'StandaloneLinux64'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: windows-assets
          path: assets
          sparse-checkout: |
            things
            SHA256SUMS.parts
          sparse-checkout-cone-mode: true
      - name: HD-2D screenshots (Linux player, xvfb)
        id: hd2dshots
        if: steps.lic.outputs.ok == '1' && inputs.target == 'StandaloneLinux64'
        continue-on-error: true
        run: |
          out="$PWD/hd2d-shots"
          mkdir -p "$out"
          exe=$(find build/StandaloneLinux64 -name ChaosUnity.x86_64 -type f | head -n 1); exe=${exe:-build/StandaloneLinux64/ChaosUnity/ChaosUnity.x86_64}
          if [ ! -e "$exe" ]; then echo "::warning::HD-2D screenshots: no player at $exe"; ls -R build | head -20; exit 1; fi
          sudo chmod -R a+rX build
          sudo chmod a+x "$exe"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libglu1-mesa
          pair=""
          if ls assets/things/things-1098.tar.xz.part* >/dev/null 2>&1; then
            (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts) && mkdir -p pair \
              && cat assets/things/things-1098.tar.xz.part* | xz -d -T0 | tar -xf - -C pair \
              && [ -f pair/Tibia.dat ] && pair="$PWD/pair"
          fi
          if [ -n "$pair" ]; then echo "real pair: $pair"; else echo "::notice::no sprite pair: the demo room uses synthetic sprites"; fi
          set +e
          if [ -n "$pair" ]; then export CHAOS_PAIR_DIR="$pair"; fi
          LIBGL_ALWAYS_SOFTWARE=1 timeout 600 xvfb-run -a -s "-screen 0 1280x960x24" "$exe" \
            -force-glcore -screen-width 1280 -screen-height 960 -screen-fullscreen 0 \
            -logFile "$out/player.log" -chaosHd2dShot "$out"
          rc=$?
          set -e
          echo "player exit code: $rc"
          if [ ! -s "$out/classic.png" ] || [ ! -s "$out/hd2d.png" ]; then
            echo "::warning::HD-2D screenshots failed (exit $rc); last lines of the player log follow"
            tail -n 60 "$out/player.log" || true
            exit 1
          fi
          grep "chaos hd2d shot" "$out/player.log" || true
      - uses: actions/upload-artifact@v4
        if: always() && steps.lic.outputs.ok == '1' && inputs.target == 'StandaloneLinux64'
        with:
          name: hd2d-shots
          path: hd2d-shots
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: steps.lic.outputs.ok == '1'
        with:
          name: chaos-unity-${{ inputs.target }}
          path: build/${{ inputs.target }}
          retention-days: 7
