# Unity prototype client (unity/README.md, ROADMAP O405).
#
# core: the pure C# core (protocol, map, dat/spr readers) built and tested with the .NET SDK on every push and pull
#   request that touches unity/. No Unity needed.
# build: MANUAL ONLY (workflow_dispatch). The Unity editor in a container (game-ci). Needs the repository secrets
#   UNITY_LICENSE (the .ulf file text), UNITY_EMAIL and UNITY_PASSWORD; without them the job says so and stops green.
#   The server's RSA modulus comes from the secret CHAOS_RSA_PUBLIC (public data, baked in). The client guard key goes in
#   only when the input embed_client_key is true AND the secret CHAOS_CLIENT_KEY is set: this repository is public and a
#   build artifact can be downloaded by anyone with access to the run, so the default build answers with the dev key.
#   A StandaloneWindows64 build is also packed for the game launcher (unity/README.md "Shipping the Unity client"): the zip
#   CindersOfChaos-Unity-Windows.zip (the player folder plus unity_build.json: every file with size and SHA-256) in the artifact
#   chaos-unity-windows-package. The workflow publishes no release and holds no signing key: the VPS signs it
#   (publish_client_update.sh --unity, admin app: Comandos > Site e update do client > Publicar client Unity).
#   embed_client_key decides what the package is (owner decision 2026-11-08, "Embutir como no principal"): true = a KEYED package that
#   carries the client key like the main client's Chaos.exe and so opens the sprite pair blobs; false = a DEV package. The job log says
#   which, and unity_build.json holds the boolean "embed_client_key" (never the key).
name: Unity prototype

on:
  push:
    branches: [main]
    paths: ["unity/**", ".github/workflows/unity-prototype.yml", "tools/ci/check_unity_opcodes*.py", "tools/ci/unity_opcodes_allowlist.txt", "server/data/scripts/chaos/chaos_constants.lua", "docs/CREDITS.md", "client/overlay/modules/**/*.lua", "client/tools/make_unity_manifest*.py"]
  pull_request:
    paths: ["unity/**", ".github/workflows/unity-prototype.yml", "tools/ci/check_unity_opcodes*.py", "tools/ci/unity_opcodes_allowlist.txt", "server/data/scripts/chaos/chaos_constants.lua", "docs/CREDITS.md", "client/overlay/modules/**/*.lua", "client/tools/make_unity_manifest*.py"]
  workflow_dispatch:
    inputs:
      target:
        description: "Unity build target"
        type: choice
        options: [StandaloneWindows64, StandaloneLinux64, Android]
        default: StandaloneWindows64
      embed_client_key:
        description: "Embed CHAOS_CLIENT_KEY in the build (private use only; default: dev key)"
        type: boolean
        default: false
      client_build:
        description: "Client build number the guard expects"
        required: false
        default: "30"

permissions:
  contents: read

concurrency:
  group: unity-prototype-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Front fx id table is current (server effect and missile ids to elements)
        run: python3 -I unity/tools/gen_front_fx_ids.py --check
      - name: Helper rotation data is current (autorotation_data.lua to C#)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit && luajit unity/tools/gen_helper_rotation_data.lua --check
      - name: Info data is current (Codex, How it works, Help search JSON and the info lift table from the main client's data files)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq luajit lua5.3 && luajit unity/tools/gen_info_data.lua --check && lua5.3 unity/tools/gen_info_data.lua --check
      - name: Every client-facing extended opcode is handled in Unity or on the allowlist with a reason (the list can only shrink)
        run: python3 -I tools/ci/check_unity_opcodes.py && python3 -I tools/ci/check_unity_opcodes_test.py
      - name: Credits data is current (docs/CREDITS.md to the Unity Credits window)
        run: python3 -I unity/tools/gen_unity_credits.py --check && python3 -I unity/tools/gen_unity_credits_test.py
      - name: Spell icon cells are current (spelldata.lua to C#)
        run: python3 -I unity/tools/gen_spell_icon_data.py --check
      - name: Codex texts in pt-BR are current (pt_br.lua Codex blocks to C#)
        run: python3 -I unity/tools/gen_codex_text.py --check
      - name: Unity client channel (pack, signed publish, verify; stdlib only)
        run: python3 -I client/tools/make_unity_manifest_test.py
      - name: Core tests
        working-directory: unity/Core.Tests
        run: dotnet run -c Release
      - name: Unity scripts compile (reference assemblies, no license)
        working-directory: unity/Client.Check
        run: dotnet build -c Release

  build:
    if: github.event_name == 'workflow_dispatch'
    needs: core
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Unity license present?
        id: lic
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::warning::No UNITY_LICENSE secret: the Unity build is skipped (unity/README.md 'Build in GitHub Actions')."
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.lic.outputs.ok == '1'
      - uses: actions/cache@v4
        if: steps.lic.outputs.ok == '1'
        with:
          path: unity/Client/Library
          key: unity-library-${{ inputs.target }}-${{ hashFiles('unity/Client/Packages/manifest.json', 'unity/Client/ProjectSettings/ProjectVersion.txt') }}
      # the KayKit 3D characters (CC0, docs/CREDITS.md) are not in the repository: two upstream archives at pinned commits, every
      # used file checked against its sha256 (unity/tools/fetch_3d_assets.py). A wrong hash fails the build.
      - name: Fetch the KayKit 3D characters
        if: steps.lic.outputs.ok == '1'
        run: |
          python3 -I unity/tools/fetch_3d_assets.py
          python3 -I unity/tools/fetch_3d_assets.py --check
      # the purchased pack monsters of the front-art scene: their licence allows them inside a built game but not as files on their
      # own, so the repository holds them encrypted (unity/tools/front_art_packs.py). Without the secret CHAOS_ART_KEY the scene
      # leaves them out (a warning).
      - name: Open the front-art pack monsters
        if: steps.lic.outputs.ok == '1'
        env:
          CHAOS_ART_KEY: ${{ secrets.CHAOS_ART_KEY }}
        run: |
          if [ -z "$CHAOS_ART_KEY" ]; then echo "::warning::No CHAOS_ART_KEY secret: the front-art scene runs without the pack monsters."; fi
          python3 -I unity/tools/front_art_packs.py open unity/art/front_art_packs.enc unity/Client/Assets/Chaos/Unity/Resources/FrontArt
      - name: Bake server data into Resources
        if: steps.lic.outputs.ok == '1'
        env:
          CHAOS_RSA_PUBLIC: ${{ secrets.CHAOS_RSA_PUBLIC }}
          CHAOS_CLIENT_KEY: ${{ secrets.CHAOS_CLIENT_KEY }}
          CLIENT_BUILD: ${{ inputs.client_build }}
          EMBED: ${{ inputs.embed_client_key }}
        run: |
          res=unity/Client/Assets/Chaos/Generated/Resources
          mkdir -p "$res"
          case "$CLIENT_BUILD" in ''|*[!0-9]*) echo "client_build must be a number"; exit 1;; esac
          printf '%s' "$CLIENT_BUILD" > "$res/chaos_build.txt"
          if [ -n "$CHAOS_RSA_PUBLIC" ]; then printf '%s' "$CHAOS_RSA_PUBLIC" > "$res/chaos_rsa.txt"
          else echo "::warning::No CHAOS_RSA_PUBLIC secret: the build uses the open RSA key and cannot log in to the live server."; fi
          if [ "$EMBED" = "true" ]; then
            if [ -z "$CHAOS_CLIENT_KEY" ]; then echo "embed_client_key: no CHAOS_CLIENT_KEY secret"; exit 1; fi
            printf '%s' "$CHAOS_CLIENT_KEY" > "$res/chaos_client_key.txt"
            echo "::warning::The client guard key is inside this build: do not share the artifact."
          fi
      - name: Copy the sound, music and picture files of the main client modules and data into StreamingAssets
        if: steps.lic.outputs.ok == '1'
        run: |
          dst=unity/Client/Assets/StreamingAssets/overlay/modules
          for m in game_chaossound game_chaosmusic game_chestaura game_combatdecals game_cosmeticfx game_cosmetics game_shaderfx game_lootfilter game_nameplate game_chaosweather; do
            (cd client/overlay/modules && find "$m" -type f \( -name '*.ogg' -o -name '*.png' \) -print0) |
              while IFS= read -r -d '' f; do mkdir -p "$dst/$(dirname "$f")"; cp "client/overlay/modules/$f" "$dst/$f"; done
          done
          # toast icons only (the rest of game_chaosnotify is the window skin)
          (cd client/overlay/modules && find game_chaosnotify/images/toast -type f -name '*.png' -print0) |
            while IFS= read -r -d '' f; do mkdir -p "$dst/$(dirname "$f")"; cp "client/overlay/modules/$f" "$dst/$f"; done
          # the toast plate (Background); the answer buttons are in images/toast (phase 7 track Y)
          mkdir -p "$dst/game_chaosnotify/images" && cp client/overlay/modules/game_chaosnotify/images/Background.png "$dst/game_chaosnotify/images/"
          # pictures of client/overlay/data (spell icon sheets, buff icons, monster bar art, the achievement toast icon): the player reads them as ../data
          ddst=unity/Client/Assets/StreamingAssets/overlay/data
          for d in images/game/spells images/game/buffs images/chaos/monsterbar images/chaos/skin images/chaos/mapmarkers images/chaos/mapoverlay skins; do
            (cd client/overlay/data && find "$d" -type f -name '*.png' -print0) |
              while IFS= read -r -d '' f; do mkdir -p "$ddst/$(dirname "$f")"; cp "client/overlay/data/$f" "$ddst/$f"; done
          done
          mkdir -p "$ddst/images/chaos" && cp client/overlay/data/images/chaos/topbutton_ranking.png "$ddst/images/chaos/"
          # the charm slot pictures per shape (phase 8 track B: charmslot_1x1, 2x1, 1x2, 2x2) and, with game_cosmetics above, the effect icons of the Cosmetics rows
          cp client/overlay/data/images/chaos/charmslot_*.png "$ddst/images/chaos/"
          # the bitmap fonts of the damage numbers (data/fonts/chaos: the .otfont text and its sheet; phase 7 track Y)
          mkdir -p "$ddst/fonts/chaos" && cp client/overlay/data/fonts/chaos/chaos-display-16px.* client/overlay/data/fonts/chaos/chaos-outline-11px.* "$ddst/fonts/chaos/"
          echo "copied $(find "$dst" "$ddst" -type f | wc -l) files to $dst and $ddst"
      - name: Build
        if: steps.lic.outputs.ok == '1'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity/Client
          targetPlatform: ${{ inputs.target }}
          buildMethod: Chaos.Client.Editor.ChaosBuild.Build
          buildName: ChaosUnity
          allowDirtyBuild: true
      # HD-2D screenshots (unity/README.md "HD-2D view (O432)"): the Linux player renders the offline demo room once in the
      # classic view and once in HD-2D (flag -chaosHd2dShot), under a virtual display with Mesa software OpenGL. It needs no
      # server and no game files. A failure here never fails the build; the log says why.
      # the real sprite pair for the screenshots (the temple room of pair 60), from the private branch windows-assets as
      # windows-package.yml gets it; without it the demo room uses its synthetic sprites. Only the PNGs leave the job.
      - name: Check out the sprite pair (screenshots)
        if: steps.lic.outputs.ok == '1' && inputs.target == 'StandaloneLinux64'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: windows-assets
          path: assets
          sparse-checkout: |
            things
            SHA256SUMS.parts
          sparse-checkout-cone-mode: true
      - name: HD-2D screenshots (Linux player, xvfb)
        id: hd2dshots
        if: steps.lic.outputs.ok == '1' && inputs.target == 'StandaloneLinux64'
        continue-on-error: true
        run: |
          out="$PWD/hd2d-shots"
          mkdir -p "$out"
          exe=$(find build/StandaloneLinux64 -name ChaosUnity.x86_64 -type f | head -n 1); exe=${exe:-build/StandaloneLinux64/ChaosUnity/ChaosUnity.x86_64}
          if [ ! -e "$exe" ]; then echo "::warning::HD-2D screenshots: no player at $exe"; ls -R build | head -20; exit 1; fi
          sudo chmod -R a+rX build
          sudo chmod a+x "$exe"
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 libglu1-mesa ffmpeg
          pair=""
          if ls assets/things/things-1098.tar.xz.part* >/dev/null 2>&1; then
            (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts) && mkdir -p pair \
              && cat assets/things/things-1098.tar.xz.part* | xz -d -T0 | tar -xf - -C pair \
              && [ -f pair/Tibia.dat ] && pair="$PWD/pair"
          fi
          if [ -n "$pair" ]; then echo "real pair: $pair"; else echo "::notice::no sprite pair: the demo room uses synthetic sprites"; fi
          set +e
          if [ -n "$pair" ]; then export CHAOS_PAIR_DIR="$pair"; fi
          # the screenshots, then (same process, Hd2dShot hands over) the demo tour: the app logs in to a fake server inside the player
          # and every frame goes to demo_tour_0000.png at 60 a second (unity/README.md "Demo tour video"). The window is 1280x720.
          LIBGL_ALWAYS_SOFTWARE=1 timeout 2400 xvfb-run -a -s "-screen 0 1280x720x24" "$exe" \
            -force-glcore -screen-width 1280 -screen-height 720 -screen-fullscreen 0 \
            -logFile "$out/player.log" -chaosHd2dShot "$out" -chaosDemoTour "$out"
          rc=$?
          # no tour frames (the screenshots failed before the hand-over): the tour on its own
          if ! ls "$out"/demo_tour_0000.png >/dev/null 2>&1; then
            echo "::warning::no demo tour frames after the screenshot run (exit $rc); running the tour on its own"
            LIBGL_ALWAYS_SOFTWARE=1 timeout 1800 xvfb-run -a -s "-screen 0 1280x720x24" "$exe" \
              -force-glcore -screen-width 1280 -screen-height 720 -screen-fullscreen 0 \
              -logFile "$out/player_tour.log" -chaosDemoTour "$out"
            rc_tour=$?
            echo "demo tour exit code: $rc_tour"
          fi
          # the window smoke run (unity/README.md "Window smoke run"): a second, short player run in its own process (a crash there cannot touch the tour
          # video). It logs in to the same fake server, opens every window one at a time and writes window_smoke.json and window_smoke_sheet_N.png.
          # A report, not a gate: its exit code is only printed.
          LIBGL_ALWAYS_SOFTWARE=1 timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" "$exe" \
            -force-glcore -screen-width 1280 -screen-height 720 -screen-fullscreen 0 \
            -logFile "$out/player_smoke.log" -chaosWindowSmoke "$out"
          rc_smoke=$?
          echo "window smoke exit code: $rc_smoke"
          # the walking video (unity/README.md "Walking video"): a third player run in its own process, so a crash in it touches neither the tour nor the smoke.
          # It logs in to the same kind of fake server (answers after a 120 ms round trip), walks the 8-direction loop through the player's key path in the classic,
          # HD-2D, live front-art and (when the models are in the build) 3D views with a pt-BR caption, and writes walk_tour_0000.png at 60 a second. Per segment it
          # logs steps sent, steps confirmed and the longest standstill with a key held; over 50 ms the player exits with 1 (after the last frame).
          LIBGL_ALWAYS_SOFTWARE=1 timeout 2100 xvfb-run -a -s "-screen 0 1280x720x24" "$exe" \
            -force-glcore -screen-width 1280 -screen-height 720 -screen-fullscreen 0 \
            -logFile "$out/player_walk.log" -chaosWalkTour "$out"
          rc_walk=$?
          echo "walk tour exit code: $rc_walk"
          set -e
          echo "player exit code: $rc"
          grep "chaos demo tour" "$out/player.log" "$out/player_tour.log" 2>/dev/null || true
          # the video: libx264, yuv420p, crf 20, 60 fps. The PNG frames (about 1400, large) are deleted after encoding; four stills stay.
          n=$(ls "$out"/demo_tour_[0-9][0-9][0-9][0-9].png 2>/dev/null | wc -l)
          echo "demo tour frames: $n"
          if [ "$n" -gt 0 ]; then
            if ffmpeg -y -loglevel error -framerate 60 -i "$out/demo_tour_%04d.png" \
                 -vf "scale=1280:720:flags=lanczos,format=yuv420p" -c:v libx264 -preset medium -crf 20 -movflags +faststart "$out/demo_tour.mp4"; then
              ls -l "$out/demo_tour.mp4"
              for k in 1 2 3 4; do
                f=$(printf "%s/demo_tour_%04d.png" "$out" $(( n * k / 5 )))
                [ -f "$f" ] && cp "$f" "$out/demo_tour_still_$k.png"
              done
              rm -f "$out"/demo_tour_[0-9][0-9][0-9][0-9].png
            else
              echo "::warning::ffmpeg could not encode the demo tour; the PNG frames stay in the artifact"
            fi
          else
            echo "::warning::no demo tour frames: the log lines 'chaos demo tour' above say why"
          fi
          # the walking video: the player's own lines first (a line per segment: steps sent, steps confirmed, longest standstill with a key held), then the same
          # encode as the demo tour, four stills, and the frames go.
          grep "chaos walk tour" "$out/player_walk.log" 2>/dev/null || true
          nw=$(ls "$out"/walk_tour_[0-9][0-9][0-9][0-9].png 2>/dev/null | wc -l)
          echo "walk tour frames: $nw"
          if [ "$nw" -gt 0 ]; then
            if ffmpeg -y -loglevel error -framerate 60 -i "$out/walk_tour_%04d.png" \
                 -vf "scale=1280:720:flags=lanczos,format=yuv420p" -c:v libx264 -preset medium -crf 20 -movflags +faststart "$out/walk_tour.mp4"; then
              ls -l "$out/walk_tour.mp4"
              for k in 1 2 3 4; do
                f=$(printf "%s/walk_tour_%04d.png" "$out" $(( nw * k / 5 )))
                [ -f "$f" ] && cp "$f" "$out/walk_tour_still_$k.png"
              done
              rm -f "$out"/walk_tour_[0-9][0-9][0-9][0-9].png
            else
              echo "::warning::ffmpeg could not encode the walking video; the PNG frames stay in the artifact"
            fi
          else
            echo "::warning::no walking video frames: the log lines 'chaos walk tour' above say why"
            tail -n 40 "$out/player_walk.log" 2>/dev/null || true
          fi
          if [ "$rc_walk" -ne 0 ]; then
            echo "::error::walking video: the player exited with $rc_walk (a standstill over 50 ms with a key held, steps not confirmed, a refused step or a crash); the 'chaos walk tour: failed' lines above say which"
          fi
          # the window smoke report: the summary line of the player, then every window with a problem (exception, IMGUI layout error, logged error, empty or
          # off-screen rect). It never fails the job; the json and the sheets go into the hd2d-shots artifact.
          grep "chaos window smoke" "$out/player_smoke.log" 2>/dev/null || true
          if [ -s "$out/window_smoke.json" ]; then
            python3 -I - "$out/window_smoke.json" <<'PY' || true
          import json, sys
          d = json.load(open(sys.argv[1]))
          s = d["summary"]
          print("window smoke: %d windows, %d with problems (%d exceptions, %d layout errors, %d logged errors, %d off screen or empty, %d oversize, %d thin or empty body)"
                % (s["windows"], s["withErrors"], s["exceptions"], s["layoutErrors"], s["loggedErrors"], s["offScreen"], s.get("oversize", 0), s.get("emptyBody", 0)))
          for w in d["windows"]:
              flags = []
              if w["offScreen"]:
                  flags.append("off screen")
              if w["zeroSize"]:
                  flags.append("empty rect")
              if w.get("oversize"):
                  flags.append("larger than the screen")
              if w.get("thin"):
                  flags.append("body too thin")
              if w.get("emptyBody"):
                  flags.append("empty body (ink %s)" % w.get("ink"))
              if not w["exceptions"] and not flags:
                  continue
              print("  %s (%d frames)%s" % (w["name"], w["frames"], ": " + ", ".join(flags) if flags else ""))
              for x in w["exceptions"]:
                  print("    [%s x%d] %s | %s" % (x["kind"], x["count"], x["message"], x["stack"]))
          for w in d["windows"]:
              if w.get("context"):
                  print("  context only: %s: %s" % (w["name"], w["context"]))
          for x in d.get("background", []):
              print("  (between windows) [%s x%d] %s | %s" % (x["kind"], x["count"], x["message"], x["stack"]))
          if s["withErrors"]:
              print("::warning::window smoke: %d of %d windows have problems (a report, not a gate; see the step log and window_smoke.json in hd2d-shots)" % (s["withErrors"], s["windows"]))
          PY
            ls "$out"/window_smoke_sheet_*.png 2>/dev/null | wc -l | xargs echo "window smoke sheets:"
          else
            echo "::warning::no window_smoke.json: the log lines 'chaos window smoke' above say why"
            tail -n 40 "$out/player_smoke.log" 2>/dev/null || true
          fi
          if [ ! -s "$out/classic.png" ] || [ ! -s "$out/hd2d.png" ]; then
            echo "::warning::HD-2D screenshots failed (exit $rc); last lines of the player log follow"
            tail -n 60 "$out/player.log" || true
            exit 1
          fi
          grep "chaos hd2d shot" "$out/player.log" || true
          grep "chaos front art" "$out/player.log" || true
          # the walking video fails the step (the artifact below is uploaded all the same, with the video and the log)
          if [ "$rc_walk" -ne 0 ]; then exit 1; fi
      # The player on a REAL server (unity/README.md "Player on a live server (CI)", O433): the same Linux player, flag -chaosLiveSmoke, logs in through its own login
      # screen path to a server built in this job by tools/ci/unity_live_check.sh --serve-only (the base server and map of windows-assets, install_all.py of this
      # commit, a private MariaDB, the tfs engine of the newest winpkg release, fresh accounts with random passwords, the guard in enforce mode with a key made here),
      # walks, opens the main windows, logs out and writes live_smoke.json and the sheets. Extended identity first, then Chaos. A GATE since 2026-11-09 (two clean
      # runs in a row on main, runs 42563859766 and 42568736362): a failed run (login, entering, the walk, a closed session or an exception) fails the job; the artifact
      # below is uploaded all the same. Only live_smoke.json, the png files, a scrubbed log of the player's own
      # "chaos live smoke" lines and a summary go into the hd2d-shots artifact: no password, no key, no server log, no player log.
      - name: Check out the assets for the live server
        if: steps.lic.outputs.ok == '1' && inputs.target == 'StandaloneLinux64'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: windows-assets
          path: assets-live
          sparse-checkout: |
            server
            world
            SHA256SUMS.parts
          sparse-checkout-cone-mode: true
      - name: "Player on a live server: Extended and Chaos identity (gate)"
        id: livesmoke
        if: steps.lic.outputs.ok == '1' && inputs.target == 'StandaloneLinux64'
        continue-on-error: false
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$PWD/hd2d-shots"
          work="$RUNNER_TEMP/ul-live"
          mkdir -p "$out" "$work"
          if [ ! -f assets-live/server/base-server.tar.xz ]; then echo "::warning::live smoke: no server/base-server.tar.xz in windows-assets (the checkout above failed or the branch has no server): skipped"; exit 1; fi
          exe=$(find build/StandaloneLinux64 -name ChaosUnity.x86_64 -type f | head -n 1)
          if [ -z "$exe" ] || [ ! -e "$exe" ]; then echo "::warning::live smoke: no player under build/StandaloneLinux64"; exit 1; fi
          sudo chmod -R a+rX build
          sudo chmod a+x "$exe"
          # the tools of unity-live-check.yml (private MariaDB, numpy and luajit for the content install) and the player's (a virtual display, Mesa)
          sudo apt-get update -qq
          sudo apt-get install -y -qq mariadb-server mariadb-client python3-numpy luajit xvfb libgl1-mesa-dri libglx-mesa0 libglu1-mesa
          sudo systemctl stop mariadb || true
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mariadbd 2>/dev/null || true
          # the sprite pair: the one the screenshots step opened, else from the assets of that step
          pair=""
          if [ -f pair/Tibia.dat ]; then pair="$PWD/pair"
          elif ls assets/things/things-1098.tar.xz.part* >/dev/null 2>&1; then
            mkdir -p pair && cat assets/things/things-1098.tar.xz.part* | xz -d -T0 | tar -xf - -C pair && [ -f pair/Tibia.dat ] && pair="$PWD/pair"
          fi
          if [ -z "$pair" ]; then echo "::warning::live smoke: no sprite pair (the screenshots step has none either): the player cannot load the item and creature art"; exit 1; fi
          # the server up, detached; it is stopped below and by the trap, whatever happens in between
          trap 'UL_WORK="$work" bash "$GITHUB_WORKSPACE/tools/ci/unity_live_check.sh" --stop >/dev/null 2>&1 || true' EXIT
          rc_serve=0
          UL_ASSETS="$PWD/assets-live" UL_WORK="$work" bash tools/ci/unity_live_check.sh --serve-only || rc_serve=$?
          if [ "$rc_serve" -ne 0 ]; then echo "::error::live smoke: the server did not come up (exit $rc_serve); the lines above say where"; exit 1; fi
          fails=0
          for id in extended chaos; do
            live="$out/live-$id"
            mkdir -p "$live"
            (
              # the account, the password and the keys of this run: from the env file of mode 600, never printed, masked in the log all the same
              set -a; . "$work/client-$id.env"; set +a
              echo "::add-mask::$CHAOS_LIVE_PASSWORD"
              echo "::add-mask::$CHAOS_CLIENT_KEY"
              # the fresh character of the new player first minute (CHAOS_LIVE_NEW_*, same file): masked, and cut from the log lines below
              echo "::add-mask::$CHAOS_LIVE_NEW_PASSWORD"
              export CHAOS_PAIR_DIR="$pair"
              set +e
              LIBGL_ALWAYS_SOFTWARE=1 timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" "$exe" \
                -force-glcore -screen-width 1280 -screen-height 720 -screen-fullscreen 0 \
                -logFile "$work/player_live_$id.log" -chaosLiveSmoke "$live"
              rc=$?
              echo "live smoke ($id) exit code: $rc"
              # the player's own lines only, with the run's secrets cut out (all random hex or letters: safe in sed)
              grep "chaos live smoke" "$work/player_live_$id.log" 2>/dev/null \
                | sed -e "s/$CHAOS_LIVE_PASSWORD/<removed>/g" -e "s/$CHAOS_CLIENT_KEY/<removed>/g" -e "s/$CHAOS_LIVE_ACCOUNT/<removed>/g" -e "s/$CHAOS_LIVE_NEW_PASSWORD/<removed>/g" -e "s/$CHAOS_LIVE_NEW_ACCOUNT/<removed>/g" > "$live/live_smoke.log" || true
              cat "$live/live_smoke.log"
              exit "$rc"
            ) || { echo "::warning::live smoke ($id): the player exited with a failure; live_smoke.json and the log lines say which"; fails=$((fails + 1)); }
            if [ ! -s "$live/live_smoke.json" ]; then echo "::warning::live smoke ($id): no live_smoke.json; the tail of the player log follows (secrets cut)"; tail -n 30 "$work/player_live_$id.log" 2>/dev/null | grep -v -i -E "password|account|key" || true; fi
          done
          UL_WORK="$work" bash tools/ci/unity_live_check.sh --stop || true
          trap - EXIT
          # the summary: a table per identity, then what failed and what only warned (a window without an extended answer)
          python3 -I - "$out" "$out/live_smoke_summary.md" <<'PY' || fails=$((fails + 1))
          import json, os, sys
          out, md = sys.argv[1], sys.argv[2]
          lines = ["## Player on a live server (O433)", "", "| identity | login | entry | walk (confirmed of planned) | tiles drawn | windows | answered | prefetched | local-only | needs condition | no answer | exceptions | layout errors | result |", "|---|---|---|---|---|---|---|---|---|---|---|---|---|---|"]
          notes, bad = [], False
          for ident in ("extended", "chaos"):
              path = os.path.join(out, "live-%s" % ident, "live_smoke.json")
              if not os.path.isfile(path):
                  lines.append("| %s | no report | | | | | | | | | | | | FAIL |" % ident)
                  bad = True
                  continue
              d = json.load(open(path))
              s = d["summary"]
              ok = d.get("pass", False)
              bad = bad or not ok
              lines.append("| %s | %s | %s | %d of %d | %d | %d | %d | %d | %d | %d | %d | %d | %d | %s |" % (
                  ident, "ok" if d["login"]["ok"] else "FAIL", "ok" if d["enter"]["ok"] else "FAIL", d["walk"]["confirmed"], d["walk"]["planned"],
                  d["map"]["tilesDrawn"], s["windows"], s["answered"], s["prefetched"], s["local"], s["needsCondition"], s["noAnswer"], s["exceptions"], s["layoutErrors"], "pass" if ok else "FAIL"))
              for f in d.get("failures", []):
                  notes.append("- **%s** failed: %s" % (ident, f))
              for w in d.get("warnings", []):
                  notes.append("- %s: %s" % (ident, w))
              for w in d.get("notes", []):
                  notes.append("- %s: %s" % (ident, w))
              n = d.get("newplayer") or {}
              if n.get("ran"):
                  notes.append("- %s: new player first minute (helper_onboarding_%s.png): welcome toast %s, openHelper %s, Helper opened by itself %s on tab %s (Auto setup is tab 1), hint %s, blink %s, %s" % (
                      ident, ident, "seen" if n.get("toastSeen") else "NOT seen", "yes" if n.get("openHelper") else "NO", "yes" if n.get("helperOpened") else "NO", n.get("tab"),
                      "shown" if n.get("hintShown") else "NOT shown", "on" if n.get("blinkActive") else "off", "pass" if n.get("pass") else "FAIL"))
                  if n.get("longestFrameMs", 0) >= 3000:
                      notes.append("- %s: new player first minute: the longest frame took %.1f s, %.1f s after entering (the Helper took the request at %.1f s, seen open at %.1f s)" % (
                          ident, n["longestFrameMs"] / 1000.0, n.get("longestFrameAtMs", 0) / 1000.0, n.get("helperTakenMs", -1000) / 1000.0, n.get("helperMs", 0) / 1000.0))
              ff = d.get("firstfight") or {}
              if ff.get("ran"):
                  fw, fx, fl = ff.get("walk") or {}, ff.get("experience") or {}, ff.get("loot") or {}
                  if ff.get("skipped"):
                      notes.append("- %s: new player first fight (first_fight_%s.png): skipped, %s" % (ident, ident, ff.get("skipReason")))
                  else:
                      notes.append("- %s: new player first fight (first_fight_%s.png): Auto setup %s slots, Helper %s, walk %s planned %s sent %s confirmed %s refused, %s killed %s, experience %s to %s, body %s (%s items, Containers window %s), %.0f s, %s" % (
                          ident, ident, ff.get("autoSetup", {}).get("slots"), "on" if ff.get("helperOn") else "OFF", fw.get("planned"), fw.get("sent"), fw.get("confirmed"), fw.get("refused"),
                          ff.get("kills"), ff.get("monster") or "nothing", fx.get("before"), fx.get("after"), "opened" if fl.get("opened") else "NOT opened", fl.get("items"),
                          "open" if fl.get("windowOpen") else "shut", ff.get("ms", 0) / 1000.0, "pass" if ff.get("pass") else "FAIL"))
          lines += [""] + (notes if notes else ["No failure and no warning."])
          lines += ["", "Every window is answered, prefetched at login (Skills, Dungeons), local-only (native windows, Helper, Item Finder), needs a condition or has no answer; only no answer is a warning, never a failure. The json and the sheets are in the hd2d-shots artifact (live-extended, live-chaos)."]
          text = "\n".join(lines) + "\n"
          open(md, "w").write(text)
          print(text)
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              open(os.environ["GITHUB_STEP_SUMMARY"], "a").write(text)
          sys.exit(1 if bad else 0)
          PY
          if [ "$fails" -ne 0 ]; then echo "::error::live smoke: $fails of the runs or checks failed (a report: the job goes on). See the table above and live-extended / live-chaos in the hd2d-shots artifact."; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.lic.outputs.ok == '1' && inputs.target == 'StandaloneLinux64'
        with:
          name: hd2d-shots
          path: hd2d-shots
          if-no-files-found: warn
          retention-days: 7
      # The Windows player as one zip for the game launcher: the files at the zip's root plus unity_build.json (path, size,
      # SHA-256 of every file, the shape of the manifest's "native" section). Unsigned: the update key lives on the VPS only,
      # publish_client_update.sh --unity checks the files against unity_build.json and signs. Never a GitHub release.
      - name: Pack the Windows player for the launcher
        if: steps.lic.outputs.ok == '1' && inputs.target == 'StandaloneWindows64'
        env:
          CLIENT_BUILD: ${{ inputs.client_build }}
          EMBED: ${{ inputs.embed_client_key }}
        run: |
          # embed_client_key (the bake step above refused a missing secret): the package is KEYED, else it is a DEV package.
          # unity_build.json gets the boolean "embed_client_key" (never the key); the publisher turns it into "dev": true in the
          # signed manifest of a dev package and the launcher does not offer such a package to players (unity/README.md "Sprite pair").
          keyed_flag=""
          if [ "$EMBED" = "true" ]; then
            keyed_flag="--embed-client-key"
            echo "::warning::KEYED package: the client guard key is inside this build, so it opens the sprite pair blobs and logs in to a live server. Whoever gets the zip can read the key out of it (the same as the main client's exe). Publish it only as the owner decided (unity/README.md 'Sprite pair')."
          else
            echo "::notice::DEV package: no client key inside (embed_client_key is false). It answers the guard with the public development key, cannot open the encrypted sprite pair, and the launcher will not offer it to players."
          fi
          exe=$(find build/StandaloneWindows64 -maxdepth 3 -name ChaosUnity.exe -type f | head -n 1)
          if [ -z "$exe" ]; then echo "::error::no ChaosUnity.exe under build/StandaloneWindows64"; ls -R build | head -30; exit 1; fi
          sudo chmod -R a+rX build
          mkdir -p unity-package
          python3 -I client/tools/make_unity_manifest.py pack "$(dirname "$exe")" --out unity-package/CindersOfChaos-Unity-Windows.zip --package "$CLIENT_BUILD" $keyed_flag
          unzip -p unity-package/CindersOfChaos-Unity-Windows.zip unity_build.json | python3 -I -c 'import json,sys; print("unity_build.json: embed_client_key =", json.load(sys.stdin)["embed_client_key"])'
          (cd unity-package && sha256sum CindersOfChaos-Unity-Windows.zip | tee CindersOfChaos-Unity-Windows.zip.sha256)
          ls -l unity-package
      - uses: actions/upload-artifact@v4
        if: steps.lic.outputs.ok == '1' && inputs.target == 'StandaloneWindows64'
        with:
          name: chaos-unity-windows-package
          path: unity-package
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: steps.lic.outputs.ok == '1'
        with:
          name: chaos-unity-${{ inputs.target }}
          path: build/${{ inputs.target }}
          retention-days: 7
