name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.3 and LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.3 luajit

      - name: Lua syntax (Lua 5.3 and LuaJIT, the engine's interpreter)
        run: |
          status=0
          while IFS= read -r f; do
            luac5.3 -p "$f" || status=1
            luajit -bl "$f" > /dev/null || status=1
          done < <(git ls-files '*.lua')
          exit $status

      - name: Python syntax
        run: |
          status=0
          while IFS= read -r f; do
            python3 -I -m py_compile "$f" || status=1
          done < <(git ls-files '*.py')
          exit $status

      - name: Shell syntax
        run: |
          status=0
          while IFS= read -r f; do
            bash -n "$f" || status=1
          done < <(git ls-files '*.sh')
          exit $status

      - name: Server unit tests (mocked engine API)
        run: |
          cd server
          for t in tests/*_test.lua; do
            luajit "$t"
            lua5.3 "$t"
          done

      - name: Client unit tests (modules without client API)
        run: |
          for t in client/overlay/modules/*/*_test.lua; do
            luajit "$t"
            lua5.3 "$t"
          done

      - name: Client modules (otmod name, scripts)
        run: python3 -I tools/ci/check_modules.py

      - name: Client layouts (no fit-children on anchor-sized widgets)
        run: python3 -I tools/ci/check_layouts.py

      - name: Server content (XML, spells, items, monsters)
        run: python3 -I tools/ci/check_content.py

      - name: Item prices (table up to date, every loot priced or unsellable, no arbitrage, Auto Seller table; installer)
        run: |
          python3 -I server/tools/gen_item_prices.py --check
          python3 -I server/tools/install_item_prices_test.py

      - name: Client spell data is up to date with the server spells
        run: |
          pip install --quiet pillow
          python3 client/tools/gen_spell_data.py  # not -I: isolated mode ignores the user site where pip put Pillow
          git diff --exit-code client/overlay/modules/game_chaosspells/spelldata.lua

      - name: Rotations of at most 5 spells, never 2 s without one (rotation_sim.py; the helper's auto rotation data)
        run: |
          python3 -I server/tools/rotation_sim_test.py
          python3 -I server/tools/rotation_sim.py --check

      - name: Painted icons are up to date with their source sheet (gen_painted_icons.py)
        run: python3 client/tools/gen_painted_icons.py --check  # not -I: Pillow from the user site (installed above)

      - name: Bitmap font tool (make_fonts.py pure parts and the font atlas model)
        run: python3 client/tools/make_fonts_test.py  # not -I: Pillow from the user site (installed above)

      - name: Field timers generator (gen_field_timers.py on a small items.xml / items.otb)
        run: python3 -I client/tools/gen_field_timers_test.py

      - name: Client updater tools (manifest builder, signer, path rules)
        run: python3 -I client/tools/make_update_manifest_test.py

      - name: Sprite shard tool (split, verify, join on small synthetic .spr files)
        run: python3 -I client/tools/sprites/spr_shards_test.py

      - name: Server hang watchdog (status probe, restart decision)
        run: python3 -I server/tools/chaos_watchdog_test.py

      - name: Server health alerts (state changes, error-line rate limit, daily summary)
        run: python3 -I server/tools/chaos_health_test.py

      - name: Area generator export (the Lua generator's dump, OTBM writer and reader, spawn file)
        run: python3 -I server/tools/areagen_export_test.py

      - name: Area planner (validator, reachability maths, layout, compiler, decoration, place; the example plans)
        run: |
          # system numpy: place reads maps with tools/map/otbm.py (python3 -I does not see pip's user site)
          sudo apt-get install -y -qq python3-numpy
          python3 -I server/tools/area_planner_test.py
          d=$(mktemp -d)
          for p in server/tools/areaplan/examples/*.json; do
            python3 -I server/tools/area_planner.py validate "$p"
            python3 -I server/tools/area_planner.py compile "$p" "$d"
          done

      - name: Points of interest generator (gen_poi.py on a small built map)
        run: python3 -I server/tools/gen_poi_test.py

      - name: Load test tool (failure reasons, bot password hashes, spread over towns and hunting areas)
        run: python3 -I server/tools/loadtest_test.py

      - name: Network message buffer stays unzeroed (server src-patch 0032)
        run: python3 -I server/tools/netmsg_buffer_patch_test.py

      - name: A decay that cannot change the item ends (server src-patch 0033)
        run: python3 -I server/tools/decay_loop_patch_test.py

      - name: A reconnect to a lingering character is not thrown out nor left in the game (server src-patches 0034, 0035)
        run: python3 -I server/tools/reattach_ping_patch_test.py

      - name: Outfit shaders can be owned (server src-patch 0036)
        run: python3 -I server/tools/outfit_shader_patch_test.py

      - name: Everfull Ration install (items.otb / items.xml, synthetic)
        run: python3 -I server/tools/install_store_food_test.py

      - name: Loot Bag carries its loot without weight (server src-patch 0038, guard)
        run: python3 -I server/tools/weightless_patch_test.py

      - name: Chaos Pact stamina x1.5 (patch_base_events.py steps 13 and 14, stock copies)
        run: python3 -I server/tools/pact_stamina_patch_test.py

      - name: Combat numbers in the viewer's display scale (server src-patch 0037, guard)
        run: python3 -I server/tools/display_scale_patch_test.py

      - name: Display scale, pure parts (C++; header from server src-patch 0037)
        run: |
          d=$(mktemp -d)
          awk '/^\+\+\+ b\/src\/chaosdisplay\.h/{p=1; next} p&&/^(diff |--- )/{p=0} p&&/^\+/{print substr($0, 2)}' \
            server/src-patches/0037-display-scale.patch > "$d/chaosdisplay.h"
          g++ -std=c++17 -Wall -Wextra -I "$d" server/tools/chaosdisplay_test.cpp -o "$d/chaosdisplay_test"
          "$d/chaosdisplay_test"

      - name: Incremental save, pure parts (C++; header from server src-patch 0026)
        run: |
          d=$(mktemp -d)
          awk '/^\+\+\+ b\/src\/chaossave\.h/{p=1; next} p&&/^(diff |--- )/{p=0} p&&/^\+/{print substr($0, 2)}' \
            server/src-patches/0026-incremental-save.patch > "$d/chaossave.h"
          g++ -std=c++17 -Wall -Wextra -I "$d" server/tools/chaossave_test.cpp -o "$d/chaossave_test"
          "$d/chaossave_test"

      - name: Respawn zones index (C++; header from server src-patch 0027)
        run: |
          d=$(mktemp -d)
          awk '/^\+\+\+ b\/src\/chaoszones\.h/{p=1; next} p&&/^(diff |--- )/{p=0} p&&/^\+/{print substr($0, 2)}' \
            server/src-patches/0027-game-loop-stalls.patch > "$d/chaoszones.h"
          g++ -std=c++17 -Wall -Wextra -I "$d" server/tools/chaoszones_test.cpp -o "$d/chaoszones_test"
          "$d/chaoszones_test"

      - name: Login reads prefetch (C++; header from server src-patch 0031)
        run: |
          d=$(mktemp -d)
          awk '/^\+\+\+ b\/src\/chaosprefetch\.h/{p=1; next} p&&/^(diff |--- )/{p=0} p&&/^\+/{print substr($0, 2)}' \
            server/src-patches/0031-login-reads-prefetch.patch > "$d/chaosprefetch.h"
          g++ -std=c++17 -Wall -Wextra -I "$d" server/tools/chaosprefetch_test.cpp -o "$d/chaosprefetch_test"
          "$d/chaosprefetch_test"

      - name: Backup shell scripts parse
        run: |
          bash -n server/tools/backup.sh
          bash -n server/tools/backup_offsite.sh
          sh -n server/tools/chaos_crashlog.sh

      - name: Client update manifest (unsigned dry run over the overlay)
        run: |
          d=$(mktemp -d)
          echo '-- CI stand-in for an assembled client' > "$d/init.lua"
          cp -r client/overlay/modules client/overlay/data "$d/"
          python3 -I client/tools/make_update_manifest.py build "$d" --dry-run

      - name: Client shaders compile (glslangValidator; GLSL 1.10 and ES 1.00; files and base patch programs)
        run: |
          sudo apt-get install -y -qq glslang-tools
          python3 -I client/tools/check_shaders.py --require-glslang

      - name: Client updater signature vectors (C++, OpenSSL; header from base patch 0031)
        run: |
          d=$(mktemp -d)
          awk '/^--- a\/src\/framework\/util\/chaosupdate\.h/{p=1} p&&/^--- a\//&&!/chaosupdate\.h/{p=0} p' \
            client/base-patches/0031-signed-updater.patch > "$d/h.patch"
          patch -p1 -d "$d" < "$d/h.patch"
          g++ -std=c++17 -I "$d/src" client/tools/chaosupdate_test.cpp -lcrypto -o "$d/chaosupdate_test"
          "$d/chaosupdate_test"

      - name: Client guard handshake vectors (C++, OpenSSL; header from base patch 0035)
        run: |
          d=$(mktemp -d)
          awk '/^--- a\/src\/client\/chaosguard\.h/{p=1} p&&/^--- a\//&&!/chaosguard\.h/{p=0} p' \
            client/base-patches/0035-client-guard.patch > "$d/h.patch"
          patch -p1 -d "$d" < "$d/h.patch"
          g++ -std=c++17 -I "$d/src/client" client/tools/chaosguard_test.cpp -lcrypto -o "$d/chaosguard_test"
          "$d/chaosguard_test"

      - name: Big creature click maths (C++; header from base patch 0051)
        run: |
          d=$(mktemp -d)
          awk '/^--- a\/src\/client\/creaturehit\.h/{p=1} p&&/^--- a\//&&!/creaturehit\.h/{p=0} p' \
            client/base-patches/0051-big-creature-click.patch > "$d/h.patch"
          patch -p1 -d "$d" < "$d/h.patch"
          g++ -std=c++17 -Wall -Wextra -I "$d/src/client" client/tools/creaturehit_test.cpp -o "$d/creaturehit_test"
          "$d/creaturehit_test"

      - name: PROXY protocol parser (C++; source from server src-patch 0025)
        run: |
          d=$(mktemp -d)
          awk '/^--- a\/src\/proxyprotocol\.(cpp|h)/{p=1} p&&/^--- a\//&&!/proxyprotocol\./{p=0} p' \
            server/src-patches/0025-proxy-protocol.patch > "$d/h.patch"
          patch -p1 -d "$d" < "$d/h.patch"
          g++ -std=c++17 -Wall -I server/tools/proxyprotocol_stubs -I "$d/src" "$d/src/proxyprotocol.cpp" \
            server/tools/proxyprotocol_test.cpp -o "$d/proxyprotocol_test"
          "$d/proxyprotocol_test"

      - name: Gateway and backend firewall scripts (render and check, no changes)
        run: |
          bash -n server/deploy/gateway/setup_gateway.sh
          bash -n server/deploy/firewall/setup_backend_firewall.sh
          server/deploy/gateway/setup_gateway.sh 203.0.113.10 --dry-run > /dev/null
          server/deploy/firewall/setup_backend_firewall.sh 203.0.113.10,203.0.113.11 --admin-ips any --dry-run > /dev/null

      - name: Live server update script (chaos_update.sh on a throwaway repo with stubs; update, refusals, rollback)
        run: |
          bash -n server/deploy/chaos_update.sh
          python3 -I server/deploy/chaos_update_test.py

      - name: Unique item specs are up to date with chaos_items.xml
        run: |
          cd server && python3 -I tools/gen_unique_specs.py
          git diff --exit-code data/lib/chaos_unique_specs.lua

      - name: Codex data is up to date with the server data files
        run: |
          cd server
          luajit tools/gen_codex_data.lua
          lua5.3 tools/gen_codex_data.lua --check  # Lua 5.3 must write the same bytes
          git diff --exit-code ../client/overlay/modules/game_codex/codex_data.lua

      - name: Website wiki data is up to date with the server data files (gen_wiki_data.lua)
        run: |
          cd server
          luajit tools/gen_wiki_data.lua --check
          lua5.3 tools/gen_wiki_data.lua --check  # Lua 5.3 must give the same bytes

      - name: Passive tree data is up to date with the client tree (Lua 5.3 and LuaJIT write the same file)
        run: |
          cd client/overlay/modules/game_passivetree/treedata
          out=../../../../../server/data/scripts/chaos/passivetree_data.lua
          luajit ../../../../../server/tools/gen_passivetree_data.lua "$out"
          git diff --exit-code "$out"
          lua5.3 ../../../../../server/tools/gen_passivetree_data.lua "$out"
          git diff --exit-code "$out"

      - name: Monster looks match client/tools/sprites/monster_looks/picks.csv
        run: python3 -I server/tools/apply_monster_looks.py --check

      - name: Sprite pair checker (check_pair.py on synthetic pairs, append-only guard)
        run: python3 -I client/tools/sprites/check_pair_test.py

      - name: Pair warning fixes (fix_pair_warnings.py on a synthetic pair)
        run: python3 -I client/tools/sprites/fix_pair_warnings_test.py

      - name: Outfit layer composer (compose_outfit.py on synthetic things, import round trip), outfit anchors
        run: |
          # system packages: python3 -I does not see pip's user site
          sudo apt-get install -y -qq python3-numpy python3-pil
          python3 -I client/tools/sprites/compose_outfit_test.py
          # the character select's anchors: centre, ground row, floating looks (synthetic figures)
          python3 -I client/tools/sprites/gen_outfit_anchors_test.py
          # class effect strips and spec match the generator; Pillow's polygon fill differs between versions, so the
          # check runs on the versions the strips were made with (gen_class_fx.py docstring)
          python3 -m venv /tmp/fxenv
          /tmp/fxenv/bin/pip install --quiet pillow==12.3.0 numpy==2.5.3
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_class_fx.py build --check
          # themed sets, auras, wings and grounds of things_custom24: atlases and spec match the generator (same pins)
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_theme_art.py build --check
          python3 -I server/tools/install_theme_items.py --lua --check
          # pack effect cuts: spec and sums match gen_pack_fx.py's table (the art set and the strips are not in git)
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack_fx.py build --check
          # large soft effects: a full render (about 2 minutes) against the spec and the pixel sums (strips not in git)
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_big_fx.py build --check
          python3 -I client/tools/sprites/donor_pick_test.py

      - name: Website wiki art is up to date with the wiki data (gen_wiki_art.py)
        # icons, guide heroes and tab banners; the same pinned Pillow and numpy as the art checks above (WebP bytes)
        run: /tmp/fxenv/bin/python -I website/tools/gen_wiki_art.py --check

      - name: Class look art (class_art.py sheets read back by the importer, quick renders, import round trip)
        run: python3 -I client/tools/outfit_art/class_art_test.py

      - name: Website sprite images (gen_sprite_images_test.py; outfit colours on hand-made masks, a synthetic pair)
        run: python3 -I website/tools/gen_sprite_images_test.py

      - name: PHP for the website tests (php-cli with PDO SQLite and mbstring)
        run: |
          if ! php -r 'exit(extension_loaded("pdo_sqlite") && extension_loaded("mbstring") ? 0 : 1);' 2>/dev/null; then
            sudo apt-get install -y -qq php-cli php-sqlite3 php-mbstring
          fi
          php --version | head -1

      - name: Website PHP syntax
        run: |
          status=0
          while IFS= read -r f; do
            out=$(php -l "$f" 2>&1) || { echo "$out"; status=1; }
          done < <(git ls-files 'website/*.php')
          exit $status

      - name: Website unit tests (php-cli, in-memory SQLite, no network)
        run: |
          status=0
          for t in website/tests/*_test.php; do
            php "$t" || { echo "FAILED: $t"; status=1; }
          done
          exit $status

      - name: No references to other servers or clients
        run: python3 -I tools/ci/check_names.py

  live-pair:
    name: Live sprite pair (check_pair.py on windows-assets)
    # the pair is on this repository's windows-assets branch, which the default read token reaches; pull requests from
    # forks have no access to it and skip the job
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: chaos

      - name: Check out the live pair (read only)
        uses: actions/checkout@v4
        with:
          ref: windows-assets
          path: assets
          sparse-checkout: |
            things
            SHA256SUMS.parts
          sparse-checkout-cone-mode: true

      - name: Check the pair (client parse rules, sprite records, animations, masks)
        run: |
          set -euo pipefail
          (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts)
          mkdir -p "$RUNNER_TEMP/pair"
          tar -xJf assets/things/things-1098.tar.xz -C "$RUNNER_TEMP/pair"
          python3 -I chaos/client/tools/sprites/check_pair.py "$RUNNER_TEMP/pair/Tibia.dat" "$RUNNER_TEMP/pair/Tibia.spr"

      - name: Recolour variants match the generator (gen_theme_art.py recolour reads the pair's own monster looks)
        run: |
          python3 -m venv /tmp/fxenv
          /tmp/fxenv/bin/pip install --quiet pillow==12.3.0 numpy==2.5.3
          /tmp/fxenv/bin/python -I chaos/client/tools/sprites/gen_theme_art.py recolour --check \
              --dat "$RUNNER_TEMP/pair/Tibia.dat" --spr "$RUNNER_TEMP/pair/Tibia.spr"

      - name: Character select feet table matches the pair (gen_outfit_anchors.py --check)
        run: |
          /tmp/fxenv/bin/python -I chaos/client/tools/sprites/gen_outfit_anchors.py --check \
              "$RUNNER_TEMP/pair/Tibia.dat" "$RUNNER_TEMP/pair/Tibia.spr"

      - name: Website sprite images draw from the live pair (gen_sprite_images.py, our art only, no items.otb)
        run: |
          /tmp/fxenv/bin/python -I chaos/website/tools/gen_sprite_images.py \
              --dat "$RUNNER_TEMP/pair/Tibia.dat" --spr "$RUNNER_TEMP/pair/Tibia.spr" --out-dir "$RUNNER_TEMP/siteimg"
