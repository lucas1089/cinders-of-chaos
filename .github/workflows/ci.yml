name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # server-tests, art and native split out of the one serial job so the run takes the longest of them, not the sum;
  # steps are moved verbatim, only the two unit test loops run in parallel (every test is its own process and
  # writes only under its own os.tmpname)
  server-tests:
    name: Server and client unit tests (Lua 5.3 and LuaJIT, parallel)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.3 and LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.3 luajit

      - name: Server unit tests (mocked engine API)
        run: |
          cd server
          log=$(mktemp -d)
          set -- tests/*_test.lua
          # shellcheck disable=SC2016
          printf '%s\n' "$@" | xargs -P "$(nproc)" -I{} sh -c '
            t="$1"; l="$2/$(echo "$t" | tr / _).log"
            { echo "== luajit $t"; luajit "$t" && echo "== lua5.3 $t" && lua5.3 "$t"; } > "$l" 2>&1 \
              && rm -f "$l" || echo "$t" >> "$2/FAILED"
          ' _ {} "$log"
          if [ -s "$log/FAILED" ]; then
            sort "$log/FAILED" | while IFS= read -r t; do
              echo "::group::FAILED $t"
              cat "$log/$(echo "$t" | tr / _).log"
              echo "::endgroup::"
            done
            echo "FAILED: $(wc -l < "$log/FAILED") of $# server tests (output above)"
            exit 1
          fi

      - name: Client unit tests (modules without client API)
        run: |
          log=$(mktemp -d)
          set -- client/overlay/modules/*/*_test.lua
          # shellcheck disable=SC2016
          printf '%s\n' "$@" | xargs -P "$(nproc)" -I{} sh -c '
            t="$1"; l="$2/$(echo "$t" | tr / _).log"
            { echo "== luajit $t"; luajit "$t" && echo "== lua5.3 $t" && lua5.3 "$t"; } > "$l" 2>&1 \
              && rm -f "$l" || echo "$t" >> "$2/FAILED"
          ' _ {} "$log"
          if [ -s "$log/FAILED" ]; then
            sort "$log/FAILED" | while IFS= read -r t; do
              echo "::group::FAILED $t"
              cat "$log/$(echo "$t" | tr / _).log"
              echo "::endgroup::"
            done
            echo "FAILED: $(wc -l < "$log/FAILED") of $# client tests (output above)"
            exit 1
          fi

  art:
    name: Sprite and art generators (pinned Pillow and numpy, wiki art, spectator, cast relay)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.3 and LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.3 luajit

      - name: Outfit layer composer (compose_outfit.py on synthetic things, import round trip), outfit anchors
        run: |
          # system packages: python3 -I does not see pip's user site
          sudo apt-get install -y -qq python3-numpy python3-pil
          python3 -I client/tools/sprites/compose_outfit_test.py
          # the character select's anchors: centre, ground row, floating looks (synthetic figures)
          python3 -I client/tools/sprites/gen_outfit_anchors_test.py
          # names over tall looks: body top, gap and lift (synthetic figures)
          python3 -I client/tools/sprites/gen_info_lift_test.py
          # class effect strips and spec match the generator; Pillow's polygon fill differs between versions, so the
          # check runs on the versions the strips were made with (gen_class_fx.py docstring)
          python3 -m venv /tmp/fxenv
          /tmp/fxenv/bin/pip install --quiet pillow==12.3.0 numpy==2.5.3
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_class_fx.py build --check
          /tmp/fxenv/bin/python -I client/tools/gen_aura_art.py --check   # chest and Templar aura strips of game_chestaura (O315)
          # pair 36 effects: specs, sources and sums agree, names free, missiles uint8 (the pack art is never in git)
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack36_fx.py build --check
          # pair 41: pair 36's projectile missiles redrawn from the native 32 px renders and three appended: spec, sources
          # and sums agree, ids 251-253 (the pack art is never in git); the test uses synthetic images
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack41_missiles.py build --check
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack41_missiles_test.py
          # send offsets of the pair 36 effects redrawn in place (server/data/lib/chaos_fx_send_offsets.lua)
          python3 -I client/tools/sprites/gen_fx_send_offsets.py --check
          python3 -I client/tools/sprites/gen_fx_send_offsets_test.py
          # themed sets, auras, wings and grounds of things_custom24: atlases and spec match the generator (same pins)
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_theme_art.py build --check
          python3 -I server/tools/install_theme_items.py --lua --check
          # pack effect cuts: spec and sums match gen_pack_fx.py's table (the art set and the strips are not in git)
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack_fx.py build --check
          # pack farming spell effects (pair 27 trial): spec and sums match gen_pack27_fx.py's table (sets not in git)
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack27_fx.py build --check
          # Mystic line effects, Tier B (pair 29): spec, sums and sources match gen_pack29_fx.py's table (sets not in git)
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack29_fx.py build --check
          # condition auras, blasts, missiles, fireworks and hit splashes of pair 29 (the VFX packs, not in git)
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack29_vfx.py build --check
          # third-party art of pair 30 (set30 packs, import-only, not in git): spec, sums and sources match each generator's tables
          python3 -I client/tools/sprites/pack30lib_test.py
          python3 -I tools/windows/editor_versions_test.py
          python3 -I tools/windows/editor_creatures_test.py
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack30_looks.py build --check
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack30_looks_test.py
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack30_strips.py build --check
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack30_strips_test.py
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack30_grounds.py build --check
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack30_grounds_test.py
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack30_decor.py build --check
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack30_decor_test.py
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack30_bldg.py build --check
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack30_bldg_test.py
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack30_anim.py build --check
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack30_anim_test.py
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack30_items.py build --check
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack30_items_test.py
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack30_fx.py build --check
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack30_fx_test.py
          # the pair 33 packs (import-only, sheets not in git): the committed tables agree with each other, and the
          # server's generated wings / head accessories / capes (ids, prices, aura manifest) match them
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack33.py build --check
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack33_test.py
          python3 -I server/tools/gen_pack33_cosmetics.py --check
          # the owner's outfits of pair 37 (.obd files, source pack unnamed; sheets not in git): things file, sums,
          # sources and the server's look list agree; the .obd reader and the sheet layout on synthetic files
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack37_looks.py build --check
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_pack37_looks_test.py
          # the creature palette pass of pair 40 (pair not in git): the report lists the target looks with their
          # status; the palette, accent guard, despeckle and mask rules on synthetic sprites
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_creature_palette.py build --check
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_creature_palette_test.py
          # the Archmage of pair 29 (our own rig art): things file and sheet sums match class_art.py (no render)
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_archmage_art.py build --check
          # large soft effects: a full render (about 2 minutes) against the spec and the pixel sums (strips not in git)
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_big_fx.py build --check
          # gem looks (the owner's gem set): atlas, things spec and the Codex strips match the generator (same pins)
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_gem_art.py build --check
          # status words (the owner's text effect set): the spec matches the strips and the PICKS table
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_status_fx.py build --check
          # the store item looks of pair 34 (our pouch and ration art snapped to theme palettes): atlas and things file
          # match the generator, and each look passes style_check against its theme
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_store_items_art.py build --check
          # the orb looks of pair 38 (orbs drawn in code, no rune sprite): atlas and things file match the generator,
          # and each look passes style_check against its theme
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_orb_items_art.py build --check
          # the Cursed Chest looks of pair 43 (three PixelLab chests, 2 x 2 items): committed sources, atlas, things file
          # and sums match the generator, and each look passes style_check on its own colours
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_cursed_chest_art.py build --check
          # pair 53 redraws the cursed chest 38642 as one 32 x 32 tile (PixelLab file K3, ours): source, atlas, things
          # file and sums match the generator, and the look passes style_check on its own colours
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_cursed_chest_art.py build-k3 --check
          python3 -I client/tools/sprites/gen_cursed_chest_art_test.py
          # the Everfull potion looks of pair 44 (twelve PixelLab flasks, 1 x 1 items): committed sources, atlas, things file
          # and sums match the generator, each look passes style_check, and the ids agree with potions_config.lua
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_everfull_art.py build --check
          python3 -I client/tools/sprites/gen_everfull_art_test.py
          # the Ember pickup look of pair 55 (one PixelLab portal, a 1 x 1 item): committed source, atlas, things file and
          # sums match the generator, the look passes style_check, and the ids agree with pickups_config.lua
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_portal_art.py build --check
          python3 -I client/tools/sprites/gen_portal_art_test.py
          # the Monk fist weapon looks of pair 56 (thirteen PixelLab 32 x 32 items: six claws, four uniques, three new
          # weapons): committed sources, atlas, things file and sums match the generator, each look passes style_check
          # on its own colours, and the ids agree with server/data/items/fist_claws.csv
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_fist2_art.py build --check
          python3 -I client/tools/sprites/gen_fist2_art_test.py
          # the 34 weapons above level 800 of pair 56 (nine bows, four crossbows, nine wands, nine rods, a two-handed sword, axe
          # and maul; PixelLab 32 x 32 items, client ids 44412-44445): committed sources, atlas, things file, credits and sums
          # match the generator, each look passes style_check on its own colours, and the ids agree with
          # server/data/items/weapons800.csv
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_weapons800_art.py build --check
          python3 -I client/tools/sprites/gen_weapons800_art_test.py
          # the Reward Chest look of pair 45 (one PixelLab chest, a 2 x 2 item): committed source, atlas, things file and
          # sums match the generator, and the look passes style_check on its own colours
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_reward_chest_art.py build --check
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_reward_chest_art.py build-small --check
          # pair 53 redraws the reward chest 38758 from a purchased pack (O256): the atlas is not in git, so --check
          # verifies the recipe and the sums against themselves
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_reward_chest_art.py build-front --check
          python3 -I client/tools/sprites/gen_reward_chest_art_test.py
          # in-place item redraw (redraw_items.py on a synthetic pair, pair 53)
          /tmp/fxenv/bin/python -I client/tools/sprites/redraw_items_test.py
          # the support rune looks of pair 46 (100 PixelLab rune stones, 1 x 1 items) and the support icons: committed sources,
          # atlas, things file and sums match the generator, each look passes style_check, ids agree with the config
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_support_runes_art.py build --check
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_support_runes_art.py icons --check
          python3 -I client/tools/sprites/gen_support_runes_art_test.py
          python3 -I server/tools/install_supports_test.py
          # the jewelry looks of pair 35 (icon set picks): things file, atlas size and chaos_jewelry.lua bases agree
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_jewelry_art.py build --check
          # the owner's art of pair 26 (monster looks, wings, decoration): sheets, things file and picks match the spec
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_owner_art.py build --check
          python3 -I client/tools/sprites/gen_owner_art_test.py
          # the AutoSprite looks of pair 54 (Vharzul, Ashbound Thrall, Slagback Hound): sheets, things file, picks and sources match the spec
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_autosprite_art.py build --check
          python3 -I server/tools/install_owner_decor.py --lua --check
          python3 -I server/tools/install_owner_decor_test.py
          # pair 48 decoration (O266): the donor importer's wide-header reader and key prefix, the install step on synthetic files
          python3 -I client/tools/sprites/import_donor_things_test.py
          python3 -I server/tools/install_decor48_items_test.py
          # pair 49 decoration (O267): celestial and cursed props; the tables agree (the atlas is checked when the sources are there)
          python3 -I client/tools/sprites/gen_decor49.py build --check
          python3 -I client/tools/sprites/gen_decor49_test.py
          python3 -I server/tools/install_decor49_items_test.py
          # pair 50 (two purchased sprite sources): importer helpers, item install step, effect ids file
          python3 -I client/tools/sprites/import_pair50_test.py
          python3 -I client/tools/sprites/gen_pair50_fx_ids_test.py
          python3 -I client/tools/sprites/gen_pair50_fx_ids.py --check
          python3 -I server/tools/install_pair50_items_test.py
          # pair 51 missiles: the 62 freed missile ids refilled from the two sources; selection and name table
          python3 -I client/tools/sprites/import_pair51_missiles_test.py
          python3 -I client/tools/sprites/gen_pair51_missile_ids_test.py
          python3 -I client/tools/sprites/gen_pair51_missile_ids.py --check
          python3 -I server/tools/patch_npc_currency_test.py
          python3 -I server/tools/check_dead_holes_test.py   # floor changes that lead nowhere (O263; needs a map to run for real)
          python3 -I server/tools/patch_dead_holes_test.py   # the install step deadholes on a synthetic map
          python3 -I server/tools/patch_lava_edges_test.py   # the install step lavaedges on a synthetic map (O288)
          python3 -I server/tools/patch_crypt_floors_test.py   # the install step cryptfloors on a synthetic map (O288)
          python3 -I server/tools/patch_drops_channel_test.py  # the Drops channel of the drop feed (O260)
          # catacomb kit (pair 27 trial): spec, sources and picks match gen_assets_art.py's tables (kit files not in git)
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_assets_art.py build --check
          python3 -I client/tools/sprites/gen_assets_art_test.py
          python3 -I server/tools/install_assets_decor.py --lua --check
          python3 -I server/tools/install_assets_decor_test.py
          # equipment sets of pair 28 (the owner's sheets): atlases, things file and the generated pieces match the spec
          /tmp/fxenv/bin/python -I client/tools/sprites/gen_gear_sets_art.py build --check
          python3 -I client/tools/sprites/gen_gear_sets_art_test.py
          python3 -I server/tools/install_gear_sets.py --lua --check
          python3 -I server/tools/install_gear_sets_test.py
          # pack art of pair 30 (import-only): item installer, generated item Lua and Hideout list match the manifests (none yet: empty)
          python3 -I server/tools/install_pack30_items.py --lua --check
          python3 -I server/tools/install_pack30_items.py --hideout-lua --check
          python3 -I server/tools/install_pack30_items_test.py
          # harvest kit of pair 33 (import-only) and the Haunted Harvest's items: the server manifest and the kit Lua
          # follow the things file; installer and event items on a synthetic items.otb
          python3 -I server/tools/install_pack33_items.py --manifest --check
          python3 -I server/tools/install_pack33_items.py --lua --check
          python3 -I server/tools/install_pack33_items_test.py
          python3 -I server/tools/install_orbs_test.py  # renamed orb names; base names that hold one are kept
          # sprite style checker (docs/SPRITE_STYLE.md): palettes and thresholds match the owner's gear sheets,
          # synthetic sprites pass or fail for the right reason, the seven sheets pass their own themes
          /tmp/fxenv/bin/python -I client/tools/sprites/style_check.py build-palettes --check
          /tmp/fxenv/bin/python -I client/tools/sprites/style_check_test.py
          python3 -I client/tools/sprites/donor_pick_test.py

      - name: Website wiki art is up to date with the wiki data (gen_wiki_art.py)
        # icons, guide heroes and tab banners; the same pinned Pillow and numpy as the art checks above (WebP bytes)
        run: /tmp/fxenv/bin/python -I website/tools/gen_wiki_art.py --check

      - name: Dungeon banners match their plan and the dungeon maps (gen_dungeon_banners.py, no pair)
        # the plan's tiles, boss and monsters against a fresh areagen dump (LuaJIT), the banners' pixels against the plan
        run: /tmp/fxenv/bin/python -I client/tools/gen_dungeon_banners.py --check

      - name: Class look art (class_art.py sheets read back by the importer, quick renders, import round trip)
        run: python3 -I client/tools/outfit_art/class_art_test.py

      - name: Website sprite images (gen_sprite_images_test.py; outfit colours on hand-made masks, a synthetic pair)
        run: python3 -I website/tools/gen_sprite_images_test.py

      - name: Live spectator renderer (spectate_render_test.py; a synthetic pair, draw order, outfits, the pair archive)
        run: python3 -I server/tools/spectate_render_test.py

      - name: Live cast relay (cast_relay_test.py; synthetic frames for every opcode, sheets, the loop, a fuzz)
        run: python3 -I server/tools/cast_relay_test.py

  native:
    name: Native checks (C++ vectors, OpenSSL, fuzz harnesses, Rust services)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Refresh the apt index (the steps below install -dev packages)
        run: sudo apt-get update -qq

      - name: Display scale, pure parts (C++; header from server src-patch 0037)
        run: |
          d=$(mktemp -d)
          awk '/^\+\+\+ b\/src\/chaosdisplay\.h/{p=1; next} p&&/^(diff |--- )/{p=0} p&&/^\+/{print substr($0, 2)}' \
            server/src-patches/0037-display-scale.patch > "$d/chaosdisplay.h"
          g++ -std=c++17 -Wall -Wextra -I "$d" server/tools/chaosdisplay_test.cpp -o "$d/chaosdisplay_test"
          "$d/chaosdisplay_test"

      - name: Packet compression round trip (C++ and zlib; header from server src-patch 0069)
        run: |
          sudo apt-get install -y -qq zlib1g-dev
          d=$(mktemp -d)
          awk '/^\+\+\+ b\/src\/chaospacketcompress\.h/{p=1; next} p&&/^(diff |--- )/{p=0} p&&/^\+/{print substr($0, 2)}' \
            server/src-patches/0069-packet-compression.patch > "$d/chaospacketcompress.h"
          g++ -std=c++17 -O1 -Wall -Wextra -I "$d" server/tools/packet_compress_test.cpp -lz -o "$d/packet_compress_test"
          "$d/packet_compress_test"

      - name: Pathfinding node store and benchmark (C++; header from server src-patch 0070)
        run: |
          d=$(mktemp -d)
          awk '/^\+\+\+ b\/src\/chaospathing\.h/{p=1; next} p&&/^(diff |--- )/{p=0} p&&/^\+/{print substr($0, 2)}' \
            server/src-patches/0070-cheaper-pathfinding.patch > "$d/chaospathing.h"
          g++ -std=c++17 -O1 -Wall -Wextra -I "$d" server/tools/chaospathing_test.cpp -o "$d/chaospathing_test"
          "$d/chaospathing_test"
          g++ -std=c++17 -O1 -fsanitize=address,undefined -I "$d" server/tools/chaospathing_test.cpp -o "$d/chaospathing_asan"
          "$d/chaospathing_asan"
          g++ -std=c++17 -O2 -Wall -Wextra -I "$d" server/tools/path_bench.cpp -o "$d/path_bench"
          "$d/path_bench" --check

      - name: Spectator queries, cache and benchmark check (C++; header from server src-patch 0071)
        run: |
          d=$(mktemp -d)
          awk '/^\+\+\+ b\/src\/chaosspectators\.h/{p=1; next} p&&/^(diff |--- )/{p=0} p&&/^\+/{print substr($0, 2)}' \
            server/src-patches/0071-cheaper-spectators.patch > "$d/chaosspectators.h"
          g++ -std=c++17 -O1 -Wall -Wextra -I "$d" server/tools/chaosspectators_test.cpp -o "$d/chaosspectators_test"
          "$d/chaosspectators_test"
          g++ -std=c++17 -O1 -fsanitize=address,undefined -I "$d" server/tools/chaosspectators_test.cpp -o "$d/chaosspectators_asan"
          "$d/chaosspectators_asan"
          g++ -std=c++17 -O2 -Wall -Wextra -I "$d" server/tools/spectator_bench.cpp -o "$d/spectator_bench"
          "$d/spectator_bench" --check

      - name: Map description, byte equality and benchmark check (C++; header from server src-patch 0072)
        run: |
          d=$(mktemp -d)
          awk '/^\+\+\+ b\/src\/chaosmapdesc\.h/{p=1; next} p&&/^(diff |--- )/{p=0} p&&/^\+/{print substr($0, 2)}' \
            server/src-patches/0072-cheaper-map-description.patch > "$d/chaosmapdesc.h"
          g++ -std=c++17 -O1 -Wall -Wextra -I "$d" -I server/tools server/tools/chaosmapdesc_test.cpp -o "$d/chaosmapdesc_test"
          "$d/chaosmapdesc_test"
          g++ -std=c++17 -O1 -fsanitize=address,undefined -I "$d" -I server/tools server/tools/chaosmapdesc_test.cpp -o "$d/chaosmapdesc_asan"
          "$d/chaosmapdesc_asan"
          g++ -std=c++17 -O2 -Wall -Wextra -I "$d" -I server/tools server/tools/mapdesc_bench.cpp -o "$d/mapdesc_bench"
          "$d/mapdesc_bench" --check

      - name: Line of sight, answer equality and benchmark check (C++; header from server src-patch 0074)
        run: |
          d=$(mktemp -d)
          awk '/^\+\+\+ b\/src\/chaossight\.h/{p=1; next} p&&/^(diff |--- )/{p=0} p&&/^\+/{print substr($0, 2)}' \
            server/src-patches/0074-cheaper-line-of-sight.patch > "$d/chaossight.h"
          g++ -std=c++17 -O1 -Wall -Wextra -I "$d" -I server/tools server/tools/chaossight_test.cpp -o "$d/chaossight_test"
          "$d/chaossight_test"
          g++ -std=c++17 -O1 -fsanitize=address,undefined -I "$d" -I server/tools server/tools/chaossight_test.cpp -o "$d/chaossight_asan"
          "$d/chaossight_asan"
