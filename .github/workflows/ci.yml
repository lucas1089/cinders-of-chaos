  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.3 and LuaJIT
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.3 luajit

      - uses: actions/checkout@v4

      - name: Lua syntax (Lua 5.3 and LuaJIT, the engine's interpreter)
        run: |
          status=0
          while IFS= read -r f; do
            luac5.3 -p "$f" || status=1
            luajit -bl "$f" > /dev/null || status=1
          done < <(git ls-files '*.lua')
          exit $status

      - name: Python syntax
        run: |
          status=0
          while IFS= read -r f; do
            python3 -I -m py_compile "$f" || status=1
          done < <(git ls-files '*.py')
          exit $status

      - name: Shell syntax
        run: |
          status=0
          while IFS= read -r f; do
            bash -n "$f" || status=1
          done < <(git ls-files '*.sh')
          exit $status

      - name: Client modules (otmod name, scripts)
        run: |
          python3 -I tools/ci/check_modules.py
          python3 -I tools/ci/check_assembled_test.py

      - name: Client localization (every tr() key has pt-BR, no hard-coded UI text)
        run: python3 -I tools/ci/check_locales.py

