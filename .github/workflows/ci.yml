        run: python3 -I server/tools/stamina_catchup_patch_test.py

      - name: Store items kept on death (patch_base_events.py step 15, stock copy)
        run: python3 -I server/tools/death_keep_patch_test.py

      - name: Hit effects and missiles swapped from Lua (server src-patch 0045, pair 29 VFX packs)
        run: python3 -I server/tools/effect_overrides_patch_test.py

      - name: Gentle deaths (patch_base_events.py step 18, stock copy)
        run: python3 -I server/tools/gentle_death_patch_test.py

      - name: Combat numbers in the viewer's display scale (server src-patch 0037, guard)
        run: python3 -I server/tools/display_scale_patch_test.py

      - name: Player attack speed bonus, one attack per second (patch 0078)
        run: python3 -I server/tools/attack_speed_bonus_patch_test.py

      - name: Tester bots out of the base player lists (patch_tester_filters.py)
        run: python3 -I server/tools/patch_tester_filters_test.py

      - name: Backup shell scripts parse
        run: |
          bash -n server/tools/backup.sh
          bash -n server/tools/backup_offsite.sh
          sh -n server/tools/chaos_crashlog.sh

      - name: Client update manifest (unsigned dry run over the overlay)
        run: |
          d=$(mktemp -d)
          echo '-- CI stand-in for an assembled client' > "$d/init.lua"
          cp -r client/overlay/modules client/overlay/data "$d/"
          python3 -I client/tools/make_update_manifest.py build "$d" --dry-run

      - name: Client shaders compile (glslangValidator; GLSL 1.10 and ES 1.00; files and base patch programs)
        run: |
          sudo apt-get install -y -qq glslang-tools
          python3 -I client/tools/check_shaders.py --require-glslang

      - name: Base opcode handlers accept only a JSON object (patch_base_json_guards.py, synthetic copies)
        run: python3 -I server/tools/patch_base_json_guards_test.py
      - name: Base opcode handlers check their fields (patch_base_opcode_inputs.py, synthetic copies)
        run: python3 -I server/tools/patch_base_opcode_inputs_test.py
      - name: Base item fusion fuses only the ids of the Chaos list (patch_base_fusion_allowlist.py, stock excerpt)
        run: python3 -I server/tools/patch_base_fusion_allowlist_test.py

      - name: Gateway and backend firewall scripts (render and check, no changes)
        run: |
          bash -n server/deploy/gateway/setup_gateway.sh
          bash -n server/deploy/firewall/setup_backend_firewall.sh
          server/deploy/gateway/setup_gateway.sh 203.0.113.10 --dry-run > /dev/null
          server/deploy/firewall/setup_backend_firewall.sh 203.0.113.10,203.0.113.11 --admin-ips any --dry-run > /dev/null

      - name: systemd units (hardening lines, no core dumps, guarded root ExecStopPost; systemd-analyze verify)
        run: python3 -I server/deploy/chaos_units_test.py

      - name: Live server update script (chaos_update.sh on a throwaway repo with stubs; update, refusals, rollback)
        run: |
          bash -n server/deploy/chaos_update.sh
          python3 -I server/deploy/chaos_update_test.py

      - name: Admin app server side (chaos-ctl.sh with stubs; remote.cmd commands)
        run: |
          shellcheck server/deploy/chaos-ctl.sh
          python3 -I server/deploy/chaos_ctl_test.py

      - name: Admin app pure Java (Discord card, webhook URL check and status text; Bugs e sugestões parsing; Servidor como usuário chaos card; plain JVM)
        run: |
          mkdir -p /tmp/appjava
          javac -d /tmp/appjava android/app/src/main/java/com/cindersofchaos/admin/DiscordInfo.java android/app/src/test/java/com/cindersofchaos/admin/DiscordInfoTest.java
          java -cp /tmp/appjava com.cindersofchaos.admin.DiscordInfoTest
          javac -d /tmp/appjava android/app/src/main/java/com/cindersofchaos/admin/FeedbackInfo.java android/app/src/test/java/com/cindersofchaos/admin/FeedbackInfoTest.java
          java -cp /tmp/appjava com.cindersofchaos.admin.FeedbackInfoTest
          javac -d /tmp/appjava android/app/src/main/java/com/cindersofchaos/admin/ServerUserInfo.java android/app/src/test/java/com/cindersofchaos/admin/ServerUserInfoTest.java
          java -cp /tmp/appjava com.cindersofchaos.admin.ServerUserInfoTest

      - name: Kit server update (chaos_kit_update.sh with a fake repo, releases, systemctl and database; rates, rollback)
        run: |
          shellcheck server/deploy/chaos_kit_update.sh
          python3 -I server/deploy/chaos_kit_update_test.py

      - name: Players' changelog generator (gen_changelog.py on a throwaway repo with merges, tags, a shallow clone)
        run: python3 -I server/tools/gen_changelog_test.py

      - name: Client update publisher (publish_client_update.sh on a synthetic package, throwaway key)
        run: |
          shellcheck server/deploy/publish_client_update.sh
          python3 -I server/deploy/publish_client_update_test.py

      - name: Unique item specs are up to date with chaos_items.xml
        run: |
          cd server && python3 -I tools/gen_unique_specs.py
          git diff --exit-code data/lib/chaos_unique_specs.lua ../client/overlay/modules/client_chaos_locale/pt_br.lua

      - name: Unique passives balance model (O278)
        run: |
          cd server && luajit tools/unique_passives_model.lua --check && lua5.3 tools/unique_passives_model.lua --check

      - name: Codex data is up to date with the server data files
        run: |
          cd server
          luajit tools/gen_codex_data.lua
          lua5.3 tools/gen_codex_data.lua --check  # Lua 5.3 must write the same bytes
          git diff --exit-code ../client/overlay/modules/game_codex/codex_data.lua

      - name: Card descriptions are up to date with the card config (gen_card_descriptions.lua)
        run: |
          cd server
          luajit tools/gen_card_descriptions.lua --check
          lua5.3 tools/gen_card_descriptions.lua --check

      - name: Website wiki data is up to date with the server data files (gen_wiki_data.lua)
        run: |
          cd server
          luajit tools/gen_wiki_data.lua --check
          lua5.3 tools/gen_wiki_data.lua --check  # Lua 5.3 must give the same bytes

      - name: Attack speed lanes of the passive tree are in classlanes.lua (gen_class_lanes.lua --attack-speed)
        run: |
          cd server
          luajit tools/gen_class_lanes.lua --attack-speed --check
          lua5.3 tools/gen_class_lanes.lua --attack-speed --check

      - name: Passive tree data is up to date with the client tree (Lua 5.3 and LuaJIT write the same file)
        run: |
          cd client/overlay/modules/game_passivetree/treedata
          out=../../../../../server/data/scripts/chaos/passivetree_data.lua
          luajit ../../../../../server/tools/gen_passivetree_data.lua "$out"
          git diff --exit-code "$out"
          lua5.3 ../../../../../server/tools/gen_passivetree_data.lua "$out"
          git diff --exit-code "$out"

      - name: Monster looks match client/tools/sprites/monster_looks/picks.csv
        run: python3 -I server/tools/apply_monster_looks.py --check

      - name: Sprite pair checker (check_pair.py on synthetic pairs, append-only guard)
        run: python3 -I client/tools/sprites/check_pair_test.py

      - name: Pair warning fixes (fix_pair_warnings.py on a synthetic pair)
        run: python3 -I client/tools/sprites/fix_pair_warnings_test.py

      - name: Pair pruning (prune_pair.py on a synthetic pair)
        run: python3 -I client/tools/sprites/prune_pair_test.py

      - name: PHP for the website tests (php-cli with PDO SQLite and mbstring)
        run: |
          if ! php -r 'exit(extension_loaded("pdo_sqlite") && extension_loaded("mbstring") ? 0 : 1);' 2>/dev/null; then
            sudo apt-get install -y -qq php-cli php-sqlite3 php-mbstring
          fi
          php --version | head -1

      - name: Website PHP syntax
        run: |
          status=0
          while IFS= read -r f; do
            out=$(php -l "$f" 2>&1) || { echo "$out"; status=1; }
          done < <(git ls-files 'website/*.php')
          exit $status

      - name: Website unit tests (php-cli, in-memory SQLite, no network)
        run: |
          status=0
          for t in website/tests/*_test.php; do
            php "$t" || { echo "FAILED: $t"; status=1; }
          done
          exit $status

      - name: No references to other servers or clients
        run: python3 -I tools/ci/check_names.py

  live-pair:
    name: Live sprite pair (check_pair.py on windows-assets)
    # the pair is on this repository's windows-assets branch, which the default read token reaches; pull requests from
    # forks have no access to it and skip the job
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: chaos

      - name: Check out the live pair (read only)
        uses: actions/checkout@v4
        with:
          ref: windows-assets
          path: assets
          sparse-checkout: |
            things
            SHA256SUMS.parts
          sparse-checkout-cone-mode: true

      - name: Check the pair (client parse rules, sprite records, animations, masks)
        run: |
          set -euo pipefail
          (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts)
          mkdir -p "$RUNNER_TEMP/pair"
          cat assets/things/things-1098.tar.xz.part* | xz -d | tar -xf - -C "$RUNNER_TEMP/pair"
          python3 -I chaos/client/tools/sprites/check_pair.py "$RUNNER_TEMP/pair/Tibia.dat" "$RUNNER_TEMP/pair/Tibia.spr"

      - name: Recolour variants match the generator (gen_theme_art.py recolour reads the pair's own monster looks)
        run: |
          python3 -m venv /tmp/fxenv
          /tmp/fxenv/bin/pip install --quiet pillow==12.3.0 numpy==2.5.3
          /tmp/fxenv/bin/python -I chaos/client/tools/sprites/gen_theme_art.py recolour --check \
              --dat "$RUNNER_TEMP/pair/Tibia.dat" --spr "$RUNNER_TEMP/pair/Tibia.spr"

      - name: Character select feet table matches the pair (gen_outfit_anchors.py --check)
        run: |
          /tmp/fxenv/bin/python -I chaos/client/tools/sprites/gen_outfit_anchors.py --check \
              "$RUNNER_TEMP/pair/Tibia.dat" "$RUNNER_TEMP/pair/Tibia.spr"

      - name: Name lifts of tall looks match the pair (gen_info_lift.py --check)
        run: |
          /tmp/fxenv/bin/python -I chaos/client/tools/sprites/gen_info_lift.py --check \
              "$RUNNER_TEMP/pair/Tibia.dat" "$RUNNER_TEMP/pair/Tibia.spr"

      - name: Dungeon banners render from the live pair (gen_dungeon_banners.py --check with the pair)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq luajit
          /tmp/fxenv/bin/python -I chaos/client/tools/gen_dungeon_banners.py --check \
              --dat "$RUNNER_TEMP/pair/Tibia.dat" --spr "$RUNNER_TEMP/pair/Tibia.spr"

      - name: Website sprite images draw from the live pair (gen_sprite_images.py, our art only, no items.otb)
        run: |
          /tmp/fxenv/bin/python -I chaos/website/tools/gen_sprite_images.py \
              --dat "$RUNNER_TEMP/pair/Tibia.dat" --spr "$RUNNER_TEMP/pair/Tibia.spr" --out-dir "$RUNNER_TEMP/siteimg"
