# Our map editor (mapeditor/README.md, ROADMAP O382): the upstream editor at the commit pinned in mapeditor/UPSTREAM,
# mapeditor/patches/*.patch applied in name order (git apply), built for Windows x64 with the upstream CMake preset and
# vcpkg manifest (Qt 6 from vcpkg, pinned by the manifest's builtin-baseline), tested with the upstream CI test subset.
#
# Artifacts:
#   mapeditor-windows-x64   the release folder (the editor exe, its Qt runtime, data/, LICENSE, NOTICE)
#   mapeditor-source        the patched source as a zip, plus our patches, the pin and mapeditor/README.md in
#                           cinders-patches/ (AGPL-3.0: the source of what we ship goes with it)
#
# Release (O387, job release): a green patched build from main (push or dispatch, never pull_request) becomes the
# GitHub release mapeditor-<short sha of our commit> of this repository (artifacts expire, releases do not), assets:
#   mapeditor-<short>-windows-x64.zip   the release folder in one top folder of the same name
#   mapeditor-<short>-source.zip        the patched source with cinders-patches/
#   BUILD_INFO.txt                      upstream sha and repository, variant, our patches, our commit, the run
#   SHA256SUMS.txt                      the three files above
#   update-manifest.json                the self-updater's manifest: version, zip URL, sha256, size (O388)
# The rolling release mapeditor-latest holds only update-manifest.json of the newest build: the editor's self-updater
# (Cinders Map Editor, patch 0009) checks it. Version = upstream version + run number (1.1.43.N), so it counts up.
# The artifacts are uploaded only after the ctest step passed, so a release exists only for a tested build.
# windows-package.yml (input map_editor: ours) ships the newest one (tools/windows/editor_release.py latest-tag).
# One tag per commit, so a new build never changes the release a package is downloading (a rebuild of the same
# commit replaces its own release; the package checks SHA256SUMS.txt and falls back). The newest 5 are kept.
#
# Profile (input profile: true): a second build with only the harness patches (mapeditor/BASELINE_PATCHES), the
# merged Tibia.dat / Tibia.spr and the map master from the private branch windows-assets (as windows-package.yml
# gets them), and run_profile.py runs both builds on our map: load time, peak RAM, frame times while panning. The
# table goes into the job summary. Rendering on the runner is software (Mesa llvmpipe OpenGL or D3D11 WARP), good for
# before / after numbers of the same run, not for absolute FPS.
#
# The upstream repository is never written in this repo outside docs/CREDITS.md (tools/ci/check_names.py):
# mapeditor/tools/upstream.py takes it from the input upstream_repo, the repository variable MAPEDITOR_UPSTREAM_REPO,
# or the credits entry of the map editor.
#
# First run: vcpkg builds Qt (qtbase, qtdeclarative, qtshadertools, qtsvg), about 2 to 3 hours; the vcpkg binary cache
# (actions/cache, key: the manifest, the triplets) keeps the result, so later runs take about 20-30 minutes.
# Never on pull_request: PR checks stay fast.
name: Map editor build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Also build upstream + harness only and profile both on our map (needs the windows-assets branch)"
        type: boolean
        required: false
        default: false
      assets_ref:
        description: "Branch with things/ (dat/spr parts), world/ (map master) and server/ (base server)"
        required: false
        default: "windows-assets"
      profile_runs:
        description: "Runs per build and scenario"
        required: false
        default: "3"
      pan_seconds:
        description: "Seconds of panning per run"
        required: false
        default: "8"
      profile_backend:
        description: "Graphics on the runner (no GPU): OpenGL through Mesa llvmpipe, or Direct3D 11 WARP"
        type: choice
        options: [opengl-mesa, d3d11-warp]
        default: opengl-mesa
      mesa_version:
        description: "Mesa build for opengl-mesa (release tag of the Windows Mesa builds)"
        required: false
        default: "24.3.4"
      upstream_repo:
        description: "OWNER/NAME of the upstream editor (empty: variable MAPEDITOR_UPSTREAM_REPO, else docs/CREDITS.md)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "mapeditor/**"
      - ".github/workflows/mapeditor-build.yml"

permissions:
  contents: read

concurrency:
  group: mapeditor-build-${{ github.ref }}
  cancel-in-progress: false

env:
  VCPKG_ROOT: C:\v
  VCPKG_CACHE: C:\vb
  VCPKG_DISABLE_METRICS: "1"
  VCPKG_INSTALL_OPTIONS: --clean-after-build
  MAPEDITOR_UPSTREAM_REPO: ${{ vars.MAPEDITOR_UPSTREAM_REPO }}

jobs:
  build:
    name: Build (${{ matrix.variant }})
    runs-on: windows-2022
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        # baseline: upstream plus the harness patches only, built for the profile's "before" numbers
        variant: ${{ fromJSON(inputs.profile && '["patched","baseline"]' || '["patched"]') }}
    steps:
      - name: Check out Cinders of Chaos
        uses: actions/checkout@v4
        with:
          path: chaos

      - name: Upstream repository and pinned commit
        id: pin
        shell: bash
        run: python -I chaos/mapeditor/tools/upstream.py --repo "${{ inputs.upstream_repo }}" | tee -a "$GITHUB_OUTPUT"

      - name: Check out the upstream editor at the pin
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.sha }}
          path: src
          fetch-depth: 1
          persist-credentials: false

      - name: Apply our patches
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C src rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
          : > applied.txt
          for p in chaos/mapeditor/patches/*.patch; do
            name=$(basename "$p")
            if [ "${{ matrix.variant }}" = baseline ] && ! grep -qx "$name" chaos/mapeditor/BASELINE_PATCHES; then
              continue
            fi
            git -C src apply --whitespace=nowarn "../$p"
            echo "$name" | tee -a applied.txt
          done
          git -C src status --short

      - name: vcpkg at the manifest's baseline
        shell: pwsh
        run: |
          $baseline = (Get-Content src/vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          $tag = Select-String -Path src/scripts/build-release.ps1 -Pattern '^\$vcpkgTag = "([^"]+)"' |
            ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -First 1
          if (-not $baseline) { throw "vcpkg.json has no builtin-baseline" }
          Write-Host "vcpkg tag $tag, baseline $baseline"
          if ($tag) { git clone --branch $tag --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT }
          else { git clone --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT }
          if ($LASTEXITCODE -ne 0) { throw "cloning vcpkg failed" }
          if ((git -C $env:VCPKG_ROOT rev-parse HEAD).Trim() -ne $baseline) {
            git -C $env:VCPKG_ROOT fetch --depth 1 origin $baseline
            git -C $env:VCPKG_ROOT checkout --detach $baseline
            if ($LASTEXITCODE -ne 0) { throw "checking out the vcpkg baseline failed" }
          }
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "bootstrapping vcpkg failed" }
          New-Item -ItemType Directory -Force -Path $env:VCPKG_CACHE | Out-Null
          "VCPKG_BINARY_SOURCES=clear;files,$env:VCPKG_CACHE,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore the vcpkg binary cache (Qt)
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\vb
          key: mapeditor-vcpkg-v1-${{ hashFiles('src/vcpkg.json', 'src/triplets/**') }}
          restore-keys: mapeditor-vcpkg-v1-

      - name: Configure (vcpkg installs the dependencies)
        shell: pwsh
        working-directory: src
        run: |
          # O388: the version counts up with the run number (upstream version + run number, e.g. 1.1.43.57) and the
          # updater checks the releases of this repository (patch 0009); upstream's CMake ignores both in baseline
          cmake --preset windows-vcpkg "-DDME_BUILD_NUMBER=${{ github.run_number }}" `
            "-DDME_RELEASE_REPOSITORY=${{ github.repository }}"
          if ($LASTEXITCODE -ne 0) {
            $log = "build/vcpkg-windows/vcpkg-manifest-install.log"
            if (Test-Path $log) { Get-Content $log -Tail 80 }
            throw "CMake configuration failed with exit code $LASTEXITCODE"
          }

      - name: Save the vcpkg binary cache
        # saved also when a later step fails: every port vcpkg built is kept; one variant saves
        if: always() && matrix.variant == 'patched' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vb
          key: mapeditor-vcpkg-v1-${{ hashFiles('src/vcpkg.json', 'src/triplets/**') }}

      - name: Build the release package and the tests
        shell: pwsh
        working-directory: src
        run: |
          # the targets and tests of the upstream release workflow at the pinned commit
          $targets = @('package_all')
          if ('${{ matrix.variant }}' -eq 'patched') {
            $targets += 'ground_brush_export_test','wall_brush_export_test','brush_png_archive_test','obd_export_test',
              'dat_legacy_740_test','otbm_rme_compatibility_test','otbm_legacy_subtypes_test','otbm_numbered_zones_test',
              'ui_colorize_test','tibia_ui_qml_test','weather_particles_test','tilemapgen_assets_test'
          }
          cmake --build build/vcpkg-windows --config Release --target $targets --parallel
          if ($LASTEXITCODE -ne 0) { throw "the build failed with exit code $LASTEXITCODE" }

      - name: Tests (upstream CI subset)
        if: matrix.variant == 'patched'
        shell: pwsh
        working-directory: src
        env:
          QT_FORCE_STDERR_LOGGING: "1"
        run: |
          # The tests run from the build tree, before the release folder gets
          # its plugins: point Qt at the vcpkg plugin folder (sqldrivers,
          # platforms), or QSQLITE and the platform plugin are not found.
          $sql = Get-ChildItem build/vcpkg-windows -Recurse -Filter 'qsqlite*.dll' -ErrorAction SilentlyContinue |
            Where-Object { $_.Directory.Name -eq 'sqldrivers' -and $_.FullName -notmatch '\\debug\\' } | Select-Object -First 1
          if (-not $sql) { throw "no qsqlite plugin under build/vcpkg-windows" }
          $env:QT_PLUGIN_PATH = $sql.Directory.Parent.FullName
          Write-Host "QT_PLUGIN_PATH=$env:QT_PLUGIN_PATH"
          # the QML modules (QtQuick.Controls, QtQuick.Window) sit next to the plugins in Qt6/qml, which the
          # tibia_ui_qml test does not find from the build tree
          $qml = Join-Path $sql.Directory.Parent.Parent.FullName 'qml'
          if (-not (Test-Path (Join-Path $qml 'QtQuick'))) {
            $qq = Get-ChildItem build/vcpkg-windows -Recurse -Directory -Filter 'QtQuick' -ErrorAction SilentlyContinue |
              Where-Object { $_.Parent.Name -eq 'qml' -and $_.FullName -notmatch '\\debug\\' } | Select-Object -First 1
            if (-not $qq) { throw "no Qt6/qml/QtQuick under build/vcpkg-windows" }
            $qml = $qq.Parent.FullName
          }
          $env:QML_IMPORT_PATH = $qml
          $env:QML2_IMPORT_PATH = $qml
          Write-Host "QML_IMPORT_PATH=$qml"
          # vcpkg's qtbase has no offscreen plugin: the tests use the windows platform plugin (the runner has a desktop)
          Get-ChildItem (Join-Path $env:QT_PLUGIN_PATH 'platforms') -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "platform plugin: $($_.Name)" }
          ctest --test-dir build/vcpkg-windows -C Release --output-on-failure `
            -R '^(release_manifest|[a-z]+_startup|[a-z]+_updater_startup|ground_brush_export|wall_brush_export|brush_png_archive|obd_export|dat_legacy_740|otbm_rme_compatibility|otbm_legacy_subtypes|otbm_numbered_zones|ui_colorize|tibia_ui_qml|weather_particles|tilemapgen_assets)$'
          if ($LASTEXITCODE -ne 0) { throw "tests failed with exit code $LASTEXITCODE" }

      - name: Release folder and patched source
        shell: pwsh
        run: |
          $release = Get-ChildItem src/release -Directory | Where-Object { $_.Name -like '*-windows-x64' } | Select-Object -First 1
          $sourceZip = Get-ChildItem src/release -File | Where-Object { $_.Name -like '*-source.zip' } | Select-Object -First 1
          if (-not $release -or -not $sourceZip) { throw "the release package has no windows-x64 folder or source zip" }
          New-Item -ItemType Directory -Force -Path out/editor, out/source | Out-Null
          Copy-Item -Recurse "$($release.FullName)/*" out/editor/
          # our grounds, border sets and palettes (O514): merged into the editor's own brushes.json and tilesets.json
          # (it has no include), so the zip the self-updater installs carries them; the profile's baseline stays stock
          if ('${{ matrix.variant }}' -eq 'patched') {
            python -I chaos/mapeditor/tools/merge_brushes.py out/editor/data/1098
            if ($LASTEXITCODE -ne 0) { throw "merging our brushes failed with exit code $LASTEXITCODE" }
          }
          # the program's version (CMakeLists.txt project VERSION + DME_BUILD_NUMBER, patch 0009)
          $upVersion = Select-String -Path src/CMakeLists.txt -Pattern '^project\([^)]*VERSION ([0-9]+\.[0-9]+\.[0-9]+)' |
            ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -First 1
          if (-not $upVersion) { throw "src/CMakeLists.txt has no project VERSION" }
          $info = @(
            "version: $upVersion.${{ github.run_number }}",
            "upstream: ${{ steps.pin.outputs.sha }}",
            "upstream_repo: ${{ steps.pin.outputs.repo }}",
            "variant: ${{ matrix.variant }}",
            "patches: $((Get-Content applied.txt) -join ', ')",
            "cinders of chaos commit: $env:GITHUB_SHA",
            "built: $((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mmZ')) by run $env:GITHUB_RUN_ID"
          )
          $info | Set-Content -Encoding utf8 out/editor/BUILD_INFO.txt
          # AGPL-3.0: the patched source of this build, with our patches and the pin beside it
          Expand-Archive -Path $sourceZip.FullName -DestinationPath out/source
          $extra = New-Item -ItemType Directory -Force -Path out/source/cinders-patches
          Copy-Item chaos/mapeditor/README.md, chaos/mapeditor/UPSTREAM, chaos/mapeditor/BASELINE_PATCHES $extra.FullName
          Copy-Item -Recurse chaos/mapeditor/patches $extra.FullName
          # the data we merge into the editor's brushes and tilesets, and the tool that does it (O514)
          Copy-Item -Recurse chaos/mapeditor/data $extra.FullName
          Copy-Item chaos/mapeditor/tools/merge_brushes.py $extra.FullName
          Copy-Item applied.txt "$($extra.FullName)/APPLIED.txt"
          Compress-Archive -Path out/source/* -DestinationPath out/mapeditor-source.zip
          Get-ChildItem out/editor | Format-Table Name, Length

      - name: Upload the editor
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant == 'patched' && 'mapeditor-windows-x64' || 'mapeditor-baseline-windows-x64' }}
          path: out/editor
          retention-days: ${{ matrix.variant == 'patched' && 30 || 3 }}
          if-no-files-found: error

      - name: Upload the patched source
        if: matrix.variant == 'patched'
        uses: actions/upload-artifact@v4
        with:
          name: mapeditor-source
          path: out/mapeditor-source.zip
          retention-days: 30
          if-no-files-found: error

  release:
    name: Release (our build for the Windows package)
    needs: build
    # main only, never pull_request; also after a failed baseline build of the profile: the patched artifacts exist only
    # when the patched build and its ctest step passed (checked below)
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Get the tested build (editor)
        id: dl
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mapeditor-windows-x64
          path: dl/mapeditor-windows-x64

      - name: Get the tested build (source)
        id: dlsrc
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: mapeditor-source
          path: dl/mapeditor-source

      - name: Zips, BUILD_INFO.txt, SHA256SUMS.txt
        id: files
        run: |
          set -euo pipefail
          if [ "${{ steps.dl.outcome }}" != success ] || [ "${{ steps.dlsrc.outcome }}" != success ] ||
             [ ! -f dl/mapeditor-windows-x64/BUILD_INFO.txt ] || [ ! -f dl/mapeditor-source/mapeditor-source.zip ]; then
            # the build job is red already; nothing to release
            echo "::notice::no tested patched build in this run (build or ctest failed): no release"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          grep -qx 'variant: patched' <(tr -d '\r' < dl/mapeditor-windows-x64/BUILD_INFO.txt | sed 's/^\xef\xbb\xbf//')
          short=${GITHUB_SHA:0:7}
          name="mapeditor-$short"
          mkdir -p rel "pack/$name-windows-x64"
          cp -a dl/mapeditor-windows-x64/. "pack/$name-windows-x64/"
          (cd pack && zip -qrX "../rel/$name-windows-x64.zip" "$name-windows-x64")
          cp dl/mapeditor-source/mapeditor-source.zip "rel/$name-source.zip"
          cp dl/mapeditor-windows-x64/BUILD_INFO.txt rel/BUILD_INFO.txt
          (cd rel && sha256sum "$name-windows-x64.zip" "$name-source.zip" BUILD_INFO.txt > SHA256SUMS.txt)
          # the self-updater's manifest (O388, patch 0009; the format of the upstream update-manifest.json): the
          # version that counts up, the zip of this release, its sha256 and size. The rolling release
          # mapeditor-latest gets a copy (next steps); the editor reads it from there.
          version=$(tr -d '\r' < rel/BUILD_INFO.txt | sed 's/^\xef\xbb\xbf//' | sed -n 's/^version: *//p')
          [[ "$version" =~ ^[0-9]+(\.[0-9]+){3}$ ]] || { echo "::error::BUILD_INFO.txt has no build version"; exit 1; }
          base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases"
          jq -n --arg v "$version" --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "$base/download/$name/$name-windows-x64.zip" --arg page "$base/tag/$name" \
            --arg sha "$(sha256sum "rel/$name-windows-x64.zip" | cut -d' ' -f1)" \
            --argjson size "$(stat -c %s "rel/$name-windows-x64.zip")" \
            --arg notes "Cinders Map Editor $version (our build ${GITHUB_SHA:0:7}, run $GITHUB_RUN_ID)." \
            '{schemaVersion: 1, version: $v, publishedAt: $t, downloadUrl: $url, releasePageUrl: $page,
              sha256: $sha, size: $size, notes: $notes}' > rel/update-manifest.json
          ls -la rel
          cat rel/SHA256SUMS.txt rel/update-manifest.json
          { echo "tag=$name"; echo "version=$version"; echo "ok=true"; } >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: steps.files.outputs.ok == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.files.outputs.tag }}"
          {
            echo "Our build of the map editor (mapeditor/README.md): upstream at the pin plus our patches, built and"
            echo "tested by run [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
            echo "Licence GNU AGPL-3.0 (LICENSE and NOTICE in the zip); the patched source is the -source.zip."
            echo "The Windows package (input map_editor: ours) ships the newest of these releases."
            echo "Cinders Map Editor ${{ steps.files.outputs.version }}; its self-updater finds the newest build through the"
            echo "release mapeditor-latest (update-manifest.json)."
            echo
            echo '```'
            tr -d '\r' < rel/BUILD_INFO.txt | sed 's/^\xef\xbb\xbf//'
            echo
            cat rel/SHA256SUMS.txt
            echo '```'
          } > notes.md
          # a rebuild of the same commit replaces its release
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" -y --cleanup-tag
          fi
          # created without files, then uploaded (as windows-package.yml does): a create with files goes through a draft
          # release, which the workflow token is refused (HTTP 403 "Resource not accessible by integration", run 42290055431)
          gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Map editor build ${GITHUB_SHA:0:7}" --notes-file notes.md
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" --clobber rel/*
          {
            echo "## Map editor release $tag"
            echo
            cat notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      # O388: the editor's self-updater (patch 0009) reads update-manifest.json of the rolling release
      # mapeditor-latest. It moves to this build unless it already names a newer version (a re-run of an old run).
      - name: Point the self-updater at this build (release mapeditor-latest)
        id: roll
        if: steps.files.outputs.ok == 'true'
        run: |
          set -euo pipefail
          roll=mapeditor-latest
          new="${{ steps.files.outputs.version }}"
          keep="${{ steps.files.outputs.tag }}"
          {
            echo "Rolling release for the self-updater of our map editor build (Cinders Map Editor, mapeditor/README.md)."
            echo "Its update-manifest.json names the newest tested build: version, zip URL, SHA-256, size."
            echo "Moved by the workflow Map editor build. Do not delete it: the editor checks it on every start."
          } > roll.md
          if gh release view "$roll" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            rm -rf cur
            mkdir cur
            if gh release download "$roll" -R "$GITHUB_REPOSITORY" -D cur -p update-manifest.json 2> /dev/null; then
              old=$(jq -r '.version // ""' cur/update-manifest.json 2> /dev/null || true)
              if [ -n "$old" ] && [ "$(printf '%s\n%s\n' "$old" "$new" | sort -V | tail -n 1)" != "$new" ]; then
                echo "::notice::$roll names $old, newer than $new: left as it is"
                keep=$(jq -r '.downloadUrl // ""' cur/update-manifest.json | sed -n 's|.*/releases/download/\([^/]*\)/.*|\1|p')
                echo "keep=$keep" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            gh release upload "$roll" -R "$GITHUB_REPOSITORY" --clobber rel/update-manifest.json
            gh release edit "$roll" -R "$GITHUB_REPOSITORY" --prerelease --latest=false --notes-file roll.md
          else
            gh release create "$roll" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Map editor updates" --notes-file roll.md
            gh release upload "$roll" -R "$GITHUB_REPOSITORY" --clobber rel/update-manifest.json
          fi
          echo "keep=$keep" >> "$GITHUB_OUTPUT"
          echo "- self-updater: $roll now names $new ($keep)" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the newest 5 editor releases
        if: steps.files.outputs.ok == 'true'
        env:
          KEEP: ${{ steps.roll.outputs.keep }}
        run: |
          # the release the self-updater points at is never removed (mapeditor-latest is not a mapeditor-<hex> tag)
          gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^mapeditor-[0-9a-f]{7,40}$"))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r tag; do
            if [ "$tag" = "$KEEP" ]; then continue; fi
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          done

  profile-data:
    name: Profile data (our items.otb and map)
    if: inputs.profile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Cinders of Chaos
        uses: actions/checkout@v4
        with:
          path: chaos

      - name: Check out the assets
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.assets_ref || 'windows-assets' }}
          path: assets
          sparse-checkout: |
            server
            world
            SHA256SUMS.parts
          sparse-checkout-cone-mode: true

      - name: The installed server's items and map (as the Windows package makes them)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-numpy luajit
          (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts)
          mkdir -p base work out/world
          tar -xJf assets/server/base-server.tar.xz -C base
          mv base/*/ work/server
          bash chaos/tools/windows/prepare_server.sh work/server assets/world
          cp work/server/data/items/items.otb work/server/data/items/items.xml out/
          name=$(sed -n 's/^mapName *= *"\([^"]*\)".*/\1/p' work/server/config.lua | head -1)
          test -n "$name"
          test -f "work/server/data/world/$name.otbm"
          cp work/server/data/world/"$name".otbm out/world/map.otbm
          # the spawn and house files the map names (optional for the editor)
          for f in work/server/data/world/"$name"-*.xml; do if [ -f "$f" ]; then cp "$f" out/world/; fi; done
          du -sh out/*

      - name: Upload the profile data
        uses: actions/upload-artifact@v4
        with:
          name: mapeditor-profile-data
          path: out
          retention-days: 1
          if-no-files-found: error

  profile:
    name: Profile (upstream + harness against ours)
    if: inputs.profile
    needs: [build, profile-data]
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Check out Cinders of Chaos
        uses: actions/checkout@v4
        with:
          path: chaos

      - name: Check out the dat/spr parts
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.assets_ref || 'windows-assets' }}
          path: assets
          sparse-checkout: |
            things
            SHA256SUMS.parts
          sparse-checkout-cone-mode: true

      - name: Get both builds and the profile data
        uses: actions/download-artifact@v4
        with:
          pattern: mapeditor-*
          path: art

      - name: Client folder (Tibia.dat, Tibia.spr, items.otb, Tibia.otfi)
        shell: bash
        run: |
          set -euo pipefail
          (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts)
          mkdir -p client
          cat assets/things/things-1098.tar.xz.part* | xz -d -T0 | tar -xf - -C client
          test -f client/Tibia.dat
          test -f client/Tibia.spr
          cp art/mapeditor-profile-data/items.otb art/mapeditor-profile-data/items.xml client/
          # the sprite info file: transparency and the extended format read from the spr (as the package does)
          python -I chaos/tools/windows/editor_versions.py client --otfi client/Tibia.otfi
          rm -rf assets/things
          ls -la client art/mapeditor-profile-data/world

      - name: Software OpenGL (Mesa llvmpipe) next to both builds
        if: inputs.profile_backend != 'd3d11-warp'
        shell: bash
        run: |
          set -euo pipefail
          v="${{ inputs.mesa_version || '24.3.4' }}"
          curl -fsSL -o mesa.7z "https://github.com/pal1000/mesa-dist-win/releases/download/$v/mesa3d-$v-release-msvc.7z"
          7z x -y -omesa mesa.7z > /dev/null
          for d in art/mapeditor-windows-x64 art/mapeditor-baseline-windows-x64; do
            cp mesa/x64/opengl32.dll "$d/"
            for f in libgallium_wgl.dll libglapi.dll; do if [ -f "mesa/x64/$f" ]; then cp "mesa/x64/$f" "$d/"; fi; done
          done
          echo "QSG_RHI_BACKEND=opengl" >> "$GITHUB_ENV"
          echo "GALLIUM_DRIVER=llvmpipe" >> "$GITHUB_ENV"
          echo "PROFILE_GRAPHICS=OpenGL, Mesa $v llvmpipe" >> "$GITHUB_ENV"

      - name: Direct3D 11 WARP
        if: inputs.profile_backend == 'd3d11-warp'
        shell: bash
        run: |
          echo "QSG_RHI_BACKEND=d3d11" >> "$GITHUB_ENV"
          echo "QSG_RHI_PREFER_SOFTWARE_RENDERER=1" >> "$GITHUB_ENV"
          echo "PROFILE_GRAPHICS=Direct3D 11 WARP" >> "$GITHUB_ENV"

      - name: Profile both builds
        shell: bash
        run: |
          set -euo pipefail
          exe() { find "$1" -maxdepth 1 -name '*.exe' ! -iname '*updater*' | head -1; }
          base=$(exe art/mapeditor-baseline-windows-x64)
          ours=$(exe art/mapeditor-windows-x64)
          test -n "$base"
          test -n "$ours"
          status=0
          python -I chaos/mapeditor/tools/run_profile.py \
            --build "upstream+harness=$base" --build "ours=$ours" \
            --map art/mapeditor-profile-data/world/map.otbm --client client --version 1098 \
            --runs "${{ inputs.profile_runs || '3' }}" --pan-seconds "${{ inputs.pan_seconds || '8' }}" \
            --logs profile-logs --markdown profile.md --json profile.json || status=$?
          {
            cat profile.md
            echo "- graphics: $PROFILE_GRAPHICS (software rendering: compare the two builds, not absolute FPS)"
            echo "- upstream: $(sed -n 's/^upstream: //p' art/mapeditor-windows-x64/BUILD_INFO.txt)"
            echo "- ours: $(sed -n 's/^patches: //p' art/mapeditor-windows-x64/BUILD_INFO.txt)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Upload the profile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mapeditor-profile-logs
          path: |
            profile-logs
            profile.md
            profile.json
          retention-days: 7
          if-no-files-found: ignore
