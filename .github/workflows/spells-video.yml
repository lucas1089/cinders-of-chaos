# Spell showcase video (O692, server/README.md "Spell showcase video (O692)"): the MAIN client (Linux build, CHAOS_RMLUI=OFF) films the new spell upgrades, the
# Forms and the combos on a real server of this commit, one staff character per showcase class (Elementalist, Deadeye, Illusionist). The artifact is `spells-video`:
# one MP4 per class, the report (what each video shows) and the client logs, with the account, the password and the guard key cut out. Nothing else is uploaded:
# no frame, no sprite file, no database, no key, no server log.
#
# MANUAL ONLY (workflow_dispatch). About 50 minutes of set-up (the base client and the sprite pair of the windows-assets branch, the client build of about 15
# minutes, the server of tools/ci/unity_live_check.sh --serve-only: the install of the content takes about 12), then about 5 minutes a class (login, ranks, the
# script; the film is at most `seconds` long).
#
# Parts, all reused from the boss video (O689, boss-video.yml) and the loot video (O676, loot-video.yml):
#   * client       client/tools/assemble_client.sh on the base client of windows-assets, built as client/LINUX.md "Build" says, then the sprite pair of
#                  windows-assets/things. The server host stays 127.0.0.1, the ports are the stock 7171 / 7172.
#   * server       tools/ci/unity_live_check.sh --serve-only with UL_SPELL_SHOWCASE=1: the base server of windows-assets, install_all.py of this commit, a private
#                  MariaDB, the engine of the newest winpkg release, the spell ranks switch ON in this run's server copy only (spell_ranks_config.lua `enabled`;
#                  the repository's file stays false; the monster health factor comes with it, fine for a test server), three staff characters "Showcase Xxx"
#                  (group 6, level 1000) and the TEST ONLY pack helper server/tools/spell_showcase.lua, which keeps six monsters round whichever one is online.
#   * run          tools/ci/spells_video.sh: Xvfb 1280x720; the test-only client module test_spelltour (client/overlay/modules/test_spelltour, armed only by
#                  CHAOS_SPELLTOUR=1) logs the character in, sets ranks with `/spellrank ID 20`, picks Forms through opcode 168 `pick`, casts every shown spell with no
#                  Form, Form I A / B and Form II A / B and then the combos, a pt-BR caption over each cast; ffmpeg x11grab records from the ready line to the end.
#
# Secrets: none. The client guard key is made in the run (openssl rand), masked, baked into the client build and given to tfs (UL_GUARD_KEY), so the guard runs in
# enforce mode with a key nobody else has. The login key (RSA) is the base server's own, public data, written into the client's init.lua
# (client/tools/set_rsa_key.py). The repository must be able to read its branch windows-assets and its winpkg releases (the default token).
name: Spells video

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "The longest the film of one class is, from the ready line (30 to 1800)"
        required: false
        default: "900"
      client_build:
        description: "Client build number baked into the client (the server accepts any build here)"
        required: false
        default: "30"

permissions:
  contents: read

concurrency:
  group: spells-video-${{ github.ref }}
  cancel-in-progress: false

jobs:
  video:
    name: Spell showcase video (Ubuntu 24.04)
    runs-on: ubuntu-24.04  # the private MariaDB of tools/ci/unity_live_check.sh does not install on the 26.04 image
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}
      CLIENT_BUILD: ${{ inputs.client_build }}
      FILM_SECONDS: ${{ inputs.seconds }}
    steps:
      - name: Check the inputs
        run: |
          if ! [[ "$CLIENT_BUILD" =~ ^[0-9]+$ ]] || [ "$CLIENT_BUILD" -lt 1 ] || [ "$CLIENT_BUILD" -gt 65535 ]; then
            echo "::error::client_build must be a number from 1 to 65535"
            exit 1
          fi
          if ! [[ "$FILM_SECONDS" =~ ^[0-9]+$ ]] || [ "$FILM_SECONDS" -lt 30 ] || [ "$FILM_SECONDS" -gt 1800 ]; then
            echo "::error::seconds must be a number from 30 to 1800"
            exit 1
          fi

      - name: Keep line endings as they are
        run: git config --global core.autocrlf false

      - name: Check out Cinders of Chaos
        uses: actions/checkout@v4
        with:
          path: chaos

      - name: Check out the assets
        uses: actions/checkout@v4
        with:
          ref: windows-assets
          path: assets
          sparse-checkout: |
            server
            world
            client
            things
            SHA256SUMS.parts
          sparse-checkout-cone-mode: true

      - name: Install the tools
        run: |
          sudo apt-get update -qq
          # the server (mariadb-server: the private database of the run; numpy and luajit: install step contentareas) and the client
          # (rmlui-client.yml and client/LINUX.md libraries, Xvfb with Mesa software GL, ffmpeg, file, xz)
          sudo apt-get install -y -qq --no-install-recommends \
            mariadb-server mariadb-client python3-numpy luajit \
            ninja-build cmake g++ git pkg-config file xz-utils patch \
            libboost-system-dev libboost-filesystem-dev libluajit-5.1-dev libphysfs-dev libssl-dev libzip-dev zlib1g-dev libbz2-dev \
            libglew-dev libgl1-mesa-dev libglu1-mesa-dev libegl-dev libx11-dev libxrandr-dev libopenal-dev libvorbis-dev libogg-dev \
            libfreetype-dev libpng-dev libbrotli-dev \
            xvfb xauth libgl1-mesa-dri ffmpeg
          # the system service is not used; a profile for /usr/sbin/mariadbd would keep the private data folder out
          sudo systemctl stop mariadb || true
          sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mariadbd 2>/dev/null || true
          # the Ubuntu 24.04 libphysfs.a ships without an archive index
          sudo ranlib /usr/lib/x86_64-linux-gnu/libphysfs.a
          ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx264

      - name: Make the guard key of the run
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "CHAOS_CLIENT_KEY=$key" >> "$GITHUB_ENV"
          echo "UL_GUARD_KEY=$key" >> "$GITHUB_ENV"

      - name: Assemble the client (base + client/base-patches + client/overlay)
        run: |
          (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts)
          mkdir base
          cat assets/client/base-client.tar.xz.part* | xz -d -T0 | tar -xf - -C base
          mv base/*/ base-client
          bash chaos/client/tools/assemble_client.sh "$GITHUB_WORKSPACE/base-client" "$GITHUB_WORKSPACE/game"
          rm -rf base base-client assets/client
          # the test only module is part of the overlay and must be in the assembled tree
          test -f game/modules/test_spelltour/spelltour.lua

      - name: Build the client (CHAOS_RMLUI=OFF, the key baked in)
        run: |
          cmake -S game -B game/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUAJIT=ON -DCHAOS_RMLUI=OFF \
            -DPHYSFS_LIBRARY=/usr/lib/x86_64-linux-gnu/libphysfs.so -DOPENAL_LIBRARY=/usr/lib/x86_64-linux-gnu/libopenal.so \
            -DCHAOS_CLIENT_BUILD="$CLIENT_BUILD"
          cmake --build game/build
          n=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q '^ELF 64-bit.*executable'; then
              cp -p "$f" game/chaos-client
              n=$((n + 1))
            fi
          done < <(find game/build -maxdepth 1 -type f -perm -u+x -print0)
          if [ "$n" -ne 1 ]; then
            echo "::error::expected one executable in the build folder, found $n"
            exit 1
          fi
          rm -rf game/build

      - name: Put the sprite pair into the client (it never leaves this job)
        run: |
          mkdir -p things game/data/things/1098
          cat assets/things/things-1098.tar.xz.part* | xz -d -T0 | tar -xf - -C things
          test -f things/Tibia.dat
          test -f things/Tibia.spr
          # the dat must be the pair the server step records (client_pair.py PAIR_ASSETS)
          want=$(python3 -I chaos/server/tools/client_pair.py assets-md5)
          have=$(md5sum things/Tibia.dat | cut -d' ' -f1)
          if [ "$have" != "$want" ]; then
            echo "::error::Tibia.dat md5 $have is not the pair of client_pair.py ($want)"
            exit 1
          fi
          find things -maxdepth 1 -type f ! -name Tibia.spr -exec cp -t game/data/things/1098/ {} +
          python3 -I chaos/client/tools/sprites/spr_shards.py split things/Tibia.spr game/data/things/1098
          python3 -I chaos/client/tools/sprites/spr_shards.py verify things/Tibia.spr game/data/things/1098
          rm -rf things assets/things
          df -h . | tail -n 1

      - name: Start the server with the showcase characters
        env:
          UL_ASSETS: ${{ github.workspace }}/assets
          UL_WORK: ${{ runner.temp }}/ul
          UL_IDENTITIES: chaos
          UL_LOGIN_PORT: "7171"
          UL_GAME_PORT: "7172"
          UL_SPELL_SHOWCASE: "1"
        run: |
          mkdir -p "$UL_WORK"
          bash chaos/tools/ci/unity_live_check.sh --serve-only
          test -f "$UL_WORK/client-chaos.env"
          for class in elementalist deadeye illusionist; do
            test -f "$UL_WORK/spell-$class.env"
            # the account and the password of a showcase character are not shown in any log
            ( . "$UL_WORK/spell-$class.env" && echo "::add-mask::$CHAOS_LIVE_ACCOUNT" && echo "::add-mask::$CHAOS_LIVE_PASSWORD" )
          done
          ( . "$UL_WORK/client-chaos.env" && echo "::add-mask::$CHAOS_LIVE_ACCOUNT" && echo "::add-mask::$CHAOS_LIVE_PASSWORD" )

      - name: Write the server login key into the client
        env:
          UL_WORK: ${{ runner.temp }}/ul
        run: |
          # the base server's own RSA modulus (public data); the stock default key is what the client already has
          modulus=$(. "$UL_WORK/client-chaos.env" && printf '%s' "$CHAOS_RSA_PUBLIC")
          if CHAOS_RSA_PUBLIC="$modulus" python3 -I chaos/client/tools/set_rsa_key.py game --from-env CHAOS_RSA_PUBLIC; then
            echo "the server key is in init.lua"
          else
            echo "::warning::the server key is the public default key or not usable: the client keeps the default key"
            python3 -I chaos/client/tools/set_rsa_key.py game --clear
          fi

      - name: Record the showcase
        env:
          UL_WORK: ${{ runner.temp }}/ul
          SV_SECONDS: ${{ inputs.seconds }}
        run: |
          mkdir -p "$RUNNER_TEMP/spells-video"
          bash chaos/tools/ci/spells_video.sh game "$RUNNER_TEMP/spells-video" \
            "$UL_WORK/spell-elementalist.env" "$UL_WORK/spell-deadeye.env" "$UL_WORK/spell-illusionist.env"

      - name: Stop the server
        if: always()
        env:
          UL_WORK: ${{ runner.temp }}/ul
        run: bash chaos/tools/ci/unity_live_check.sh --stop

      - name: Upload the videos and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spells-video
          # the MP4s, the report and the client logs (account, password and guard key cut out) only
          path: |
            ${{ runner.temp }}/spells-video/*.mp4
            ${{ runner.temp }}/spells-video/spells-report.txt
            ${{ runner.temp }}/spells-video/client-log-*.txt
          if-no-files-found: warn
          retention-days: 14
