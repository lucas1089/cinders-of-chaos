# Android game client (O313, docs/ANDROID_CLIENT.md): the engine for android arm64 with the NDK and CMake
# (client base patches 0163 to 0167), packed into an APK by the Gradle project client/android/.
#   workflow_dispatch only: nothing runs on push or pull request. The APK is a workflow artifact (kept 14 days) with its
#   SHA-256, its signer certificate SHA-256 and CindersOfChaos-Android.json (version code and name, SHA-256, size, signer).
#   With the input publish_release and a release-signed build it is also attached to the GitHub prerelease android-<build>
#   (never overwritten: a version code is published once). The APK updater (O313 step 8, docs/ANDROID_CLIENT.md section 4)
#   takes it from there: on the VPS, admin app Comandos > Site e update do client > "Publicar app Android" (chaos-ctl.sh
#   publish-apk android-<build>) downloads the two assets, puts the APK on the site and signs the manifest entry.
#
# Inputs of the base client come from the private branch windows-assets, as in windows-package.yml (client/base-client
# tar parts and SHA256SUMS.parts). The sprite pair is NOT put into the APK: the phone downloads it on first start through
# the signed update manifest (module client_chaos_firststart, client base patch 0167), from update_manifest with the key
# update_public_key, the same inputs and production defaults as windows-package.yml. The live manifest needs its "android"
# section (a publish with the current tools writes it, docs/ANDROID_CLIENT.md section 3); without it the first-start
# screen says the update was refused.
#
# Libraries: vcpkg, triplet arm64-android-chaos (client/android/triplets), manifest client/android/vcpkg/vcpkg.json
# (builtin-baseline pins the registry; the vcpkg tool is checked out at the same commit). Binary cache: actions/cache.
#
# Signing. Secrets (names only; the values are never in the repository):
#   ANDROID_CLIENT_KEYSTORE_B64   the release keystore file, base64
#   ANDROID_CLIENT_KEYSTORE_PASS  its password (store and key)
#   ANDROID_CLIENT_KEY_ALIAS      the key alias
# With all three the run builds assembleRelease and signs it with that key. Without them it builds assembleDebug, signed
# with the debug key of the runner (installs for testing; every run has another signature, so uninstall first).
# Game secrets, as in windows-package.yml: CHAOS_CLIENT_KEY (64 hex digits, same as the game server) and CHAOS_RSA_PUBLIC
# (secret or variable). Without them the run stops unless allow_dev_key is ticked (a test APK with the public development
# keys, which a production server refuses).
name: Android client

on:
  workflow_dispatch:
    inputs:
      assets_ref:
        description: "Branch of the base client (and server, dat/spr)"
        required: false
        default: "windows-assets"
      update_manifest:
        description: "Signed updater: https URL of updates/live/manifest.json on the website (empty: no game data download, the APK cannot enter the game)"
        required: false
        default: "https://www.cindersofchaos.com/updates/live/manifest.json"
      update_public_key:
        description: "Signed updater: the operator's Ed25519 public key, 64 hex digits (never the private key)"
        required: false
        default: "7f4ae1b812e3ca86ac4551683b987b8bf68d2256b36b1785c07cb4f3ffb72224"
      update_baseline:
        description: "Optional: the release number the Lua and art in this APK are (the winpkg-N number whose files it was built from). With it, a live update below N only brings the game data and never puts older Lua over the APK's. Empty: any live update applies"
        required: false
        default: ""
      publish_release:
        description: "Release-signed build only: attach the APK and its JSON to the prerelease android-<client_build> (a tag is never reused; raise client_build for every APK you give out)"
        type: boolean
        required: false
        default: false
      client_build:
        description: "Client build number 1-65535 (CHAOS_CLIENT_BUILD, the APK versionCode and Services.update.package). At least the live manifest's min_package (the windows-package.yml default is the live build), else the phone asks for a new download. Raise it for every APK you give out"
        required: false
        default: "30"
      server_host:
        description: "Server address (DNS name or IPv4)"
        required: false
        default: "127.0.0.1"
      site_url:
        description: "Website, https://... (account API and login-screen services). Empty: both off"
        required: false
        default: ""
      allow_dev_key:
        description: "Test build only: allow a build without the secrets CHAOS_CLIENT_KEY / CHAOS_RSA_PUBLIC (public development keys; never for players)"
        type: boolean
        required: false
        default: false
      smoke_test:
        description: "Start the APK on an emulator (x86_64 image with arm64 translation) and keep its logcat as an artifact"
        type: boolean
        required: false
        default: true
      smoke_download:
        description: "Also run the whole first start on an emulator: download the live game data, unpack, restart, logcat and screenshots after it (about 40 min)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: android-client-${{ github.ref }}
  cancel-in-progress: false

env:
  ASSETS_REF: ${{ inputs.assets_ref || 'windows-assets' }}
  CLIENT_BUILD: ${{ inputs.client_build || '30' }}
  UPDATE_MANIFEST: ${{ inputs.update_manifest }}
  UPDATE_PUBLIC_KEY: ${{ inputs.update_public_key }}
  UPDATE_BASELINE: ${{ inputs.update_baseline }}
  SERVER_HOST: ${{ inputs.server_host || '127.0.0.1' }}
  SITE_URL: ${{ inputs.site_url }}
  ALLOW_DEV_KEY: ${{ inputs.allow_dev_key && 'true' || 'false' }}
  # NDK r27d; the Gradle project (client/android/app/build.gradle) names the same version
  NDK_VERSION: "27.3.13750724"
  # the vcpkg tool is checked out at the builtin-baseline of client/android/vcpkg/vcpkg.json
  VCPKG_TRIPLET: arm64-android-chaos

jobs:
  apk:
    name: APK (NDK r27d, arm64-v8a, android-26)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      release_signed: ${{ steps.ks.outputs.release }}
    steps:
      - name: Keep line endings as they are
        run: git config --global core.autocrlf false

      - name: Check out Cinders of Chaos
        uses: actions/checkout@v4
        with:
          path: chaos

      - name: Check out the base client
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ASSETS_REF }}
          path: assets
          sparse-checkout: |
            client
            SHA256SUMS.parts
          sparse-checkout-cone-mode: true

      - name: Assemble the client (base + client/base-patches + client/overlay)
        run: |
          set -euo pipefail
          (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts)
          mkdir base
          cat assets/client/base-client.tar.xz.part* | xz -d -T0 | tar -xf - -C base
          mv base/*/ base-client
          # no things dir: the sprite pair is not part of the APK
          bash chaos/client/tools/assemble_client.sh "$GITHUB_WORKSPACE/base-client" "$GITHUB_WORKSPACE/game"
          # the patches 0163 to 0167 are in: the Android CMake branch exists, and so do the phone data functions and module
          grep -q 'Android (O313' game/CMakeLists.txt
          grep -q 'unpackUpdateBlob' game/src/framework/luafunctions.cpp
          test -f game/modules/client_chaos_firststart/firststart.lua

      - name: Client guard inputs and settings
        env:
          CHAOS_CLIENT_KEY: ${{ secrets.CHAOS_CLIENT_KEY }}
          CHAOS_RSA_PUBLIC: ${{ secrets.CHAOS_RSA_PUBLIC || vars.CHAOS_RSA_PUBLIC }}
        run: |
          set -euo pipefail
          if ! [[ "$CLIENT_BUILD" =~ ^[0-9]+$ ]] || [ "$CLIENT_BUILD" -lt 1 ] || [ "$CLIENT_BUILD" -gt 65535 ]; then
            echo "::error::client_build must be a number from 1 to 65535"; exit 1
          fi
          if [ -z "$CHAOS_CLIENT_KEY" ] && [ "$ALLOW_DEV_KEY" != true ]; then
            echo "::error::No CHAOS_CLIENT_KEY secret. Set it (docs/SECURITY_CHECKLIST.md), or tick allow_dev_key for a test build."; exit 1
          elif [ -z "$CHAOS_CLIENT_KEY" ]; then
            echo "::warning::No CHAOS_CLIENT_KEY secret (allow_dev_key): this APK gets the public DEVELOPMENT key; a production server kicks it."
          elif ! [[ "$CHAOS_CLIENT_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::The CHAOS_CLIENT_KEY secret must be 64 hex digits (openssl rand -hex 32)"; exit 1
          fi
          if [ -z "$CHAOS_RSA_PUBLIC" ] && [ "$ALLOW_DEV_KEY" != true ]; then
            echo "::error::No CHAOS_RSA_PUBLIC (the game server's login key, server/tools/rsa_key.py public). Set it, or tick allow_dev_key for a test build."; exit 1
          fi
          # not compiled in: written into init.lua, which goes into data.zip
          python3 -I chaos/client/tools/set_server_host.py game "$SERVER_HOST" --site-url "$SITE_URL"
          python3 -I chaos/client/tools/set_rsa_key.py game --from-env CHAOS_RSA_PUBLIC \
            $([ "$ALLOW_DEV_KEY" = true ] && echo --allow-default)
          # the first-start download of the game data: the signed manifest and the operator's public key (O313)
          if [ -n "$UPDATE_MANIFEST" ]; then
            python3 -I chaos/client/tools/set_update_config.py game --manifest "$UPDATE_MANIFEST" \
              --public-key "$UPDATE_PUBLIC_KEY" --package "$CLIENT_BUILD" \
              $([ -n "$UPDATE_BASELINE" ] && echo --baseline "$UPDATE_BASELINE")
          else
            echo "::warning::No update_manifest: this APK cannot download the game data and cannot enter the game."
          fi

      - name: data.zip for the APK assets
        run: bash chaos/client/android/tools/make_assets.sh game "$GITHUB_WORKSPACE/apk-assets"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # the runner image ships the Android SDK (ANDROID_HOME); the NDK, CMake and the platform are installed at the pinned versions
      - name: Android SDK packages
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "ndk;$NDK_VERSION" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Libraries with vcpkg
        run: |
          set -euo pipefail
          BASELINE=$(python3 -I -c "import json;print(json.load(open('chaos/client/android/vcpkg/vcpkg.json'))['builtin-baseline'])")
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$BASELINE"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_BASELINE=$BASELINE" >> "$GITHUB_ENV"

      - name: Restore the vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-android-client-${{ hashFiles('chaos/client/android/vcpkg/vcpkg.json', 'chaos/client/android/triplets/*.cmake') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-android-client-${{ hashFiles('chaos/client/android/vcpkg/vcpkg.json', 'chaos/client/android/triplets/*.cmake') }}-

      - name: Build the libraries (boost headers, openssl, luajit, physfs, libzip, openal-soft, vorbis)
        run: |
          set -euo pipefail
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root="$GITHUB_WORKSPACE/chaos/client/android/vcpkg" \
            --x-install-root="$GITHUB_WORKSPACE/vcpkg_installed" \
            --overlay-triplets="$GITHUB_WORKSPACE/chaos/client/android/triplets" \
            --triplet "$VCPKG_TRIPLET" --host-triplet x64-linux --clean-after-build --disable-metrics
          # the engine includes <luajit/lua.h> (the Windows layout); the make build installs include/luajit-2.1
          INC="$GITHUB_WORKSPACE/vcpkg_installed/$VCPKG_TRIPLET/include"
          [ -e "$INC/luajit" ] || ln -s luajit-2.1 "$INC/luajit"
          ls "$GITHUB_WORKSPACE/vcpkg_installed/$VCPKG_TRIPLET/lib"

      - name: vcpkg build logs (on failure)
        if: failure()
        run: |
          find "$VCPKG_ROOT/buildtrees" -maxdepth 2 -name '*.log' -newer "$VCPKG_ROOT/vcpkg" -size +0 | while read -r f; do
            echo "::group::$f"; tail -n 80 "$f"; echo "::endgroup::"
          done

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Signing key
        id: ks
        env:
          KS_B64: ${{ secrets.ANDROID_CLIENT_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_CLIENT_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.ANDROID_CLIENT_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KS_ALIAS" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/client.jks"
            echo "::add-mask::$KS_PASS"
            echo "release=yes" >> "$GITHUB_OUTPUT"
            echo "file=$RUNNER_TEMP/client.jks" >> "$GITHUB_OUTPUT"
          else
            echo "release=no" >> "$GITHUB_OUTPUT"
            echo "::warning::No ANDROID_CLIENT_KEYSTORE_B64 / _PASS / ANDROID_CLIENT_KEY_ALIAS secrets: this APK is a debug build with the runner's debug key."
          fi

      - name: Build the APK
        env:
          CHAOS_CLIENT_KEY: ${{ secrets.CHAOS_CLIENT_KEY }}
          CHAOS_KS_FILE: ${{ steps.ks.outputs.file }}
          CHAOS_KS_PASS: ${{ secrets.ANDROID_CLIENT_KEYSTORE_PASS }}
          CHAOS_KS_ALIAS: ${{ secrets.ANDROID_CLIENT_KEY_ALIAS }}
        working-directory: chaos/client/android
        run: |
          set -euo pipefail
          TASK=assembleDebug
          if [ "${{ steps.ks.outputs.release }}" = yes ]; then TASK=assembleRelease; fi
          gradle --no-daemon ":app:$TASK" \
            -PchaosClientDir="$GITHUB_WORKSPACE/game" \
            -PchaosDepsPrefix="$GITHUB_WORKSPACE/vcpkg_installed/$VCPKG_TRIPLET" \
            -PchaosAssetsDir="$GITHUB_WORKSPACE/apk-assets" \
            -PchaosClientBuild="$CLIENT_BUILD"

      - name: Check the APK and write its update entry
        run: |
          set -euo pipefail
          APK=$(find chaos/client/android/app/build/outputs/apk -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::no APK built"; exit 1; }
          BT="$ANDROID_HOME/build-tools/35.0.0"
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          "$BT/zipalign" -c -P 16 4 "$APK"   # 16 KB page alignment of the native library
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|native-code"
          mkdir out
          cp "$APK" out/CindersOfChaos-Android.apk
          (cd out && sha256sum CindersOfChaos-Android.apk | tee CindersOfChaos-Android.apk.sha256)
          # The update entry (O313 step 8): what make_update_manifest.py --apk-info reads. The signer is the SHA-256 of the
          # signing certificate, the value the phone compares against the downloaded file before it installs it.
          SIGNER=$("$BT/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)
          [[ "$SIGNER" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no signer certificate SHA-256 in the apksigner output"; exit 1; }
          BADGING=$("$BT/aapt2" dump badging "$APK" | grep '^package:')
          VCODE=$(printf '%s\n' "$BADGING" | sed -n "s/.* versionCode='\([0-9]*\)'.*/\1/p")
          VNAME=$(printf '%s\n' "$BADGING" | sed -n "s/.* versionName='\([^']*\)'.*/\1/p")
          [ "$VCODE" = "$CLIENT_BUILD" ] || { echo "::error::versionCode $VCODE is not client_build $CLIENT_BUILD"; exit 1; }
          export SIGNER VCODE VNAME
          python3 -I - <<'PY'
          import hashlib, json, os
          path = 'out/CindersOfChaos-Android.apk'
          info = {'version_code': int(os.environ['VCODE']), 'version_name': os.environ['VNAME'],
                  'signer_sha256': os.environ['SIGNER'], 'sha256': hashlib.sha256(open(path, 'rb').read()).hexdigest(),
                  'size': os.path.getsize(path)}
          open('out/CindersOfChaos-Android.json', 'w').write(json.dumps(info, indent=1, sort_keys=True) + '\n')
          PY
          cat out/CindersOfChaos-Android.json
          SHA=$(cut -d' ' -f1 out/CindersOfChaos-Android.apk.sha256)
          {
            echo "APK: $(du -h out/CindersOfChaos-Android.apk | cut -f1), version $VNAME (code $VCODE), signing: ${{ steps.ks.outputs.release == 'yes' && 'release key' || 'debug key' }}"
            echo ""
            echo "- sha256: \`$SHA\`"
            echo "- signer certificate sha256: \`$SIGNER\`"
            if [ "${{ steps.ks.outputs.release }}" != yes ]; then
              echo "- debug key: a test APK. Never publish it as an app update (every run has another signer)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: CindersOfChaos-Android
          path: out/
          retention-days: 14
          if-no-files-found: error

  release:
    name: Attach the APK to a GitHub prerelease (the source of the app update)
    needs: apk
    if: ${{ inputs.publish_release && needs.apk.outputs.release_signed == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CindersOfChaos-Android
          path: apk

      - name: Create the prerelease android-<client_build>
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-$CLIENT_BUILD"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::The release $TAG exists. A version code is published once: raise client_build."; exit 1
          fi
          SHA=$(cut -d' ' -f1 apk/CindersOfChaos-Android.apk.sha256)
          SIGNER=$(python3 -I -c "import json;print(json.load(open('apk/CindersOfChaos-Android.json'))['signer_sha256'])")
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Android client build $CLIENT_BUILD" \
            --notes "APK sha256 $SHA, signer certificate sha256 $SIGNER. Publish it as the app update: admin app, Comandos, Site e update do client, Publicar app Android, tag $TAG." \
            apk/CindersOfChaos-Android.apk apk/CindersOfChaos-Android.json apk/CindersOfChaos-Android.apk.sha256
          echo "Release $TAG: sha256 $SHA, signer $SIGNER" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Smoke test on an emulator (logcat)
    needs: apk
    if: ${{ inputs.smoke_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CindersOfChaos-Android
          path: apk

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 30 x86_64 Google APIs images translate arm64 apps; the device test stays the real check
      - name: Start the APK and keep the logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # the last command checks the first-start screen (client_chaos_firststart logs "firststart: screen shown" when it
          # appears: the APK holds no sprite pair, so it always shows, with or without a network to the update server).
          # It waits for that line up to 8 minutes, then 20 s more: module loading on the emulator varies by minutes.
          script: |
            bash -c 'adb logcat -c; adb install -r apk/CindersOfChaos-Android.apk && adb shell am start -W -n com.cindersofchaos.client/.ChaosActivity; for i in $(seq 96); do adb logcat -d | grep -q "firststart: screen shown" && break; sleep 5; done; sleep 20; adb shell pidof com.cindersofchaos.client && echo STILL RUNNING || echo NOT RUNNING; adb logcat -d -v threadtime > logcat.txt; grep -E "CindersOfChaos|AndroidRuntime|DEBUG|libc|linker|cindersofchaos|F/|E/" logcat.txt | tail -n 300; grep -E "CindersOfChaos.*firststart: " logcat.txt | tail -n 20; grep -q "firststart: screen shown" logcat.txt && echo "FIRST START SCREEN: ok" || { echo "FIRST START SCREEN: not shown"; exit 1; }'

      - name: Upload the logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-logcat
          path: logcat.txt
          retention-days: 14
          if-no-files-found: warn

  smoke-download:
    name: First start on an emulator (download, restart, logcat)
    needs: apk
    if: ${{ inputs.smoke_download }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: chaos
          sparse-checkout: client/android/tools

      - uses: actions/download-artifact@v4
        with:
          name: CindersOfChaos-Android
          path: apk

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # the game data is over 1 GB, staged and unpacked: a bigger data partition
      - name: Download, unpack and restart on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disk-size: 8000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash chaos/client/android/tools/smoke_download.sh apk/CindersOfChaos-Android.apk smoke-download

      - name: Upload the logcat and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-first-start
          path: smoke-download/
          retention-days: 14
          if-no-files-found: warn
