# Windows package and release downloads: every run publishes a prerelease winpkg-<run number> (Releases; the run's
# Summary links each file) with six ready-to-use downloads:
#   CindersOfChaos-Windows.zip         the whole game for one Windows PC: server, client, portable MariaDB, the map editor (AGPL-3.0, with
#                                      its source zip; our area generator and plans as its Lua scripts in mapeditor\cinders, O381;
#                                      our build of mapeditor-build.yml by default, input map_editor, O387);
#                                      extract it and run start-server.bat, then start-client.bat
#                                      (tools/windows/package/README.txt is in the zip)
#   CindersOfChaos-Client-Windows.zip  the Windows client alone (Chaos.exe and chaos.pack: modules, data with the 10.98
#                                      dat and the spr as sprite shards),
#                                      pointed at the input server_host (tools/windows/client-README.txt)
#   CindersOfChaos-MapFiles.zip        the map files alone for a 10.98 map editor (world/, data/1098/, versions.xml; no editor)
#   CindersOfChaos-Server-Windows.zip  the Windows server alone: ChaosServer.exe + DLLs, portable MariaDB, the start /
#                                      stop .bat files (tools/windows/server-README.txt)
#   CindersOfChaos-Server-Linux.tar.gz the engine built on Ubuntu 22.04 with its libraries in server/lib (RUNPATH
#                                      $ORIGIN/lib), production config.lua, portable MariaDB, start-server.sh /
#                                      stop-server.sh / add-account.sh, systemd unit examples (tools/linux/server/README.txt)
#   CindersOfChaos-Client-Linux.tar.gz the client built on Ubuntu 22.04 with its libraries in lib/, run-client.sh
#                                      (tools/linux/client/README.txt)
#
# MANUAL ONLY (workflow_dispatch): it never runs on push or pull_request, so it cannot turn PR checks red.
#
# Inputs come from the private branch windows-assets (its README.md): the base server download, the base client and
# the merged Chaos Tibia.dat / Tibia.spr (one archive cut in parts, things/things-1098.tar.xz.partNN) and, when present, the map master
# (world/: the owner's edited map, server/README.md "Map master"); large files are cut into parts under GitHub's 100 MB
# file limit. Both clients get the spr as sprite shards (client/tools/sprites/spr_shards.py, client/MANIFEST.md
# "Sharded sprites"): since pair 37 the single Tibia.spr is over 1 GiB, which the updater refuses; only the map editor's client folder
# keeps the single file.
#   server        Linux job: tools/windows/prepare_server.sh (engine patches, config.lua, the map master over the base
#                 map, install_all.py, sql-setup/)
#   engine        Windows job: the patched engine built with MSVC + vcpkg (x64-windows, the libraries the Linux build was
#                 checked with: Boost 1.83, fmt 9.1) -> ChaosServer.exe + DLLs; it makes the patched source itself
#                 (base src/ + tools/windows/apply_engine_patches.sh), so it runs beside the server job
#   client        Windows job: base client + client/base-patches + client/overlay (client/tools/assemble_client.sh), built
#                 like windows-client.yml -> Chaos.exe
#   package       Linux job: everything above + portable MariaDB + the .bat files -> the three Windows downloads
#   engine-linux  Ubuntu 22.04 job (the oldest glibc of the supported systems): the same server folder, the engine built
#                 with the distribution's libraries, tools/linux/package_server.sh, a start test -> Server-Linux.tar.gz
#   client-linux  Ubuntu 22.04 job: the client assembled and built as client/LINUX.md says, tools/linux/package_client.sh,
#                 a start test under Xvfb -> Client-Linux.tar.gz
#   publish       release notes, download links in the Summary, intermediate parts deleted, older releases pruned
#
# Client guard (client/BASE.md "Client guard", server/README.md "Client guard"): both clients are built with the
# repository secret CHAOS_CLIENT_KEY (Settings -> Secrets and variables -> Actions -> New repository secret; 64 hex
# digits, the same value as CHAOS_CLIENT_KEY on the game server) and the build number of the input client_build. Without
# the secret the run fails, unless the input allow_dev_key is ticked: then they get the public development key (a
# warning in the run and in the release notes), which a production server refuses. The Windows
# packages' server folder keeps the guard off (local play); the Linux server turns it on when its chaos.env sets the key.
# Login key (server/README.md "Login encryption (RSA, XTEA)"): the separate client downloads encrypt the login with the
# game server's own RSA key, whose public modulus (decimal, server/tools/rsa_key.py public) is the secret or variable
# CHAOS_RSA_PUBLIC (public, but kept out of the repository); client/tools/set_rsa_key.py writes it into init.lua. Without
# it the run fails unless allow_dev_key is ticked (then the public default key, a warning). The full Windows zip keeps
# the default key: its own server folder has the stock key.pem.
# Game launcher (O314, launcher/README.md): the separate client download starts with CindersLauncher.exe (built in the
# client job, launcher.json written next to it from the init.lua settings). The launcher updates the exe, the DLLs and
# chaos.pack from the "native" section of the signed manifest, which publish_client_update.sh adds when the zip holds
# CindersLauncher.exe. The full local package keeps start-client.bat and Chaos.exe.
# Signed updater (client/MANIFEST.md "Signed updater"): it updates only modules/ mods/ data/ layouts/, which both clients
# share, so update_manifest / update_public_key go into the Windows and the Linux client alike, with the baseline
# Services.update.baseline = this run's number (winpkg-N -> N, the version publish_client_update.sh gives the update made
# from this package): the client never applies a manifest below it, so it never goes back to an older live update.
# The start test runs with CHAOS_UPDATE_OFF=1: no request to the live update server, so a package never depends on
# what is published (winpkg-47 applied the older live winpkg-46 files and restarted, base patch 0101).
# The first run builds the vcpkg ports of both exes (about an hour); later runs reuse the vcpkg binary caches.
# Compiled-output caches (engine, client, engine-linux, client-linux): each compile job caches only its binary (exe plus
# DLLs, or the ELF) under a key made from exactly what the compiler reads: the C++ side of the assembled source tree
# (never modules/, mods/, data/, layouts/, init.lua, the Lua and data of the client or the server folder), the
# vcpkg manifest and triplet or the apt versions of the libraries, the compiler version, the build recipe and every value
# baked into the binary (CHAOS_CLIENT_BUILD, a sha256 of CHAOS_CLIENT_KEY). A run that changed only Lua, data or the
# overlay hits the cache and skips vcpkg, CMake and the compiler; the Lua, data and overlay still come fresh from
# the checkout (the assemble steps always run). Bump the -v1 in the keys to throw the old binaries away.
name: Windows package

on:
  workflow_dispatch:
    inputs:
      assets_ref:
        description: "Branch of the base server, base client and dat/spr"
        required: false
        default: "windows-assets"
      update_manifest:
        description: "Signed updater: https URL of updates/live/manifest.json on the website (empty: updater off)"
        required: false
        default: "https://www.cindersofchaos.com/updates/live/manifest.json"
      update_public_key:
        description: "Signed updater: the operator's Ed25519 public key, 64 hex digits (never the private key)"
        required: false
        default: "7f4ae1b812e3ca86ac4551683b987b8bf68d2256b36b1785c07cb4f3ffb72224"
      client_build:
        description: "Client build number 1-65535 (CHAOS_CLIENT_BUILD; also Services.update.package). Raise it for every new exe, here too (the default is the live build). 13+ ships the encrypted chaos.pack (client/BASE.md 'Client packs')"
        required: false
        default: "30"
      server_host:
        description: "Server address of the separate client and server downloads (DNS name or IPv4; the full Windows zip keeps 127.0.0.1)"
        required: false
        default: "play.cindersofchaos.com"
      site_url:
        description: "Website of the separate client downloads, https://... (account API: character looks and Create character; login-screen services through <site>/clientservices). Empty: both off"
        required: false
        default: "https://www.cindersofchaos.com"
      allow_dev_key:
        description: "Test build only: allow clients without the secrets CHAOS_CLIENT_KEY / CHAOS_RSA_PUBLIC (public development keys; never for players)"
        type: boolean
        required: false
        default: false
      map_editor:
        description: "Map editor of the Windows zip: ours (newest mapeditor-* release of 'Map editor build'; upstream with a warning when there is none) or upstream (their release)"
        type: choice
        options: [ours, upstream]
        default: ours

# contents: write: the jobs hand their parts over through a prerelease of this run (tag winpkg-<run number>) instead of
# workflow artifacts, which count against the account's artifact storage quota; release assets do not. The publish
# job deletes the intermediate parts, keeps the five downloads and prunes older winpkg releases (the newest 3 stay).
permissions:
  contents: write

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false

env:
  ASSETS_REF: ${{ inputs.assets_ref || 'windows-assets' }}
  # the live values are the defaults, so a dispatch without inputs (gh, API) still makes a package players get
  UPDATE_MANIFEST: ${{ inputs.update_manifest }}
  UPDATE_PUBLIC_KEY: ${{ inputs.update_public_key }}
  CLIENT_BUILD: ${{ inputs.client_build || '1' }}
  SERVER_HOST: ${{ inputs.server_host || '127.0.0.1' }}
  SITE_URL: ${{ inputs.site_url }}
  ALLOW_DEV_KEY: ${{ inputs.allow_dev_key && 'true' || 'false' }}
  # vcpkg registry state for the engine's libraries (tag 2023.12.12: Boost 1.83); fmt is pinned to 9.1.0 below
  ENGINE_VCPKG_BASELINE: c8696863d371ab7f46e213d8f5ca923c4aef2a00
  MARIADB_VERSION: "10.11.14"
  GH_TOKEN: ${{ github.token }}
  PKG_TAG: winpkg-${{ github.run_number }}
  # the map editor (O387): ours = the newest mapeditor-<short sha> release of this repository (mapeditor-build.yml),
  # upstream = the upstream GitHub release (its repository: docs/CREDITS.md, tools/windows/editor_release.py repo), one
  # rolling release whose files are replaced on every upstream push. The release notes name which build shipped.
  MAP_EDITOR: ${{ inputs.map_editor || 'ours' }}
  EDITOR_TAG: "1.0"

jobs:
  server:
    name: Server folder (patches, Chaos content, SQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Cinders of Chaos
        uses: actions/checkout@v4
        with:
          path: chaos

      - name: Check out the assets
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ASSETS_REF }}
          path: assets
          sparse-checkout: |
            server
            world
            SHA256SUMS.parts
          sparse-checkout-cone-mode: true

      - name: Prepare the server folder
        run: |
          # install step contentareas: numpy (area_plan_place.py reads the map; python3 -I does not see pip's user
          # site) and luajit (hunt_teleports_dump.lua reads the teleport room config)
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-numpy luajit
          (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts)
          mkdir -p base work
          tar -xJf assets/server/base-server.tar.xz -C base
          mv base/*/ work/server  # the archive holds one folder: the base server
          # the map master (assets world/, the owner's edited map; server/README.md "Map master") replaces the base map
          # when the branch has one; prepare_server.sh checks its parts and runs the install steps on top of it
          bash chaos/tools/windows/prepare_server.sh work/server assets/world
          tar -cf server.tar -C work server

      - name: Release of this run (created by whichever job gets here first)
        shell: bash
        run: |
          gh release view "$PKG_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$PKG_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Windows package ${{ github.run_number }}" \
              --notes "Windows test package built by run ${{ github.run_id }} from $GITHUB_SHA (assets: $ASSETS_REF)." || \
            gh release view "$PKG_TAG" -R "$GITHUB_REPOSITORY" >/dev/null

      - name: Hand the server folder over
        run: gh release upload "$PKG_TAG" server.tar -R "$GITHUB_REPOSITORY" --clobber

  engine:
    name: Engine (MSVC, vcpkg x64-windows, v142 libraries)
    # no needs: server. It makes the patched engine source itself (base server src/ + server/src-patches/, the same
    # tools/windows/apply_engine_patches.sh the server job runs), so it starts at once and not after the server folder
    # Visual Studio 2022 image: it also carries the VS 2019 toolset (v142) the library builds use (see the triplet below)
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_cache
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg_cache,readwrite"
    steps:
      # the patches are plain unified diffs with LF line endings; a CRLF checkout would make them fail to apply
      - name: Keep line endings as they are
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out Cinders of Chaos
        uses: actions/checkout@v4
        with:
          path: chaos

      - name: Check out the assets
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ASSETS_REF }}
          path: assets
          sparse-checkout: |
            server
            SHA256SUMS.parts
          sparse-checkout-cone-mode: true

      - name: Make the engine source (base server src + server/src-patches)
        shell: bash
        run: |
          (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts)
          mkdir base
          # only what the build reads; when the archive's layout does not match the patterns, unpack all of it
          tar -xJf assets/server/base-server.tar.xz -C base --wildcards --no-wildcards-match-slash \
            '*/CMakeLists.txt' '*/cmake' '*/src' || true
          if ! compgen -G 'base/*/src' > /dev/null || ! compgen -G 'base/*/CMakeLists.txt' > /dev/null; then
            rm -rf base && mkdir base
            tar -xJf assets/server/base-server.tar.xz -C base
          fi
          mv base/*/ server  # the archive holds one folder: the base server
          # the same patches, in the same order, as the server job (prepare_server.sh); they touch src/ only
          bash chaos/tools/windows/apply_engine_patches.sh server

      - name: Add the vcpkg manifest, triplet and CMake changes
        shell: bash
        run: |
          cat > server/vcpkg.json <<EOF
          {
            "name": "chaos-server",
            "version-string": "1",
            "builtin-baseline": "$ENGINE_VCPKG_BASELINE",
            "dependencies": [
              "boost-asio", "boost-date-time", "boost-filesystem", "boost-iostreams", "boost-lockfree",
              "boost-system", "boost-variant", "cryptopp", "fmt", "libmariadb", "luajit", "pugixml"
            ],
            "overrides": [{"name": "fmt", "version": "9.1.0", "port-version": 1}]
          }
          EOF
          cat server/vcpkg.json
          # the libraries are built with the VS 2019 toolset (v142, 14.29, installed on the windows-2022 image): the
          # Boost 1.83 ports build with b2, which names libraries vc140 for MSVC 14.4x and then cannot find them. The
          # engine itself is built with the current compiler (v142 and v143 libraries are binary compatible).
          # vcpkg's packages export imported targets (cryptopp::cryptopp, unofficial::libmariadb); the base CMakeLists.txt
          # names the libraries by bare file names that do not exist there (cryptopp-static.lib, libmariadb.lib)
          python - <<'PY'
          import re
          p = 'server/CMakeLists.txt'
          s = open(p).read()
          block = ('\n# Windows package build: vcpkg imported targets\n'
                   'if (TARGET cryptopp::cryptopp)\n    set(Crypto++_LIBRARIES cryptopp::cryptopp)\nendif ()\n'
                   'if (TARGET unofficial::libmariadb)\n    set(MYSQL_CLIENT_LIBS unofficial::libmariadb)\nendif ()\n')
          s, n = re.subn(r'(find_package\(Threads REQUIRED\)\n)', lambda m: m.group(1) + block, s, count=1)
          assert n == 1, 'find_package(Threads REQUIRED) not found'
          open(p, 'w').write(s)
          PY
          mkdir -p server/triplets
          cat > server/triplets/x64-windows-v142.cmake <<EOF
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE dynamic)
          set(VCPKG_PLATFORM_TOOLSET v142)
          set(VCPKG_PLATFORM_TOOLSET_VERSION 14.29)
          EOF

      # Compiled engine cache: out/ holds ChaosServer.exe and the DLLs only, nothing of the server folder.
      # The key is one sha256 of: the engine source exactly as the Build step reads it (src/, cmake/, CMakeLists.txt after
      # the base archive, server/src-patches and the CMake edit above; vcpkg.json with ENGINE_VCPKG_BASELINE; the
      # triplet), the Visual Studio version of the image, and the build recipe (keep it equal to the Build step: flags,
      # triplet, image label; bump v1 when the step changes in a way the recipe does not show). Nothing secret or
      # input-driven is compiled into the engine: SERVER_HOST and the rest only reach the server folder.
      - name: Key of the compiled engine
        id: ekey
        shell: bash
        run: |
          set -euo pipefail
          cd server
          files=$(find src cmake CMakeLists.txt vcpkg.json triplets -type f 2>/dev/null | LC_ALL=C sort || true)
          grep -q '^src/' <<<"$files" || { echo "::error::no engine source found for the cache key"; exit 1; }
          grep -qx 'CMakeLists.txt' <<<"$files" || { echo "::error::no CMakeLists.txt found for the cache key"; exit 1; }
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          vs=$("$vswhere" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion 2>/dev/null | tr -d '\r' || true)
          vs=${vs:-image-${ImageVersion:-unknown}}
          recipe="engine-win-v1 windows-2022 x64-windows-v142 Release Ninja SKIP_GIT=ON CXXFLAGS=/D_CRT_SECURE_NO_WARNINGS,/bigobj baseline=$ENGINE_VCPKG_BASELINE"
          hash=$({ echo "$recipe"; echo "vs=$vs"; printf '%s\n' "$files" | xargs -d '\n' sha256sum; } | sha256sum | cut -d' ' -f1)
          echo "recipe: $recipe"; echo "visual studio: $vs"; echo "source files: $(wc -l <<<"$files")"; echo "key hash: $hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore the compiled engine
        id: ecache
        uses: actions/cache/restore@v4
        with:
          path: out
          key: engine-win-bin-v1-${{ steps.ekey.outputs.hash }}

      - name: Get CMake and Ninja
        if: steps.ecache.outputs.cache-hit != 'true'
        uses: lukka/get-cmake@latest

      - name: Restore the vcpkg binary cache
        if: steps.ecache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: vcpkg-chaos-engine-v142-${{ env.ENGINE_VCPKG_BASELINE }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-chaos-engine-v142-${{ env.ENGINE_VCPKG_BASELINE }}-

      - name: Build
        if: steps.ecache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: server
        env:
          # added to CMake's own MSVC flags: the base download's own Visual Studio project defines the first one
          CXXFLAGS: /D_CRT_SECURE_NO_WARNINGS /bigobj
        run: |
          if not exist "%VCPKG_DEFAULT_BINARY_CACHE%" mkdir "%VCPKG_DEFAULT_BINARY_CACHE%"
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          git clone https://github.com/microsoft/vcpkg "%GITHUB_WORKSPACE%\vcpkg"
          if errorlevel 1 exit /b 1
          call "%GITHUB_WORKSPACE%\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if errorlevel 1 exit /b 1
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKIP_GIT=ON -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_TOOLCHAIN_FILE=%GITHUB_WORKSPACE%\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_OVERLAY_TRIPLETS=%CD%\triplets -DVCPKG_TARGET_TRIPLET=x64-windows-v142
          if errorlevel 1 exit /b 1
          cmake --build build --parallel %NUMBER_OF_PROCESSORS%
          if errorlevel 1 exit /b 1

      # saved even when the build fails: the ports are built before the engine, so the next run starts there
      - name: Save the vcpkg binary cache
        if: always() && steps.ecache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: vcpkg-chaos-engine-v142-${{ env.ENGINE_VCPKG_BASELINE }}-${{ github.run_id }}

      - name: Collect the exe and its DLLs
        if: steps.ecache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p out
          cp server/build/tfs.exe out/ChaosServer.exe
          cp server/build/*.dll out/
          ls -la out

      # on a hit out/ came from the cache; either way it must hold the exe before it is cached or handed over
      - name: Check the compiled engine
        shell: bash
        run: |
          test -s out/ChaosServer.exe || { echo "::error::out/ChaosServer.exe is missing"; exit 1; }
          ls -la out

      - name: Save the compiled engine
        if: steps.ecache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out
          key: engine-win-bin-v1-${{ steps.ekey.outputs.hash }}

      # a full vcpkg cache hit builds the engine before the server job has made the release (run 66)
      - name: Release of this run (created by whichever job gets here first)
        shell: bash
        run: |
          gh release view "$PKG_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$PKG_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Windows package ${{ github.run_number }}" \
              --notes "Windows test package built by run ${{ github.run_id }} from $GITHUB_SHA (assets: $ASSETS_REF)." || \
            gh release view "$PKG_TAG" -R "$GITHUB_REPOSITORY" >/dev/null

      - name: Hand the engine over
        shell: bash
        run: |
          tar -cf server-exe.tar -C out .
          gh release upload "$PKG_TAG" server-exe.tar -R "$GITHUB_REPOSITORY" --clobber

      - name: Upload the vcpkg build logs (on failure)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: engine-vcpkg-logs
          path: vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore

  client:
    name: Client (MSVC, vcpkg x64-windows-static)
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_cache
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg_cache,readwrite"
    steps:
      # the patches are plain unified diffs with LF line endings; a CRLF checkout would make them fail to apply
      - name: Keep line endings as they are
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out Cinders of Chaos
        uses: actions/checkout@v4
        with:
          path: chaos

      - name: Check out the assets
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ASSETS_REF }}
          path: assets
          sparse-checkout: |
            client
            SHA256SUMS.parts
          sparse-checkout-cone-mode: true

      - name: Assemble the Cinders of Chaos client (base + client/base-patches + client/overlay)
        shell: bash
        run: |
          (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts)
          mkdir base
          cat assets/client/base-client.tar.xz.part* | xz -d -T0 | tar -xf - -C base
          mv base/*/ base-client  # the archive holds one folder: the base client
          patch --version | head -n 1
          bash chaos/client/tools/assemble_client.sh "$GITHUB_WORKSPACE/base-client" "$GITHUB_WORKSPACE/game"
          # (it also prunes the unused files of client/tools/slim_prune.txt and fails when a file reference of the tree
          #  no longer resolves: client/tools/slim_client.py check, client/BASE.md "Slim client")
          # No BUILD_INFO.txt in the client tree: the shipped client folder is just the exe and chaos.pack (client/BASE.md
          # "Client packs"). The build number is in the exe (CHAOS_CLIENT_BUILD) and Services.update.package; the commit
          # is in this run's release notes.

      - name: Client guard inputs (build number, key secret)
        shell: bash
        env:
          CHAOS_CLIENT_KEY: ${{ secrets.CHAOS_CLIENT_KEY }}
          CHAOS_RSA_PUBLIC: ${{ secrets.CHAOS_RSA_PUBLIC || vars.CHAOS_RSA_PUBLIC }}
        run: |
          if ! [[ "$CLIENT_BUILD" =~ ^[0-9]+$ ]] || [ "$CLIENT_BUILD" -lt 1 ] || [ "$CLIENT_BUILD" -gt 65535 ]; then
            echo "::error::client_build must be a number from 1 to 65535"
            exit 1
          fi
          if [ -z "$CHAOS_CLIENT_KEY" ] && [ "$ALLOW_DEV_KEY" != true ]; then
            echo "::error::No CHAOS_CLIENT_KEY secret. Set it (docs/SECURITY_CHECKLIST.md), or tick allow_dev_key for a test build."
            exit 1
          elif [ -z "$CHAOS_CLIENT_KEY" ]; then
            echo "::warning::No CHAOS_CLIENT_KEY secret (allow_dev_key): this client gets the public DEVELOPMENT key; a production server (clientGuardMode enforce) kicks it."
          elif ! [[ "$CHAOS_CLIENT_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::The CHAOS_CLIENT_KEY secret must be 64 hex digits (openssl rand -hex 32)"
            exit 1
          fi
          if [ -z "$CHAOS_RSA_PUBLIC" ] && [ "$ALLOW_DEV_KEY" != true ]; then
            echo "::error::No CHAOS_RSA_PUBLIC (the game server's login key, server/tools/rsa_key.py public). Set it, or tick allow_dev_key for a test build."
            exit 1
          fi
          echo "Client build $CLIENT_BUILD"

      # Compiled client cache: built/ holds the exe, its DLLs and build/data (when CMake makes any), never the Lua, data,
      # modules, layouts or init.lua of game/ (the next steps always copy those fresh from the assembled tree).
      # The key is one sha256 of: every file of the assembled game/ tree except data/ modules/ mods/ layouts/ init.lua
      # (so src/ with the overlay's src/, the base patches' C++ and CMake changes, CMakeLists.txt, cmake/, vcpkg.json),
      # client/tools/chaos_hardening.cmake (the release flags of the Build step), the Visual Studio version of the image,
      # the build recipe (keep it equal to the Build step; client-win-v2 = LTO and hardening flags, O204) and the values baked
      # into the exe: CHAOS_CLIENT_BUILD and a sha256 of CHAOS_CLIENT_KEY (never the key; empty key = the dev key).
      # UPDATE_PUBLIC_KEY, SERVER_HOST, SITE_URL and CHAOS_RSA_PUBLIC are not compiled in: they are written into init.lua
      # in the Package job. Runs after "Client guard inputs", so a bad key never reaches the key.
      - name: Key of the compiled client
        id: ckey
        shell: bash
        env:
          CHAOS_CLIENT_KEY: ${{ secrets.CHAOS_CLIENT_KEY }}
        run: |
          set -euo pipefail
          cd game
          files=$(find . -type f ! -path './data/*' ! -path './modules/*' ! -path './mods/*' ! -path './layouts/*' \
            ! -path './init.lua' ! -path './vcpkg/*' ! -path './build/*' | LC_ALL=C sort)
          grep -q '^\./src/' <<<"$files" || { echo "::error::no client source found for the cache key"; exit 1; }
          grep -qx './CMakeLists.txt' <<<"$files" || { echo "::error::no CMakeLists.txt found for the cache key"; exit 1; }
          vswhere="/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe"
          vs=$("$vswhere" -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion 2>/dev/null | tr -d '\r' || true)
          vs=${vs:-image-${ImageVersion:-unknown}}
          keyhash=$(printf '%s' "$CHAOS_CLIENT_KEY" | sha256sum | cut -d' ' -f1)
          recipe="client-win-v2 windows-2025 x64-windows-static Release Ninja lto+harden build=$CLIENT_BUILD"
          hardening=$(sha256sum ../chaos/client/tools/chaos_hardening.cmake | cut -d' ' -f1)
          hash=$({ echo "$recipe"; echo "vs=$vs"; echo "key=$keyhash"; echo "flags=$hardening"; printf '%s\n' "$files" | xargs -d '\n' sha256sum; } | sha256sum | cut -d' ' -f1)
          echo "recipe: $recipe"; echo "visual studio: $vs"; echo "source files: $(wc -l <<<"$files")"; echo "key hash: $hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore the compiled client
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: built
          key: client-win-bin-v2-${{ steps.ckey.outputs.hash }}

      - name: Get CMake and Ninja
        if: steps.ccache.outputs.cache-hit != 'true'
        uses: lukka/get-cmake@latest

      - name: Restore the vcpkg binary cache
        if: steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: vcpkg-chaos-client-${{ hashFiles('game/vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-chaos-client-${{ hashFiles('game/vcpkg.json') }}-
            vcpkg-chaos-client-

      # cmd + vcvars64, as the base client's own workflow does: the vcpkg port builds need the full MSVC environment
      # the key reaches CMake only as this step's environment variable (src/client/CMakeLists.txt reads
      # $ENV{CHAOS_CLIENT_KEY} at configure time, never caches it and writes it, masked, into build/chaosguard/ only)
      - name: Build
        if: steps.ccache.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: game
        env:
          CHAOS_CLIENT_KEY: ${{ secrets.CHAOS_CLIENT_KEY }}
        run: |
          if not exist "%VCPKG_DEFAULT_BINARY_CACHE%" mkdir "%VCPKG_DEFAULT_BINARY_CACHE%"
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          if not exist vcpkg git clone https://github.com/microsoft/vcpkg vcpkg
          call vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if errorlevel 1 exit /b 1
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_TOOLCHAIN_FILE=%CD%\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCHAOS_CLIENT_BUILD=%CLIENT_BUILD% -DCMAKE_POLICY_DEFAULT_CMP0069=NEW -DCMAKE_PROJECT_INCLUDE=%GITHUB_WORKSPACE%\chaos\client\tools\chaos_hardening.cmake
          if errorlevel 1 exit /b 1
          cmake --build build --parallel %NUMBER_OF_PROCESSORS%
          if errorlevel 1 exit /b 1

      - name: Save the vcpkg binary cache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: vcpkg-chaos-client-${{ hashFiles('game/vcpkg.json') }}-${{ github.run_id }}

      # the compiled files only, in built/ (the cache path): the exe as Chaos.exe, the DLLs, build/data
      - name: Keep the compiled client
        if: steps.ccache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          shopt -s nullglob
          exes=(game/build/*.exe)
          if [ ${#exes[@]} -ne 1 ]; then
            echo "::error::expected one exe in game/build, found: ${exes[*]:-none}"
            exit 1
          fi
          mkdir -p built
          cp "${exes[0]}" built/Chaos.exe
          cp game/build/*.dll built/ 2>/dev/null || true
          if [ -d game/build/data ]; then cp -r game/build/data built/data; fi
          ls -la built

      # PE header of the exe (client/tools/check_pe_hardening.py): ASLR, high entropy ASLR and DEP must be set; control flow
      # guard is reported (a warning when the toolchain did not take it). Runs before the exe is cached and on a cache hit.
      - name: Check the exe's hardening flags
        shell: bash
        run: |
          test -s built/Chaos.exe || { echo "::error::built/Chaos.exe is missing"; exit 1; }
          python -I chaos/client/tools/check_pe_hardening.py built/Chaos.exe | tee pe-hardening.txt
          grep -q 'guard_cf .*ok' pe-hardening.txt || echo "::warning::Chaos.exe has no control flow guard (see the flags line of the Build step)"
          grep -q 'cet_compat .*ok' pe-hardening.txt || echo "::notice::Chaos.exe is not CET shadow stack compatible"

      - name: Save the compiled client
        if: steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: built
          key: client-win-bin-v2-${{ steps.ckey.outputs.hash }}

      # the game launcher (O314, launcher/README.md): the entry point of the separate client download. It updates the
      # exe, the DLLs and chaos.pack from the signed manifest ("native" section) and starts the game. Rust, the Windows
      # runner has the toolchain; its tests run on Linux in ci.yml (Native checks)
      - name: Build the launcher (O314)
        shell: bash
        working-directory: chaos/launcher
        run: |
          cargo build --locked --release
          test -s target/release/cinders-launcher.exe

      # the exe and DLLs come from built/ (build or cache); init.lua, data, modules, mods and layouts always from game/
      - name: Put the client folder together
        shell: bash
        run: |
          shopt -s nullglob
          test -s built/Chaos.exe || { echo "::error::built/Chaos.exe is missing"; exit 1; }
          mkdir -p out/client
          cp built/Chaos.exe out/client/Chaos.exe
          cp built/*.dll out/client/ 2>/dev/null || true
          cp chaos/launcher/target/release/cinders-launcher.exe out/client/CindersLauncher.exe
          for p in init.lua data modules mods layouts; do
            if [ -e "game/$p" ]; then cp -r "game/$p" out/client/; fi
          done
          if [ -d built/data ]; then cp -r built/data/. out/client/data/; fi
          tar -cf client.tar -C out client

      - name: Release of this run (created by whichever job gets here first)
        shell: bash
        run: |
          gh release view "$PKG_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$PKG_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Windows package ${{ github.run_number }}" \
              --notes "Windows test package built by run ${{ github.run_id }} from $GITHUB_SHA (assets: $ASSETS_REF)." || \
            gh release view "$PKG_TAG" -R "$GITHUB_REPOSITORY" >/dev/null

      - name: Hand the client folder over
        shell: bash
        run: gh release upload "$PKG_TAG" client.tar -R "$GITHUB_REPOSITORY" --clobber

      - name: Upload the vcpkg build logs (on failure)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: client-vcpkg-logs
          path: game/vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore

  package:
    name: Package
    needs: [server, engine, client]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      editor_version: ${{ steps.editor.outputs.version }}
      editor_kind: ${{ steps.editor.outputs.kind }}
      editor_tag: ${{ steps.editor.outputs.tag }}
    steps:
      - name: Check out Cinders of Chaos
        uses: actions/checkout@v4
        with:
          path: chaos

      - name: Check out the assets
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ASSETS_REF }}
          path: assets
          sparse-checkout: |
            things
            SHA256SUMS.parts
          sparse-checkout-cone-mode: true

      - name: Get the parts
        run: |
          mkdir -p parts
          # one download per file, side by side (gh fetches the patterns of one call one after the other)
          pids=()
          for f in server.tar server-exe.tar client.tar; do
            gh release download "$PKG_TAG" -R "$GITHUB_REPOSITORY" -D parts -p "$f" --clobber &
            pids+=($!)
          done
          rc=0
          for pid in "${pids[@]}"; do wait "$pid" || rc=1; done
          [ "$rc" -eq 0 ] || { echo "::error::a download from the release failed"; exit 1; }
          for f in server.tar server-exe.tar client.tar; do test -s "parts/$f"; done

      # The map editor (O381, docs/CREDITS.md "Used for: editing the game map": AGPL-3.0) ships in the package with its
      # source zip next to it. Input map_editor (O387, default ours):
      #   ours      the newest mapeditor-<short sha> release of this repository (mapeditor-build.yml: upstream at the
      #             pin plus mapeditor/patches, ctest passed; tools/windows/editor_release.py latest-tag). Its zips and
      #             BUILD_INFO.txt are checked against its SHA256SUMS.txt (verify --ours). No such release, or no good
      #             download in three tries: a ::warning:: and the upstream release instead, so packaging never blocks.
      #   upstream  the upstream release. It is rolling (one tag, its files replaced on every upstream push), so both
      #             zips are checked against its SHA256SUMS.txt and a mismatch (a download during an upload) is
      #             fetched again, at most three times, then fails the run.
      # The upstream repository comes from docs/CREDITS.md (tools/windows/editor_release.py repo), the only file that
      # may name it. Outputs: kind (ours / upstream), tag, version, repo (the upstream, for the settings key), and
      # for ours upstream, patches, commit.
      # The script pack mapeditor\cinders (our area generator and every compiled area plan for the editor's Lua
      # scripts, server/tools/gen_editor_scripts.py, about a minute) is built here too.
      - name: Get the map editor and build its script pack
        id: editor
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq luajit
          (python3 -I chaos/server/tools/gen_editor_scripts.py cinderspack > cinderspack.log 2>&1) &
          pack_pid=$!
          src=$(python3 -I chaos/tools/windows/editor_release.py repo)
          kind=$MAP_EDITOR
          if [ "$kind" = ours ]; then
            tag=
            if gh release list -R "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt,isDraft > releases.json &&
               tag=$(python3 -I chaos/tools/windows/editor_release.py latest-tag releases.json); then
              echo "map editor: our build, release $tag of $GITHUB_REPOSITORY"
              ok=
              for try in 1 2 3; do
                rm -rf editordl && mkdir editordl
                gh release download "$tag" -R "$GITHUB_REPOSITORY" -D editordl -p '*-windows-x64.zip' \
                  -p '*-source.zip' -p SHA256SUMS.txt -p BUILD_INFO.txt || { sleep 30; continue; }
                if python3 -I chaos/tools/windows/editor_release.py verify editordl --ours > editor.env; then
                  ok=1; break
                fi
                echo "::warning::our map editor download $try does not match its SHA256SUMS.txt"
                sleep 30
              done
              if [ -z "$ok" ]; then
                echo "::warning::our map editor release $tag failed its checks: this package ships the upstream release"
                kind=upstream
              fi
            else
              echo "::warning::no mapeditor-* release of our build yet (run the workflow Map editor build on main): this package ships the upstream release"
              kind=upstream
            fi
          fi
          if [ "$kind" = upstream ]; then
            tag=$EDITOR_TAG
            echo "map editor: upstream $src, release $tag"
            ok=
            for try in 1 2 3; do
              rm -rf editordl && mkdir editordl
              gh release download "$tag" -R "$src" -D editordl -p '*-windows-x64.zip' -p '*-source.zip' \
                -p SHA256SUMS.txt -p update-manifest.json || { sleep 60; continue; }
              if python3 -I chaos/tools/windows/editor_release.py verify editordl > editor.env; then ok=1; break; fi
              echo "::warning::map editor download $try does not match its SHA256SUMS.txt (the release is being updated?)"
              sleep 60
            done
            [ -n "$ok" ] || { echo "::error::the map editor's release files do not match SHA256SUMS.txt"; exit 1; }
          fi
          cat editor.env
          # the upstream repository (the one our build was made from, else the credits): the settings key of the upstream
          # program is named after it; ours since O388 has its own (Software\Cinders\CindersMapEditor, editor_release.py)
          repo=$(sed -n 's/^upstream_repo=//p' editor.env)
          {
            grep -v '^upstream_repo=' editor.env
            echo "repo=${repo:-$src}"
            echo "kind=$kind"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          wait "$pack_pid" || { tail -n 40 cinderspack.log; echo "::error::the editor script pack failed"; exit 1; }
          tail -n 3 cinderspack.log
          test -f cinderspack/generate_area.lua && test -f cinderspack/plans/index.txt

      - name: Put the package together
        env:
          CHAOS_CLIENT_KEY: ${{ secrets.CHAOS_CLIENT_KEY }}
        run: |
          set -euo pipefail
          P=CindersOfChaos
          # the MariaDB download runs while the rest is put together; it is waited for where it is unpacked
          curl -fsSL --retry 3 -o mariadb.zip \
            "https://archive.mariadb.org/mariadb-${MARIADB_VERSION}/winx64-packages/mariadb-${MARIADB_VERSION}-winx64.zip" &
          curl_pid=$!
          mkdir -p "$P"
          tar -xf parts/server.tar -C "$P"
          tar -xf parts/client.tar -C "$P"
          # the engine source stays out of the package (it is in the base download and src-patches/)
          rm -rf "$P/server/src" "$P/server/cmake" "$P/server/CMakeLists.txt"
          tar -xf parts/server-exe.tar -C "$P/server/"

          (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts)
          mkdir -p things "$P/client/data/things/1098"
          # the pair is one archive cut in 95 MB parts since pair 36 (GitHub refuses files over 100 MB)
          cat assets/things/things-1098.tar.xz.part* | xz -d -T0 | tar -xf - -C things
          test -f things/Tibia.dat && test -f things/Tibia.spr || { echo "::error::the pair archive has no Tibia.dat / Tibia.spr"; exit 1; }
          # the client gets the dat and the spr as sprite shards (client/MANIFEST.md "Sharded sprites"): the single spr
          # is over 1 GiB since pair 37, which the updater of every client build refuses; the shards are byte-checked
          # against it. The single Tibia.spr goes to the map editor only (below).
          find things -maxdepth 1 -type f ! -name Tibia.spr -exec cp -t "$P/client/data/things/1098/" {} +
          python3 -I chaos/client/tools/sprites/spr_shards.py split things/Tibia.spr "$P/client/data/things/1098"
          # the byte check reads the single spr and every shard; it runs beside the next steps and is waited for before
          # the single spr moves to the map editor (below)
          python3 -I chaos/client/tools/sprites/spr_shards.py verify things/Tibia.spr "$P/client/data/things/1098" &
          verify_pid=$!

          # signed updater (client/MANIFEST.md "Signed updater"): turn it on when both inputs are set, and check that
          # make_update_manifest.py accepts this exact client folder, dat and shards included (unsigned dry run; a
          # shard set needs --min-package, this build)
          if [ -n "$UPDATE_MANIFEST" ] && [ -n "$UPDATE_PUBLIC_KEY" ]; then
            python3 -I chaos/client/tools/set_update_config.py "$P/client" \
              --manifest "$UPDATE_MANIFEST" --public-key "$UPDATE_PUBLIC_KEY" --package "$CLIENT_BUILD" \
              --baseline "${PKG_TAG#winpkg-}"
          fi
          python3 -I chaos/client/tools/make_update_manifest.py build "$P/client" --dry-run --min-package "$CLIENT_BUILD"

          # the map editor (O381, O387): its release zip (ours or upstream, step above) unpacked into mapeditor\ (one
          # folder in the zip: the program, its DLLs, qml\, data\ with one folder per client version, LICENSE, NOTICE;
          # ours also BUILD_INFO.txt), checked above against SHA256SUMS.txt.
          # Kept as it is, but for the package changes listed in mapeditor\CHANGES.txt: the 10.98 creature and item lists
          # are the game's, and the self-updater:
          #   - our build with its updater (Cinders Map Editor, patch 0009, O388): kept. It updates from the releases of
          #     this repository (rolling release mapeditor-latest) and never overwrites the files listed in
          #     mapeditor\update-keep.txt (the game's data\1098 lists).
          #   - upstream, or an older build of ours: left out (it would replace this folder with the upstream release).
          mkdir -p "$P/mapeditor" editorzip
          unzip -q "editordl/${{ steps.editor.outputs.windows }}" -d editorzip
          top=$(find editorzip -mindepth 1 -maxdepth 1 -type d)
          [ "$(echo "$top" | wc -l)" -eq 1 ] || { echo "::error::the map editor zip does not hold one folder"; exit 1; }
          cp -a "$top"/. "$P/mapeditor/"
          rm -rf editorzip
          updater=removed
          if [ "${{ steps.editor.outputs.kind }}" = ours ] && [ -f "$P/mapeditor/CindersMapEditor.exe" ] &&
             [ -f "$P/mapeditor/CindersMapEditorUpdater.exe" ]; then
            updater=kept
            printf '%s\r\n' "# The editor's updater never overwrites these files (the game's lists, windows-package.yml)." \
              "data/1098/creatures.xml" "data/1098/items.xml" > "$P/mapeditor/update-keep.txt"
          else
            find "$P/mapeditor" -maxdepth 1 -iname '*updater*.exe' -print -delete
          fi
          echo "map editor self-updater: $updater"
          n=$(find "$P/mapeditor" -maxdepth 1 -iname '*.exe' ! -iname '*updater*.exe' | wc -l)
          [ "$n" -eq 1 ] || { echo "::error::mapeditor holds $n programs besides the updater (open-map-editor.bat needs one)"; exit 1; }
          exe=$(find "$P/mapeditor" -maxdepth 1 -iname '*.exe' ! -iname '*updater*.exe')
          test -f "$P/mapeditor/LICENSE" && test -f "$P/mapeditor/NOTICE" && test -d "$P/mapeditor/data/1098" || {
            echo "::error::the map editor zip has no LICENSE, NOTICE or data/1098"; exit 1; }
          # the source of exactly this program (AGPL-3.0: we pass on the binary, so its source goes with it)
          mkdir -p "$P/mapeditor/source"
          cp "editordl/${{ steps.editor.outputs.source }}" "$P/mapeditor/source/"
          # where the editor keeps its settings (HKCU), read from the program (ours first, then the upstream names);
          # open-map-editor.bat presets them from it
          if python3 -I chaos/tools/windows/editor_release.py settings-key "$exe" "${{ steps.editor.outputs.repo }}" \
              > "$P/mapeditor/settings-key.txt"; then
            sed -i 's/$/\r/' "$P/mapeditor/settings-key.txt"
          else
            rm -f "$P/mapeditor/settings-key.txt"
            echo "::warning::the map editor's settings key was not found in the program: open-map-editor.bat presets nothing"
          fi
          {
            echo "Map editor of this package"
            echo
            if [ "${{ steps.editor.outputs.kind }}" = ours ]; then
              echo "Program: our build of https://github.com/${{ steps.editor.outputs.repo }}: upstream commit"
              echo "  ${{ steps.editor.outputs.upstream }} + our patches ${{ steps.editor.outputs.patches }}"
              echo "  (mapeditor/patches of Cinders of Chaos commit ${{ steps.editor.outputs.commit }};"
              echo "  GitHub release ${{ steps.editor.outputs.tag }} of $GITHUB_REPOSITORY, BUILD_INFO.txt in this folder)."
              echo "  Licence GNU AGPL-3.0: LICENSE and NOTICE in this folder. zip sha256"
              echo "  ${{ steps.editor.outputs.windows_sha256 }}"
              echo "Source: source\\${{ steps.editor.outputs.source }} (the same release): the patched source of this"
              echo "  program, our patches and the pin in its folder cinders-patches. sha256"
              echo "  ${{ steps.editor.outputs.source_sha256 }}"
              echo
              echo "Changed by the Cinders of Chaos package (the program is the build above):"
            else
              echo "Program: version ${{ steps.editor.outputs.version }} of https://github.com/${{ steps.editor.outputs.repo }}"
              echo "  (GitHub release ${{ steps.editor.outputs.tag }}), licence GNU AGPL-3.0: LICENSE and NOTICE in this folder."
              echo "  zip sha256 ${{ steps.editor.outputs.windows_sha256 }}"
              echo "Source: source\\${{ steps.editor.outputs.source }} (the same release), sha256"
              echo "  ${{ steps.editor.outputs.source_sha256 }}"
              echo
              echo "Changed by the Cinders of Chaos package (the program itself is unchanged):"
            fi
            if [ "$updater" = kept ]; then
              echo "  - update-keep.txt: the self-updater (Cinders Map Editor, start window) installs newer builds of"
              echo "    ours from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases and never overwrites the files listed"
              echo "    there (the two lists below). After an update BUILD_INFO.txt names the new build; its source is"
              echo "    the -source.zip of that release."
            else
              echo "  - the self-updater program is left out, so the editor stays at this version (it would replace"
              echo "    this folder, the lists below included). A newer editor comes with a newer package."
            fi
            echo "  - data\\1098\\creatures.xml: every monster and NPC of the game (tools/windows/editor_creatures.py)"
            echo "  - data\\1098\\items.xml: the game server's items.xml (open-map-editor.bat copies it again)"
            echo "Added (not part of the editor):"
            echo "  - client\\: the game's 10.98 Tibia.dat, Tibia.spr, Tibia.otfi and items.otb"
            echo "  - cinders\\: our scripts for Tools > Lua Scripts (cinders\\README.txt)"
            echo "  - settings-key.txt: where the editor keeps its settings (open-map-editor.bat presets them)"
          } | sed 's/$/\r/' > "$P/mapeditor/CHANGES.txt"
          mkdir -p "$P/mapeditor/client" "$P/mapeditor/data/1098"
          # the 10.98 profile reads data\1098\creatures.xml: Chaos monsters first (a name there wins), then every
          # monster and NPC of the packaged server (without them their spawns are empty grey squares, owner 2026-11-03)
          python3 -I chaos/tools/windows/editor_creatures.py "$P/mapeditor/data/1098/creatures.xml" \
            chaos/server/data/monster/monsters/chaos "$P/server/data/monster" "$P/server/data/npc"
          cp "$P/server/data/items/items.xml" "$P/mapeditor/data/1098/items.xml"
          # it reads items.otb from the client folder, next to Tibia.dat / Tibia.spr (below)
          cp "$P/server/data/items/items.otb" "$P/mapeditor/client/items.otb"
          # our area generator and plans for its Lua scripts (built in the step before)
          cp -a cinderspack "$P/mapeditor/cinders"

          wait "$curl_pid"
          unzip -q mariadb.zip
          mv "mariadb-${MARIADB_VERSION}-winx64" "$P/mariadb"
          # the zip's test suite, debug symbols and static libraries are not needed to run it
          rm -rf "$P/mariadb/mysql-test" "$P/mariadb/sql-bench" "$P/mariadb/lib" "$P/mariadb/include"
          find "$P/mariadb" -name '*.pdb' -delete
          for f in mariadbd.exe mariadb.exe mariadb-admin.exe mariadb-install-db.exe; do
            test -f "$P/mariadb/bin/$f" || { echo "::error::MariaDB zip has no bin/$f"; exit 1; }
          done

          # cmd needs CRLF line endings for its labels (goto); the repository keeps them as LF
          for f in chaos/tools/windows/package/*; do
            sed 's/\r$//; s/$/\r/' "$f" > "$P/$(basename "$f")"
          done
          {
            echo "chaos commit: $GITHUB_SHA"
            echo "assets: $ASSETS_REF @ $(git -C assets rev-parse HEAD)"
            echo "mariadb: $MARIADB_VERSION"
            echo "map editor: ${{ steps.editor.outputs.version }} (release ${{ steps.editor.outputs.tag }}, mapeditor\\CHANGES.txt)"
            echo "built: $(date -u +%Y-%m-%dT%H:%MZ) by run $GITHUB_RUN_ID"
          } | sed 's/$/\r/' > "$P/BUILD_INFO.txt"

          # ---- Cinders of Chaos client packs (client/BASE.md "Client packs") ----
          # The shipped client folder is just the exe and one encrypted pack. The map editor keeps its own copy of the
          # pair, the single Tibia.spr (it cannot read shards), since the client no longer ships data/things loose.
          wait "$verify_pid"  # fails the step (set -e) when the shards differ from the single spr
          find things -maxdepth 1 -type f -name 'Tibia.*' -exec mv -t "$P/mapeditor/client/" {} +
          test -f "$P/mapeditor/client/Tibia.dat" && test -f "$P/mapeditor/client/Tibia.spr"
          # the editors' sprite info file: without a .otfi beside the dat a map editor takes transparency as off and
          # reads our RGBA spr as RGB (black boxes and stripes in the item palette, owner 2026-11-02); read from the spr
          python3 -I chaos/tools/windows/editor_versions.py "$P/mapeditor/client" --otfi "$P/mapeditor/client/Tibia.otfi"
          grep -q 'transparency: true' "$P/mapeditor/client/Tibia.otfi"
          rm -rf things
          # keep the configured, unpacked tree (updater settings already written) for the separate client download,
          # which sets the server host and RSA key into init.lua before packing
          cp -a "$P/client" clienttree
          # the full local package starts Chaos.exe with start-client.bat and has no live update site: no launcher
          rm -f "$P/client/CindersLauncher.exe"
          # pack with the same key the exe was built with (pack_client.py falls back to the dev key when the secret is
          # absent, matching an allow_dev_key exe); then strip the loose tree, leaving the exe, its DLLs and chaos.pack
          python3 -I chaos/client/tools/pack_client.py build "$P/client" chaos.pack
          rm -rf "$P/client/init.lua" "$P/client/data" "$P/client/modules" "$P/client/mods" "$P/client/layouts"
          mv chaos.pack "$P/client/chaos.pack"
          du -sh "$P" "$P"/*

      # the separate downloads, made from the same folders: the client pointed at server_host, the server without the
      # client and the map editor (its config.lua ip = server_host; the database stays local, root without a password)
      - name: Client and server downloads (Windows)
        env:
          CHAOS_RSA_PUBLIC: ${{ secrets.CHAOS_RSA_PUBLIC || vars.CHAOS_RSA_PUBLIC }}
          CHAOS_CLIENT_KEY: ${{ secrets.CHAOS_CLIENT_KEY }}
        run: |
          set -euo pipefail
          P=CindersOfChaos
          crlf() { sed 's/\r$//; s/$/\r/' "$1" > "$2"; }
          info() {
            {
              echo "chaos commit: $GITHUB_SHA"
              echo "assets: $ASSETS_REF @ $(git -C assets rev-parse HEAD)"
              printf '%s\n' "$@"
              echo "built: $(date -u +%Y-%m-%dT%H:%MZ) by run $GITHUB_RUN_ID"
            } | sed 's/$/\r/'
          }

          # The separate client download is the exe and one encrypted pack (client/BASE.md "Client packs"): configure
          # the unpacked tree (server host, RSA key) kept by the package step, then pack it and strip the loose files.
          # No README.txt / BUILD_INFO.txt in the client folder.
          # the client folder (the long part: hashing and encrypting the pack) is made beside the server folder
          C=CindersOfChaos-Client
          (
            set -euo pipefail
            cp -a clienttree "$C"
            python3 -I chaos/client/tools/set_server_host.py "$C" "$SERVER_HOST" --site-url "$SITE_URL"
            python3 -I chaos/client/tools/set_rsa_key.py "$C" --from-env CHAOS_RSA_PUBLIC \
              $([ "$ALLOW_DEV_KEY" = true ] && echo --allow-default)
            python3 -I chaos/client/tools/make_update_manifest.py build "$C" --dry-run --min-package "$CLIENT_BUILD"
            # the launcher (O314) reads the same manifest, key and baseline as the in-game updater (written before the
            # pack hides init.lua); a package whose updater is off has nothing to update from: no launcher
            rc=0
            python3 -I chaos/client/tools/set_launcher_config.py "$C" || rc=$?
            if [ "$rc" -eq 2 ]; then rm -f "$C/CindersLauncher.exe"; elif [ "$rc" -ne 0 ]; then exit "$rc"; fi
            python3 -I chaos/client/tools/pack_client.py build "$C" "$C.pack"
            rm -rf "$C/init.lua" "$C/data" "$C/modules" "$C/mods" "$C/layouts"
            mv "$C.pack" "$C/chaos.pack"
            ls -la "$C"
          ) &
          client_pid=$!

          S=CindersOfChaos-Server
          mkdir "$S"
          # hard links instead of copies (same files, same disk); config.lua is edited below, so it gets a real copy
          # and the full package keeps its own
          cp -al "$P/server" "$P/mariadb" "$P/start-server.bat" "$P/stop-server.bat" "$S/"
          cp --remove-destination "$P/server/config.lua" "$S/server/config.lua"
          python3 -I - "$S/server/config.lua" "$SERVER_HOST" <<'PY'
          import re, sys
          path, host = sys.argv[1], sys.argv[2]
          text = open(path, encoding='latin-1').read()
          text, n = re.subn(r'^(ip\s*=\s*)[^\r\n]*', lambda m: m.group(1) + '"%s"' % host, text, count=1, flags=re.M)
          if n != 1:
              sys.exit('config.lua: no ip line')
          open(path, 'w', encoding='latin-1', newline='').write(text)
          print('server config.lua: ip = "%s"' % host)
          PY
          crlf chaos/tools/windows/server-README.txt "$S/README.txt"
          info "server host: $SERVER_HOST" "mariadb: $MARIADB_VERSION" > "$S/BUILD_INFO.txt"
          # the map files alone, for any 10.98 map editor: the loaded map and the client data (hard links)
          M=CindersOfChaos-MapFiles
          mkdir -p "$M/data"
          cp -al "$P/server/data/world" "$M/world"
          cp -al "$P/mapeditor/client" "$M/data/1098"
          # (items.otb came with the editor's client folder)
          cp -al "$P/server/data/items/items.xml" "$P/mapeditor/data/1098/creatures.xml" "$M/data/1098/"
          # the sprite editors' versions list, read from the shipped dat, spr and otb so it never goes stale
          python3 -I chaos/tools/windows/editor_versions.py "$M/data/1098" "$M/data/versions.xml"
          for f in 1098/Tibia.dat 1098/Tibia.spr 1098/Tibia.otfi 1098/items.otb 1098/items.xml 1098/creatures.xml versions.xml; do
            test -s "$M/data/$f" || { echo "::error::map files: no data/$f"; exit 1; }
          done
          ls "$M"/world/*.otbm >/dev/null || { echo "::error::map files: no .otbm in world/"; exit 1; }
          crlf chaos/tools/windows/mapfiles-README.txt "$M/README.txt"
          info > "$M/BUILD_INFO.txt"
          wait "$client_pid"  # fails the step (set -e) when the client folder failed
          du -sh "$C" "$S" "$M"

      - name: Publish the Windows downloads on the release
        run: |
          set -euo pipefail
          # The zips are made side by side, each uploaded as soon as it is done. Level 1 (the files inside are the
          # same at any level): the encrypted chaos.pack and archives do not compress, the rest barely gains from -9.
          pack() {  # zip name, folder
            zip -qr -1 -n .pack:.zip:.gz:.xz:.7z "$1" "$2"
            ls -la "$1"
            gh release upload "$PKG_TAG" "$1" -R "$GITHUB_REPOSITORY" --clobber
          }
          pids=()
          pack CindersOfChaos-Windows.zip CindersOfChaos &
          pids+=($!)
          pack CindersOfChaos-Client-Windows.zip CindersOfChaos-Client &
          pids+=($!)
          pack CindersOfChaos-Server-Windows.zip CindersOfChaos-Server &
          pids+=($!)
          pack CindersOfChaos-MapFiles.zip CindersOfChaos-MapFiles &
          pids+=($!)
          rc=0
          for pid in "${pids[@]}"; do wait "$pid" || rc=1; done
          [ "$rc" -eq 0 ] || { echo "::error::a Windows download failed to zip or upload"; exit 1; }

  engine-linux:
    name: Linux server (engine on Ubuntu 22.04, portable MariaDB)
    needs: server
    # the oldest glibc / libstdc++ of the supported systems: the binary then runs on Ubuntu 22.04+ and Debian 12+
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      APT_PACKAGES: >-
        cmake ninja-build g++ patchelf file libboost-date-time-dev libboost-system-dev libboost-filesystem-dev
        libboost-iostreams-dev libfmt-dev libpugixml-dev libcrypto++-dev libluajit-5.1-dev libmariadb-dev
        libmariadb-dev-compat
    steps:
      - name: Check out Cinders of Chaos
        uses: actions/checkout@v4
        with:
          path: chaos

      # the downloaded .deb files are cached (apt itself still installs them, so dpkg knows every package)
      - name: Restore the apt download cache
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-chaos-engine-ubuntu-22.04-v1

      - name: Build tools and libraries (apt)
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update -qq
          # shellcheck disable=SC2086 # APT_PACKAGES is a list of package names
          sudo apt-get install -y -qq --no-install-recommends -o Dir::Cache::archives="$HOME/apt-cache" $APT_PACKAGES
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache

      - name: Get the server folder
        run: |
          gh release download "$PKG_TAG" -R "$GITHUB_REPOSITORY" -p server.tar --clobber
          mkdir work
          tar -xf server.tar -C work
          rm server.tar

      # Compiled engine cache: the one file work/server/build/tfs. The key is one sha256 of: src/, cmake/ and
      # CMakeLists.txt of the server folder from the server job (base source + src-patches), the apt versions of the
      # build packages (APT_PACKAGES, libc6, libstdc++6), the g++ version, and the build recipe (keep it equal to the
      # Build step). The data, Lua and SQL of the server folder never come from the cache. Nothing from the inputs is
      # compiled in. The apt step above runs on a hit too: package_server.sh bundles the libraries installed here.
      - name: Key of the compiled engine
        id: key
        run: |
          set -euo pipefail
          cd work/server
          files=$(find src cmake CMakeLists.txt -type f 2>/dev/null | LC_ALL=C sort || true)
          grep -q '^src/' <<<"$files" || { echo "::error::no engine source found for the cache key"; exit 1; }
          grep -qx 'CMakeLists.txt' <<<"$files" || { echo "::error::no CMakeLists.txt found for the cache key"; exit 1; }
          # shellcheck disable=SC2086 # APT_PACKAGES is a list of package names
          debs=$(dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' $APT_PACKAGES libc6 libstdc++6 | LC_ALL=C sort)
          gcc=$(g++ -dumpfullversion -dumpmachine | tr '\n' ' ')
          recipe="engine-linux-v4 ubuntu-22.04 Release Ninja SKIP_GIT=ON no-Werror patch-0068-hardening"
          hash=$({ echo "$recipe"; echo "g++ $gcc"; echo "$debs"; printf '%s\n' "$files" | xargs -d '\n' sha256sum; } | sha256sum | cut -d' ' -f1)
          echo "recipe: $recipe"; echo "g++ $gcc"; echo "source files: $(wc -l <<<"$files")"; echo "key hash: $hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore the compiled engine
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: work/server/build/tfs
          key: engine-linux-bin-v4-${{ steps.key.outputs.hash }}

      - name: Build the engine
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: work/server
        run: |
          set -euo pipefail
          # GCC 11 of Ubuntu 22.04 warns in places where GCC 13 (the test server) does not; a warning must not stop the
          # release, and the warnings stay in this log
          grep -q -- ' -Werror ' CMakeLists.txt
          sed -i 's/ -Werror / /' CMakeLists.txt
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKIP_GIT=ON
          cmake --build build --parallel "$(nproc)"
          ls -la build/tfs

      - name: Save the compiled engine
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/server/build/tfs
          key: engine-linux-bin-v4-${{ steps.key.outputs.hash }}

      - name: Check the compiled engine
        run: |
          test -x work/server/build/tfs && ls -la work/server/build/tfs
          # patch 0068: PIE, RELRO, BIND_NOW, stack protector, FORTIFY (also for a cached binary)
          bash chaos/tools/linux/check_engine_hardening.sh work/server/build/tfs

      - name: Portable MariaDB (official Linux build)
        run: bash chaos/tools/linux/fetch_mariadb.sh "$MARIADB_VERSION" mariadb-linux

      - name: Put the Linux server together
        run: |
          set -euo pipefail
          P=CindersOfChaos-Server-Linux
          bash chaos/tools/linux/package_server.sh work/server work/server/build/tfs mariadb-linux "$SERVER_HOST" "$P"
          {
            echo "chaos commit: $GITHUB_SHA"
            echo "assets: $ASSETS_REF"
            echo "server host: $SERVER_HOST"
            echo "mariadb: $MARIADB_VERSION"
            echo "engine: built on $(lsb_release -ds), $(g++ --version | head -n 1)"
            echo "built: $(date -u +%Y-%m-%dT%H:%MZ) by run $GITHUB_RUN_ID"
          } > "$P/BUILD_INFO.txt"
          tar -czf "$P.tar.gz" "$P"
          ls -la "$P.tar.gz"
          rm -rf "$P" work mariadb-linux

      # the archive as a player gets it: extract, first start (database, sql-setup), "Server Online", the login port
      # answers, stop (the engine saves, the database stops)
      - name: Start test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf CindersOfChaos-Server-Linux.tar.gz -C "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke/CindersOfChaos-Server-Linux"
          ./start-server.sh -d
          ok=0
          for _ in $(seq 1 600); do
            if grep -q "Server Online" logs/server.log 2>/dev/null; then ok=1; break; fi
            # start-server.sh's own messages when it gives up (the engine's output is not matched)
            if grep -qE "^(Stopped\.|Missing: |mariadb-install-db failed|The database did not start|It crashed 5 times)" \
              logs/server.log 2>/dev/null; then break; fi
            sleep 1
          done
          tail -n 60 logs/server.log
          if [ $ok -ne 1 ]; then
            echo "::error::The Linux server package did not reach Server Online"
            tail -n 40 logs/mariadb.err logs/database-setup.log 2>/dev/null || true
            ./stop-server.sh || true
            exit 1
          fi
          timeout 5 bash -c 'echo > /dev/tcp/127.0.0.1/7171' && timeout 5 bash -c 'echo > /dev/tcp/127.0.0.1/7172'
          ./add-account.sh smoketest smoketest1 "Smoke Tester" mystic
          ./stop-server.sh
          if pgrep -af "$RUNNER_TEMP/smoke"; then
            echo "::error::processes of the package still run after stop-server.sh"
            exit 1
          fi
          cd / && rm -rf "$RUNNER_TEMP/smoke"

      - name: Publish the Linux server on the release
        run: gh release upload "$PKG_TAG" CindersOfChaos-Server-Linux.tar.gz -R "$GITHUB_REPOSITORY" --clobber

  client-linux:
    name: Linux client (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      # client/LINUX.md "Build", plus patchelf (tools/linux/bundle_libs.sh) and Xvfb / Mesa (the start test)
      APT_PACKAGES: >-
        cmake g++ libboost-all-dev libphysfs-dev libogg-dev libvorbis-dev zlib1g-dev libzip-dev libbz2-dev libssl-dev
        libopenal-dev libglew-dev libluajit-5.1-dev libgl1-mesa-dev libglu1-mesa-dev libx11-dev
        patchelf file xvfb xauth libgl1-mesa-dri
    steps:
      - name: Check out Cinders of Chaos
        uses: actions/checkout@v4
        with:
          path: chaos

      - name: Check out the assets
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ASSETS_REF }}
          path: assets
          sparse-checkout: |
            client
            things
            SHA256SUMS.parts
          sparse-checkout-cone-mode: true

      - name: Restore the apt download cache
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-chaos-client-ubuntu-22.04-v1

      - name: Build tools and libraries (apt)
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update -qq
          # shellcheck disable=SC2086 # APT_PACKAGES is a list of package names
          sudo apt-get install -y -qq --no-install-recommends -o Dir::Cache::archives="$HOME/apt-cache" $APT_PACKAGES
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache

      - name: Assemble the Cinders of Chaos client (base + client/base-patches + client/overlay)
        run: |
          (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts)
          mkdir base
          cat assets/client/base-client.tar.xz.part* | xz -d -T0 | tar -xf - -C base
          mv base/*/ base-client  # the archive holds one folder: the base client
          patch --version | head -n 1
          bash chaos/client/tools/assemble_client.sh "$GITHUB_WORKSPACE/base-client" "$GITHUB_WORKSPACE/game"
          # (it also prunes the unused files of client/tools/slim_prune.txt and fails when a file reference of the tree
          #  no longer resolves: client/tools/slim_client.py check, client/BASE.md "Slim client")
          rm -rf base base-client

      - name: No other server or client names in the assembled client (check_names.py --client, client/BASE.md)
        run: python3 -I chaos/tools/ci/check_names.py --client "$GITHUB_WORKSPACE/game"

      - name: Client guard inputs (build number, key secret)
        env:
          CHAOS_CLIENT_KEY: ${{ secrets.CHAOS_CLIENT_KEY }}
          CHAOS_RSA_PUBLIC: ${{ secrets.CHAOS_RSA_PUBLIC || vars.CHAOS_RSA_PUBLIC }}
        run: |
          if ! [[ "$CLIENT_BUILD" =~ ^[0-9]+$ ]] || [ "$CLIENT_BUILD" -lt 1 ] || [ "$CLIENT_BUILD" -gt 65535 ]; then
            echo "::error::client_build must be a number from 1 to 65535"
            exit 1
          fi
          if [ -z "$CHAOS_CLIENT_KEY" ] && [ "$ALLOW_DEV_KEY" != true ]; then
            echo "::error::No CHAOS_CLIENT_KEY secret. Set it (docs/SECURITY_CHECKLIST.md), or tick allow_dev_key for a test build."
            exit 1
          elif [ -z "$CHAOS_CLIENT_KEY" ]; then
            echo "::warning::No CHAOS_CLIENT_KEY secret (allow_dev_key): this client gets the public DEVELOPMENT key; a production server (clientGuardMode enforce) kicks it."
          elif ! [[ "$CHAOS_CLIENT_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::The CHAOS_CLIENT_KEY secret must be 64 hex digits (openssl rand -hex 32)"
            exit 1
          fi
          if [ -z "$CHAOS_RSA_PUBLIC" ] && [ "$ALLOW_DEV_KEY" != true ]; then
            echo "::error::No CHAOS_RSA_PUBLIC (the game server's login key, server/tools/rsa_key.py public). Set it, or tick allow_dev_key for a test build."
            exit 1
          fi
          echo "Client build $CLIENT_BUILD"

      # Compiled client cache: built/ holds the ELF executable (and build/data when CMake makes any), never the Lua,
      # data, modules, layouts or init.lua of game/ (package_client.sh copies those fresh from the assembled tree).
      # The key is one sha256 of: every file of the assembled game/ tree except data/ modules/ mods/ layouts/ init.lua,
      # the apt versions of the build packages and of libc6 / libstdc++6, the g++ version, the build recipe (keep it
      # equal to the Build step) and the values baked into the binary: CHAOS_CLIENT_BUILD and a sha256 of
      # CHAOS_CLIENT_KEY (never the key; empty key = the dev key). UPDATE_PUBLIC_KEY, SERVER_HOST, SITE_URL and
      # CHAOS_RSA_PUBLIC are not compiled in: "Put the Linux client together" writes them into init.lua.
      - name: Key of the compiled client
        id: key
        env:
          CHAOS_CLIENT_KEY: ${{ secrets.CHAOS_CLIENT_KEY }}
        run: |
          set -euo pipefail
          cd game
          files=$(find . -type f ! -path './data/*' ! -path './modules/*' ! -path './mods/*' ! -path './layouts/*' \
            ! -path './init.lua' | LC_ALL=C sort)
          grep -q '^\./src/' <<<"$files" || { echo "::error::no client source found for the cache key"; exit 1; }
          grep -qx './CMakeLists.txt' <<<"$files" || { echo "::error::no CMakeLists.txt found for the cache key"; exit 1; }
          # shellcheck disable=SC2086 # APT_PACKAGES is a list of package names
          debs=$(dpkg-query -W -f='${Package} ${Version} ${Architecture}\n' $APT_PACKAGES libc6 libstdc++6 | LC_ALL=C sort)
          gcc=$(g++ -dumpfullversion -dumpmachine | tr '\n' ' ')
          keyhash=$(printf '%s' "$CHAOS_CLIENT_KEY" | sha256sum | cut -d' ' -f1)
          recipe="client-linux-v1 ubuntu-22.04 Release make LUAJIT=ON PHYSFS=libphysfs.so OPENAL=libopenal.so build=$CLIENT_BUILD"
          hash=$({ echo "$recipe"; echo "g++ $gcc"; echo "$debs"; echo "key=$keyhash"; printf '%s\n' "$files" | xargs -d '\n' sha256sum; } | sha256sum | cut -d' ' -f1)
          echo "recipe: $recipe"; echo "g++ $gcc"; echo "source files: $(wc -l <<<"$files")"; echo "key hash: $hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      - name: Restore the compiled client
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: built
          key: client-linux-bin-v1-${{ steps.key.outputs.hash }}

      # client/LINUX.md "Build"; the key reaches CMake only as this step's environment variable (base patch 0035)
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CHAOS_CLIENT_KEY: ${{ secrets.CHAOS_CLIENT_KEY }}
        run: |
          set -euo pipefail
          mkdir build
          cd build
          cmake "$GITHUB_WORKSPACE/game" -DCMAKE_BUILD_TYPE=Release -DLUAJIT=ON \
            -DPHYSFS_LIBRARY=/usr/lib/x86_64-linux-gnu/libphysfs.so -DOPENAL_LIBRARY=/usr/lib/x86_64-linux-gnu/libopenal.so \
            -DCHAOS_CLIENT_BUILD="$CLIENT_BUILD"
          make -j"$(nproc)"

      # the compiled files only, in built/ (the cache path); package_client.sh wants exactly one ELF executable there
      - name: Keep the compiled client
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir built
          n=0
          while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q '^ELF 64-bit.*executable'; then cp -p "$f" built/; n=$((n + 1)); fi
          done < <(find build -maxdepth 1 -type f -perm -u+x -print0)
          [ "$n" -eq 1 ] || { echo "::error::expected one executable in build, found $n"; exit 1; }
          if [ -d build/data ]; then cp -r build/data built/data; fi
          ls -la built

      - name: Save the compiled client
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: built
          key: client-linux-bin-v1-${{ steps.key.outputs.hash }}

      - name: Put the Linux client together
        env:
          CHAOS_RSA_PUBLIC: ${{ secrets.CHAOS_RSA_PUBLIC || vars.CHAOS_RSA_PUBLIC }}
          CHAOS_CLIENT_KEY: ${{ secrets.CHAOS_CLIENT_KEY }}
        run: |
          set -euo pipefail
          P=CindersOfChaos-Client-Linux
          bash chaos/tools/linux/package_client.sh game built "$P"
          (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts)
          mkdir -p things "$P/data/things/1098"
          cat assets/things/things-1098.tar.xz.part* | xz -d -T0 | tar -xf - -C things
          test -f things/Tibia.dat && test -f things/Tibia.spr || { echo "::error::the pair archive has no Tibia.dat / Tibia.spr"; exit 1; }
          # the dat and the spr as sprite shards, as in the Windows client (the single spr is over the updater's 1 GiB)
          find things -maxdepth 1 -type f ! -name Tibia.spr -exec cp -t "$P/data/things/1098/" {} +
          python3 -I chaos/client/tools/sprites/spr_shards.py split things/Tibia.spr "$P/data/things/1098"
          python3 -I chaos/client/tools/sprites/spr_shards.py verify things/Tibia.spr "$P/data/things/1098"
          rm -rf things
          # the same updater settings as the Windows client (client/MANIFEST.md "Signed updater")
          if [ -n "$UPDATE_MANIFEST" ] && [ -n "$UPDATE_PUBLIC_KEY" ]; then
            python3 -I chaos/client/tools/set_update_config.py "$P" \
              --manifest "$UPDATE_MANIFEST" --public-key "$UPDATE_PUBLIC_KEY" --package "$CLIENT_BUILD" \
              --baseline "${PKG_TAG#winpkg-}"
          fi
          python3 -I chaos/client/tools/set_server_host.py "$P" "$SERVER_HOST" --site-url "$SITE_URL"
          python3 -I chaos/client/tools/set_rsa_key.py "$P" --from-env CHAOS_RSA_PUBLIC \
            $([ "$ALLOW_DEV_KEY" = true ] && echo --allow-default)
          python3 -I chaos/client/tools/make_update_manifest.py build "$P" --dry-run --min-package "$CLIENT_BUILD"
          # exe + one encrypted pack (client/BASE.md "Client packs"): pack the configured tree with the same key the
          # binary was built with, then strip the loose files. The Linux client keeps run-client.sh and lib/ beside the
          # binary (the launcher sets ALSOFT_DRIVERS / software GL and lib/ holds the bundled libraries, RUNPATH
          # $ORIGIN/lib); no BUILD_INFO.txt or README.txt in the folder.
          python3 -I chaos/client/tools/pack_client.py build "$P" "$P-chaos.pack"
          rm -rf "$P/init.lua" "$P/data" "$P/modules" "$P/mods" "$P/layouts" "$P/README.txt"
          mv "$P-chaos.pack" "$P/chaos.pack"
          ls -la "$P"
          tar -czf "$P.tar.gz" "$P"
          ls -la "$P.tar.gz"
          rm -rf "$P" game build built

      # the archive as a player gets it, on a virtual display with software OpenGL and no sound card: the client must
      # still be running after 30 seconds (it waits at the login screen). CHAOS_UPDATE_OFF=1: the updater makes no
      # request and mounts nothing (updater_core.lua offByEnv), so the test runs this package's own files whatever the
      # live update server publishes.
      - name: Start test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke/home"
          tar -xzf CindersOfChaos-Client-Linux.tar.gz -C "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke/CindersOfChaos-Client-Linux"
          code=0
          HOME="$RUNNER_TEMP/smoke/home" LIBGL_ALWAYS_SOFTWARE=1 ALSOFT_DRIVERS=null CHAOS_UPDATE_OFF=1 \
            xvfb-run -a -s "-screen 0 1280x720x24" timeout 30 ./run-client.sh > "$RUNNER_TEMP/client.log" 2>&1 || code=$?
          tail -n 40 "$RUNNER_TEMP/client.log"
          if [ $code -ne 124 ]; then
            echo "::error::The Linux client stopped within 30 seconds (exit code $code)"
            exit 1
          fi
          if ! grep -q 'updater: off (CHAOS_UPDATE_OFF is set)' "$RUNNER_TEMP/client.log"; then
            echo "::error::The start test did not turn the updater off (CHAOS_UPDATE_OFF): it may have used the live update server"
            exit 1
          fi
          cd / && rm -rf "$RUNNER_TEMP/smoke"

      - name: Release of this run (created by whichever job gets here first)
        run: |
          gh release view "$PKG_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$PKG_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Windows package ${{ github.run_number }}" \
              --notes "Windows test package built by run ${{ github.run_id }} from $GITHUB_SHA (assets: $ASSETS_REF)." || \
            gh release view "$PKG_TAG" -R "$GITHUB_REPOSITORY" >/dev/null

      - name: Publish the Linux client on the release
        run: gh release upload "$PKG_TAG" CindersOfChaos-Client-Linux.tar.gz -R "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish (release notes, links, cleanup)
    needs: [package, engine-linux, client-linux]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEY_STATE: ${{ secrets.CHAOS_CLIENT_KEY != '' && 'the official key (secret CHAOS_CLIENT_KEY)' || 'the public development key (no CHAOS_CLIENT_KEY secret)' }}
      RSA_STATE: ${{ (secrets.CHAOS_RSA_PUBLIC || vars.CHAOS_RSA_PUBLIC) && 'our own key (CHAOS_RSA_PUBLIC)' || 'the PUBLIC DEFAULT key (no CHAOS_RSA_PUBLIC), never for players' }}
      ALL_OK: ${{ needs.package.result == 'success' && needs.engine-linux.result == 'success' && needs.client-linux.result == 'success' }}
      EDITOR_VERSION: ${{ needs.package.outputs.editor_version }}
      EDITOR_KIND: ${{ needs.package.outputs.editor_kind }}
      EDITOR_REL: ${{ needs.package.outputs.editor_tag }}
    steps:
      - name: Release notes and download links
        run: |
          set -euo pipefail
          if ! gh release view "$PKG_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::No release $PKG_TAG: the first jobs failed"
            exit 1
          fi
          have=$(gh release view "$PKG_TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$PKG_TAG"
          line() {  # asset, description
            if grep -qxF "$1" <<< "$have"; then
              echo "- [$1]($base/$1): $2"
            else
              echo "- $1: not built in this run (see the run's failed job)"
            fi
          }
          {
            echo "Cinders of Chaos packages built by run [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from $GITHUB_SHA (assets: $ASSETS_REF)."
            echo
            line CindersOfChaos-Windows.zip "the whole game on one Windows PC: server, client, portable MariaDB, the map editor with its source (open-map-editor.bat; our area generator and plans in its Tools > Lua Scripts); start-server.bat, then start-client.bat (test accounts, local play)."
            line CindersOfChaos-Client-Windows.zip "the Windows client alone (Chaos.exe), connects to $SERVER_HOST."
            line CindersOfChaos-Server-Windows.zip "the Windows server alone: ChaosServer.exe, portable MariaDB, start-server.bat / stop-server.bat."
            line CindersOfChaos-MapFiles.zip "the map files alone for a 10.98 map editor: the .otbm with its spawns and houses, Tibia.dat / Tibia.spr / Tibia.otfi, items.otb / items.xml, creatures.xml, versions.xml (no editor)."
            line CindersOfChaos-Server-Linux.tar.gz "the Linux server (Ubuntu 22.04+, Debian 12+) with its own MariaDB: ./start-server.sh."
            line CindersOfChaos-Client-Linux.tar.gz "the Linux client (Ubuntu 22.04+, Debian 12+): ./run-client.sh, connects to $SERVER_HOST."
            echo
            echo "Client build $CLIENT_BUILD, built with $KEY_STATE. Server host of the separate downloads: $SERVER_HOST."
            if [ "$EDITOR_KIND" = ours ]; then
              echo "Map editor in the Windows zip: $EDITOR_VERSION, release [$EDITOR_REL](https://github.com/$GITHUB_REPOSITORY/releases/tag/$EDITOR_REL) (licence AGPL-3.0, patched source zip in mapeditor\\source, mapeditor\\CHANGES.txt)."
            elif [ "$EDITOR_KIND" = upstream ] && [ "$MAP_EDITOR" = ours ]; then
              echo "Map editor in the Windows zip: the UPSTREAM release, version ${EDITOR_VERSION:-unknown} (no usable release of our build; licence AGPL-3.0, source zip in mapeditor\\source, mapeditor\\CHANGES.txt)."
            else
              echo "Map editor in the Windows zip: the upstream release, version ${EDITOR_VERSION:-unknown} (licence AGPL-3.0, source zip in mapeditor\\source, mapeditor\\CHANGES.txt)."
            fi
            echo "Login encryption of the separate client downloads: $RSA_STATE."
          } > notes.md
          cat notes.md
          gh release edit "$PKG_TAG" -R "$GITHUB_REPOSITORY" --title "Cinders of Chaos packages ${{ github.run_number }}" \
            --notes-file notes.md
          {
            echo "## Downloads ($PKG_TAG)"
            echo
            cat notes.md
            echo
            echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$PKG_TAG"
          } >> "$GITHUB_STEP_SUMMARY"

      # kept after a failure, so that "Re-run failed jobs" still finds them (the release is pruned later anyway)
      - name: Delete the intermediate parts
        if: ${{ env.ALL_OK == 'true' }}
        run: |
          for part in server.tar server-exe.tar client.tar; do
            gh release delete-asset "$PKG_TAG" "$part" -R "$GITHUB_REPOSITORY" -y || true
          done

      - name: Keep the newest 3 package releases
        if: ${{ needs.package.result == 'success' }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("winpkg-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          done
