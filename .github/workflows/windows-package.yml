# Windows package and release downloads: every run publishes a prerelease winpkg-<run number> (Releases; the run's
# Summary links each file) with five ready-to-use downloads:
#   CindersOfChaos-Windows.zip         the whole game for one Windows PC: server, client, portable MariaDB, map editor;
#                                      extract it and run start-server.bat, then start-client.bat
#                                      (tools/windows/package/README.txt is in the zip)
#   CindersOfChaos-Client-Windows.zip  the Windows client alone (Chaos.exe, data with the 10.98 dat/spr, modules),
#                                      pointed at the input server_host (tools/windows/client-README.txt)
#   CindersOfChaos-Server-Windows.zip  the Windows server alone: ChaosServer.exe + DLLs, portable MariaDB, the start /
#                                      stop .bat files (tools/windows/server-README.txt)
#   CindersOfChaos-Server-Linux.tar.gz the engine built on Ubuntu 22.04 with its libraries in server/lib (RUNPATH
#                                      $ORIGIN/lib), production config.lua, portable MariaDB, start-server.sh /
#                                      stop-server.sh / add-account.sh, systemd unit examples (tools/linux/server/README.txt)
#   CindersOfChaos-Client-Linux.tar.gz the client built on Ubuntu 22.04 with its libraries in lib/, run-client.sh
#                                      (tools/linux/client/README.txt)
#
# MANUAL ONLY (workflow_dispatch): it never runs on push or pull_request, so it cannot turn PR checks red.
#
# Inputs come from the private branch windows-assets (its README.md): the base server download, the base client and
# the merged Chaos Tibia.dat / Tibia.spr (one archive, things/things-1098.tar.xz); large files are cut into parts under
# GitHub's 100 MB file limit.
#   server        Linux job: tools/windows/prepare_server.sh (engine patches, config.lua, install_all.py, sql-setup/)
#   engine        Windows job: the patched engine built with MSVC + vcpkg (x64-windows, the libraries the Linux build was
#                 checked with: Boost 1.83, fmt 9.1) -> ChaosServer.exe + DLLs
#   client        Windows job: base client + client/base-patches + client/overlay (client/tools/assemble_client.sh), built
#                 like windows-client.yml -> Chaos.exe
#   package       Linux job: everything above + portable MariaDB + the .bat files -> the three Windows downloads
#   engine-linux  Ubuntu 22.04 job (the oldest glibc of the supported systems): the same server folder, the engine built
#                 with the distribution's libraries, tools/linux/package_server.sh, a start test -> Server-Linux.tar.gz
#   client-linux  Ubuntu 22.04 job: the client assembled and built as client/LINUX.md says, tools/linux/package_client.sh,
#                 a start test under Xvfb -> Client-Linux.tar.gz
#   publish       release notes, download links in the Summary, intermediate parts deleted, older releases pruned
#
# Client guard (client/BASE.md "Client guard", server/README.md "Client guard"): both clients are built with the
# repository secret CHAOS_CLIENT_KEY (Settings -> Secrets and variables -> Actions -> New repository secret; 64 hex
# digits, the same value as CHAOS_CLIENT_KEY on the game server) and the build number of the input client_build. Without
# the secret the run fails, unless the input allow_dev_key is ticked: then they get the public development key (a
# warning in the run and in the release notes), which a production server refuses. The Windows
# packages' server folder keeps the guard off (local play); the Linux server turns it on when its chaos.env sets the key.
# Login key (server/README.md "Login encryption (RSA, XTEA)"): the separate client downloads encrypt the login with the
# game server's own RSA key, whose public modulus (decimal, server/tools/rsa_key.py public) is the secret or variable
# CHAOS_RSA_PUBLIC (public, but kept out of the repository); client/tools/set_rsa_key.py writes it into init.lua. Without
# it the run fails unless allow_dev_key is ticked (then the public default key, a warning). The full Windows zip keeps
# the default key: its own server folder has the stock key.pem.
# Signed updater (client/MANIFEST.md "Signed updater"): it updates only modules/ mods/ data/ layouts/, which both clients
# share, so update_manifest / update_public_key go into the Windows and the Linux client alike, with the baseline
# Services.update.baseline = this run's number (winpkg-N -> N, the version publish_client_update.sh gives the update made
# from this package): the client never applies a manifest below it, so it never goes back to an older live update.
# The start test runs with CHAOS_UPDATE_OFF=1: no request to the live update server, so a package never depends on
# what is published (winpkg-47 applied the older live winpkg-46 files and restarted, base patch 0101).
# The first run builds the vcpkg ports of both exes (about an hour); later runs reuse the vcpkg binary caches.
name: Windows package

on:
  workflow_dispatch:
    inputs:
      assets_ref:
        description: "Branch of the base server, base client and dat/spr"
        required: false
        default: "windows-assets"
      update_manifest:
        description: "Signed updater: https URL of updates/live/manifest.json on the website (empty: updater off)"
        required: false
        default: ""
      update_public_key:
        description: "Signed updater: the operator's Ed25519 public key, 64 hex digits (never the private key)"
        required: false
        default: ""
      client_build:
        description: "Client build number 1-65535 (CHAOS_CLIENT_BUILD; also Services.update.package). Raise it for every new exe"
        required: false
        default: "1"
      server_host:
        description: "Server address of the separate client and server downloads (DNS name or IPv4; the full Windows zip keeps 127.0.0.1)"
        required: false
        default: "127.0.0.1"
      site_url:
        description: "Website of the separate client downloads, https://... (account API: character looks and Create character; login-screen services through <site>/clientservices). Empty: both off"
        required: false
        default: ""
      allow_dev_key:
        description: "Test build only: allow clients without the secrets CHAOS_CLIENT_KEY / CHAOS_RSA_PUBLIC (public development keys; never for players)"
        type: boolean
        required: false
        default: false

# contents: write: the jobs hand their parts over through a prerelease of this run (tag winpkg-<run number>) instead of
# workflow artifacts, which count against the account's artifact storage quota; release assets do not. The publish
# job deletes the intermediate parts, keeps the five downloads and prunes older winpkg releases (the newest 3 stay).
permissions:
  contents: write

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false

env:
  ASSETS_REF: ${{ inputs.assets_ref || 'windows-assets' }}
  UPDATE_MANIFEST: ${{ inputs.update_manifest }}
  UPDATE_PUBLIC_KEY: ${{ inputs.update_public_key }}
  CLIENT_BUILD: ${{ inputs.client_build || '1' }}
  SERVER_HOST: ${{ inputs.server_host || '127.0.0.1' }}
  SITE_URL: ${{ inputs.site_url }}
  ALLOW_DEV_KEY: ${{ inputs.allow_dev_key && 'true' || 'false' }}
  # vcpkg registry state for the engine's libraries (tag 2023.12.12: Boost 1.83); fmt is pinned to 9.1.0 below
  ENGINE_VCPKG_BASELINE: c8696863d371ab7f46e213d8f5ca923c4aef2a00
  MARIADB_VERSION: "10.11.14"
  GH_TOKEN: ${{ github.token }}
  PKG_TAG: winpkg-${{ github.run_number }}

jobs:
  server:
    name: Server folder (patches, Chaos content, SQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out Cinders of Chaos
        uses: actions/checkout@v4
        with:
          path: chaos

      - name: Check out the assets
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ASSETS_REF }}
          path: assets
          sparse-checkout: |
            server
            SHA256SUMS.parts
          sparse-checkout-cone-mode: true

      - name: Prepare the server folder
        run: |
          # install step contentareas: numpy (area_plan_place.py reads the map; python3 -I does not see pip's user
          # site) and luajit (hunt_teleports_dump.lua reads the teleport room config)
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-numpy luajit
          (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts)
          mkdir -p base work
          tar -xJf assets/server/base-server.tar.xz -C base
          mv base/*/ work/server  # the archive holds one folder: the base server
          bash chaos/tools/windows/prepare_server.sh work/server
          tar -cf server.tar -C work server

      - name: Release of this run (created by whichever job gets here first)
        shell: bash
        run: |
          gh release view "$PKG_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$PKG_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Windows package ${{ github.run_number }}" \
              --notes "Windows test package built by run ${{ github.run_id }} from $GITHUB_SHA (assets: $ASSETS_REF)." || \
            gh release view "$PKG_TAG" -R "$GITHUB_REPOSITORY" >/dev/null

      - name: Hand the server folder over
        run: gh release upload "$PKG_TAG" server.tar -R "$GITHUB_REPOSITORY" --clobber

  engine:
    name: Engine (MSVC, vcpkg x64-windows, v142 libraries)
    needs: server
    # Visual Studio 2022 image: it also carries the VS 2019 toolset (v142) the library builds use (see the triplet below)
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_cache
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg_cache,readwrite"
    steps:
      - name: Get the server folder
        shell: bash
        run: gh release download "$PKG_TAG" -R "$GITHUB_REPOSITORY" -p server.tar --clobber

      - name: Unpack the engine source
        shell: bash
        run: |
          tar -xf server.tar server/CMakeLists.txt server/cmake server/src
          cat > server/vcpkg.json <<EOF
          {
            "name": "chaos-server",
            "version-string": "1",
            "builtin-baseline": "$ENGINE_VCPKG_BASELINE",
            "dependencies": [
              "boost-asio", "boost-date-time", "boost-filesystem", "boost-iostreams", "boost-lockfree",
              "boost-system", "boost-variant", "cryptopp", "fmt", "libmariadb", "luajit", "pugixml"
            ],
            "overrides": [{"name": "fmt", "version": "9.1.0", "port-version": 1}]
          }
          EOF
          cat server/vcpkg.json
          # the libraries are built with the VS 2019 toolset (v142, 14.29, installed on the windows-2022 image): the
          # Boost 1.83 ports build with b2, which names libraries vc140 for MSVC 14.4x and then cannot find them. The
          # engine itself is built with the current compiler (v142 and v143 libraries are binary compatible).
          # vcpkg's packages export imported targets (cryptopp::cryptopp, unofficial::libmariadb); the base CMakeLists.txt
          # names the libraries by bare file names that do not exist there (cryptopp-static.lib, libmariadb.lib)
          python - <<'PY'
          import re
          p = 'server/CMakeLists.txt'
          s = open(p).read()
          block = ('\n# Windows package build: vcpkg imported targets\n'
                   'if (TARGET cryptopp::cryptopp)\n    set(Crypto++_LIBRARIES cryptopp::cryptopp)\nendif ()\n'
                   'if (TARGET unofficial::libmariadb)\n    set(MYSQL_CLIENT_LIBS unofficial::libmariadb)\nendif ()\n')
          s, n = re.subn(r'(find_package\(Threads REQUIRED\)\n)', lambda m: m.group(1) + block, s, count=1)
          assert n == 1, 'find_package(Threads REQUIRED) not found'
          open(p, 'w').write(s)
          PY
          mkdir -p server/triplets
          cat > server/triplets/x64-windows-v142.cmake <<EOF
          set(VCPKG_TARGET_ARCHITECTURE x64)
          set(VCPKG_CRT_LINKAGE dynamic)
          set(VCPKG_LIBRARY_LINKAGE dynamic)
          set(VCPKG_PLATFORM_TOOLSET v142)
          set(VCPKG_PLATFORM_TOOLSET_VERSION 14.29)
          EOF

      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: vcpkg-chaos-engine-v142-${{ env.ENGINE_VCPKG_BASELINE }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-chaos-engine-v142-${{ env.ENGINE_VCPKG_BASELINE }}-

      - name: Build
        shell: cmd
        working-directory: server
        env:
          # added to CMake's own MSVC flags: the base download's own Visual Studio project defines the first one
          CXXFLAGS: /D_CRT_SECURE_NO_WARNINGS /bigobj
        run: |
          if not exist "%VCPKG_DEFAULT_BINARY_CACHE%" mkdir "%VCPKG_DEFAULT_BINARY_CACHE%"
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          git clone https://github.com/microsoft/vcpkg "%GITHUB_WORKSPACE%\vcpkg"
          if errorlevel 1 exit /b 1
          call "%GITHUB_WORKSPACE%\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          if errorlevel 1 exit /b 1
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKIP_GIT=ON -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_TOOLCHAIN_FILE=%GITHUB_WORKSPACE%\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_OVERLAY_TRIPLETS=%CD%\triplets -DVCPKG_TARGET_TRIPLET=x64-windows-v142
          if errorlevel 1 exit /b 1
          cmake --build build --parallel %NUMBER_OF_PROCESSORS%
          if errorlevel 1 exit /b 1

      # saved even when the build fails: the ports are built before the engine, so the next run starts there
      - name: Save the vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: vcpkg-chaos-engine-v142-${{ env.ENGINE_VCPKG_BASELINE }}-${{ github.run_id }}

      - name: Collect the exe and its DLLs
        shell: bash
        run: |
          mkdir -p out
          cp server/build/tfs.exe out/ChaosServer.exe
          cp server/build/*.dll out/
          ls -la out

      - name: Hand the engine over
        shell: bash
        run: |
          tar -cf server-exe.tar -C out .
          gh release upload "$PKG_TAG" server-exe.tar -R "$GITHUB_REPOSITORY" --clobber

      - name: Upload the vcpkg build logs (on failure)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: engine-vcpkg-logs
          path: vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore

  client:
    name: Client (MSVC, vcpkg x64-windows-static)
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_cache
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}\\vcpkg_cache,readwrite"
    steps:
      # the patches are plain unified diffs with LF line endings; a CRLF checkout would make them fail to apply
      - name: Keep line endings as they are
        shell: bash
        run: git config --global core.autocrlf false

      - name: Check out Cinders of Chaos
        uses: actions/checkout@v4
        with:
          path: chaos

      - name: Check out the assets
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ASSETS_REF }}
          path: assets
          sparse-checkout: |
            client
            SHA256SUMS.parts
          sparse-checkout-cone-mode: true

      - name: Assemble the Cinders of Chaos client (base + client/base-patches + client/overlay)
        shell: bash
        run: |
          (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts)
          mkdir base
          cat assets/client/base-client.tar.xz.part* | xz -d | tar -xf - -C base
          mv base/*/ base-client  # the archive holds one folder: the base client
          patch --version | head -n 1
          bash chaos/client/tools/assemble_client.sh "$GITHUB_WORKSPACE/base-client" "$GITHUB_WORKSPACE/game"
          echo "chaos commit: $GITHUB_SHA" | tee game/BUILD_INFO.txt

      - name: Client guard inputs (build number, key secret)
        shell: bash
        env:
          CHAOS_CLIENT_KEY: ${{ secrets.CHAOS_CLIENT_KEY }}
          CHAOS_RSA_PUBLIC: ${{ secrets.CHAOS_RSA_PUBLIC || vars.CHAOS_RSA_PUBLIC }}
        run: |
          if ! [[ "$CLIENT_BUILD" =~ ^[0-9]+$ ]] || [ "$CLIENT_BUILD" -lt 1 ] || [ "$CLIENT_BUILD" -gt 65535 ]; then
            echo "::error::client_build must be a number from 1 to 65535"
            exit 1
          fi
          if [ -z "$CHAOS_CLIENT_KEY" ] && [ "$ALLOW_DEV_KEY" != true ]; then
            echo "::error::No CHAOS_CLIENT_KEY secret. Set it (docs/SECURITY_CHECKLIST.md), or tick allow_dev_key for a test build."
            exit 1
          elif [ -z "$CHAOS_CLIENT_KEY" ]; then
            echo "::warning::No CHAOS_CLIENT_KEY secret (allow_dev_key): this client gets the public DEVELOPMENT key; a production server (clientGuardMode enforce) kicks it."
          elif ! [[ "$CHAOS_CLIENT_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::The CHAOS_CLIENT_KEY secret must be 64 hex digits (openssl rand -hex 32)"
            exit 1
          fi
          if [ -z "$CHAOS_RSA_PUBLIC" ] && [ "$ALLOW_DEV_KEY" != true ]; then
            echo "::error::No CHAOS_RSA_PUBLIC (the game server's login key, server/tools/rsa_key.py public). Set it, or tick allow_dev_key for a test build."
            exit 1
          fi
          echo "Client build $CLIENT_BUILD"

      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Restore the vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: vcpkg-chaos-client-${{ hashFiles('game/vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-chaos-client-${{ hashFiles('game/vcpkg.json') }}-
            vcpkg-chaos-client-

      # cmd + vcvars64, as the base client's own workflow does: the vcpkg port builds need the full MSVC environment
      # the key reaches CMake only as this step's environment variable (src/client/CMakeLists.txt reads
      # $ENV{CHAOS_CLIENT_KEY} at configure time, never caches it and writes it, masked, into build/chaosguard/ only)
      - name: Build
        shell: cmd
        working-directory: game
        env:
          CHAOS_CLIENT_KEY: ${{ secrets.CHAOS_CLIENT_KEY }}
        run: |
          if not exist "%VCPKG_DEFAULT_BINARY_CACHE%" mkdir "%VCPKG_DEFAULT_BINARY_CACHE%"
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSDIR=%%i"
          call "%VSDIR%\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          if not exist vcpkg git clone https://github.com/microsoft/vcpkg vcpkg
          call vcpkg\bootstrap-vcpkg.bat -disableMetrics
          if errorlevel 1 exit /b 1
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_TOOLCHAIN_FILE=%CD%\vcpkg\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCHAOS_CLIENT_BUILD=%CLIENT_BUILD%
          if errorlevel 1 exit /b 1
          cmake --build build --parallel %NUMBER_OF_PROCESSORS%
          if errorlevel 1 exit /b 1

      - name: Save the vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}\vcpkg_cache
          key: vcpkg-chaos-client-${{ hashFiles('game/vcpkg.json') }}-${{ github.run_id }}

      - name: Put the client folder together
        shell: bash
        run: |
          shopt -s nullglob
          exes=(game/build/*.exe)
          if [ ${#exes[@]} -ne 1 ]; then
            echo "::error::expected one exe in game/build, found: ${exes[*]:-none}"
            exit 1
          fi
          mkdir -p out/client
          cp "${exes[0]}" out/client/Chaos.exe
          cp game/build/*.dll out/client/ 2>/dev/null || true
          for p in init.lua data modules mods layouts; do
            if [ -e "game/$p" ]; then cp -r "game/$p" out/client/; fi
          done
          if [ -d game/build/data ]; then cp -r game/build/data/. out/client/data/; fi
          tar -cf client.tar -C out client

      - name: Release of this run (created by whichever job gets here first)
        shell: bash
        run: |
          gh release view "$PKG_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$PKG_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Windows package ${{ github.run_number }}" \
              --notes "Windows test package built by run ${{ github.run_id }} from $GITHUB_SHA (assets: $ASSETS_REF)." || \
            gh release view "$PKG_TAG" -R "$GITHUB_REPOSITORY" >/dev/null

      - name: Hand the client folder over
        shell: bash
        run: gh release upload "$PKG_TAG" client.tar -R "$GITHUB_REPOSITORY" --clobber

      - name: Upload the vcpkg build logs (on failure)
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: client-vcpkg-logs
          path: game/vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore

  package:
    name: Package
    needs: [server, engine, client]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Cinders of Chaos
        uses: actions/checkout@v4
        with:
          path: chaos

      - name: Check out the assets
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ASSETS_REF }}
          path: assets
          sparse-checkout: |
            things
            mapeditor
            SHA256SUMS.parts
          sparse-checkout-cone-mode: true

      - name: Get the parts
        run: |
          mkdir -p parts
          gh release download "$PKG_TAG" -R "$GITHUB_REPOSITORY" -D parts \
            -p server.tar -p server-exe.tar -p client.tar --clobber

      - name: Put the package together
        run: |
          set -euo pipefail
          P=CindersOfChaos
          mkdir -p "$P"
          tar -xf parts/server.tar -C "$P"
          tar -xf parts/client.tar -C "$P"
          # the engine source stays out of the package (it is in the base download and src-patches/)
          rm -rf "$P/server/src" "$P/server/cmake" "$P/server/CMakeLists.txt"
          tar -xf parts/server-exe.tar -C "$P/server/"

          (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts)
          mkdir -p "$P/client/data/things/1098"
          tar -xJf assets/things/things-1098.tar.xz -C "$P/client/data/things/1098"

          # signed updater (client/MANIFEST.md "Signed updater"): turn it on when both inputs are set, and check that
          # make_update_manifest.py accepts this exact client folder, dat/spr included (unsigned dry run)
          if [ -n "$UPDATE_MANIFEST" ] && [ -n "$UPDATE_PUBLIC_KEY" ]; then
            python3 -I chaos/client/tools/set_update_config.py "$P/client" \
              --manifest "$UPDATE_MANIFEST" --public-key "$UPDATE_PUBLIC_KEY" --package "$CLIENT_BUILD" \
              --baseline "${PKG_TAG#winpkg-}"
          fi
          python3 -I chaos/client/tools/make_update_manifest.py build "$P/client" --dry-run

          # the map editor (10.98): our items.otb / items.xml (with every Chaos item the installers added) and our
          # monsters in its creature list; it reads the sprites from client\data\things\1098 (README.txt)
          mkdir mapx
          tar -xJf assets/mapeditor/map-editor.tar.xz -C mapx
          mv mapx/*/ "$P/mapeditor"
          mv "$P"/mapeditor/*.exe "$P/mapeditor/MapEditor.exe"
          cp "$P/server/data/items/items.otb" "$P/server/data/items/items.xml" "$P/mapeditor/data/1098/"
          python3 -I chaos/tools/windows/rme_creatures.py "$P/mapeditor/data/1098/creatures.xml" \
            chaos/server/data/monster/monsters/chaos

          curl -fsSL --retry 3 -o mariadb.zip \
            "https://archive.mariadb.org/mariadb-${MARIADB_VERSION}/winx64-packages/mariadb-${MARIADB_VERSION}-winx64.zip"
          unzip -q mariadb.zip
          mv "mariadb-${MARIADB_VERSION}-winx64" "$P/mariadb"
          # the zip's test suite, debug symbols and static libraries are not needed to run it
          rm -rf "$P/mariadb/mysql-test" "$P/mariadb/sql-bench" "$P/mariadb/lib" "$P/mariadb/include"
          find "$P/mariadb" -name '*.pdb' -delete
          for f in mariadbd.exe mariadb.exe mariadb-admin.exe mariadb-install-db.exe; do
            test -f "$P/mariadb/bin/$f" || { echo "::error::MariaDB zip has no bin/$f"; exit 1; }
          done

          # cmd needs CRLF line endings for its labels (goto); the repository keeps them as LF
          for f in chaos/tools/windows/package/*; do
            sed 's/\r$//; s/$/\r/' "$f" > "$P/$(basename "$f")"
          done
          {
            echo "chaos commit: $GITHUB_SHA"
            echo "assets: $ASSETS_REF @ $(git -C assets rev-parse HEAD)"
            echo "mariadb: $MARIADB_VERSION"
            echo "built: $(date -u +%Y-%m-%dT%H:%MZ) by run $GITHUB_RUN_ID"
          } | sed 's/$/\r/' > "$P/BUILD_INFO.txt"
          du -sh "$P" "$P"/*

      # the separate downloads, made from the same folders: the client pointed at server_host, the server without the
      # client and the map editor (its config.lua ip = server_host; the database stays local, root without a password)
      - name: Client and server downloads (Windows)
        env:
          CHAOS_RSA_PUBLIC: ${{ secrets.CHAOS_RSA_PUBLIC || vars.CHAOS_RSA_PUBLIC }}
        run: |
          set -euo pipefail
          P=CindersOfChaos
          crlf() { sed 's/\r$//; s/$/\r/' "$1" > "$2"; }
          info() {
            {
              echo "chaos commit: $GITHUB_SHA"
              echo "assets: $ASSETS_REF @ $(git -C assets rev-parse HEAD)"
              printf '%s\n' "$@"
              echo "built: $(date -u +%Y-%m-%dT%H:%MZ) by run $GITHUB_RUN_ID"
            } | sed 's/$/\r/'
          }

          C=CindersOfChaos-Client
          cp -a "$P/client" "$C"
          python3 -I chaos/client/tools/set_server_host.py "$C" "$SERVER_HOST" --site-url "$SITE_URL"
          python3 -I chaos/client/tools/set_rsa_key.py "$C" --from-env CHAOS_RSA_PUBLIC \
            $([ "$ALLOW_DEV_KEY" = true ] && echo --allow-default)
          python3 -I chaos/client/tools/make_update_manifest.py build "$C" --dry-run
          crlf chaos/tools/windows/client-README.txt "$C/README.txt"
          info "server host: $SERVER_HOST" "client build: $CLIENT_BUILD" > "$C/BUILD_INFO.txt"

          S=CindersOfChaos-Server
          mkdir "$S"
          cp -a "$P/server" "$P/mariadb" "$P/start-server.bat" "$P/stop-server.bat" "$S/"
          python3 -I - "$S/server/config.lua" "$SERVER_HOST" <<'PY'
          import re, sys
          path, host = sys.argv[1], sys.argv[2]
          text = open(path, encoding='latin-1').read()
          text, n = re.subn(r'^(ip\s*=\s*)[^\r\n]*', lambda m: m.group(1) + '"%s"' % host, text, count=1, flags=re.M)
          if n != 1:
              sys.exit('config.lua: no ip line')
          open(path, 'w', encoding='latin-1', newline='').write(text)
          print('server config.lua: ip = "%s"' % host)
          PY
          crlf chaos/tools/windows/server-README.txt "$S/README.txt"
          info "server host: $SERVER_HOST" "mariadb: $MARIADB_VERSION" > "$S/BUILD_INFO.txt"
          du -sh "$C" "$S"

      - name: Publish the Windows downloads on the release
        run: |
          set -euo pipefail
          zip -qr -9 CindersOfChaos-Windows.zip CindersOfChaos
          zip -qr -9 CindersOfChaos-Client-Windows.zip CindersOfChaos-Client
          zip -qr -9 CindersOfChaos-Server-Windows.zip CindersOfChaos-Server
          ls -la CindersOfChaos-*.zip
          gh release upload "$PKG_TAG" CindersOfChaos-Windows.zip CindersOfChaos-Client-Windows.zip \
            CindersOfChaos-Server-Windows.zip -R "$GITHUB_REPOSITORY" --clobber

  engine-linux:
    name: Linux server (engine on Ubuntu 22.04, portable MariaDB)
    needs: server
    # the oldest glibc / libstdc++ of the supported systems: the binary then runs on Ubuntu 22.04+ and Debian 12+
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      APT_PACKAGES: >-
        cmake ninja-build g++ patchelf file libboost-date-time-dev libboost-system-dev libboost-filesystem-dev
        libboost-iostreams-dev libfmt-dev libpugixml-dev libcrypto++-dev libluajit-5.1-dev libmariadb-dev
        libmariadb-dev-compat
    steps:
      - name: Check out Cinders of Chaos
        uses: actions/checkout@v4
        with:
          path: chaos

      # the downloaded .deb files are cached (apt itself still installs them, so dpkg knows every package)
      - name: Restore the apt download cache
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-chaos-engine-ubuntu-22.04-v1

      - name: Build tools and libraries (apt)
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update -qq
          # shellcheck disable=SC2086 # APT_PACKAGES is a list of package names
          sudo apt-get install -y -qq --no-install-recommends -o Dir::Cache::archives="$HOME/apt-cache" $APT_PACKAGES
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache

      - name: Get the server folder
        run: |
          gh release download "$PKG_TAG" -R "$GITHUB_REPOSITORY" -p server.tar --clobber
          mkdir work
          tar -xf server.tar -C work
          rm server.tar

      - name: Build the engine
        working-directory: work/server
        run: |
          set -euo pipefail
          # GCC 11 of Ubuntu 22.04 warns in places where GCC 13 (the test server) does not; a warning must not stop the
          # release, and the warnings stay in this log
          grep -q -- ' -Werror ' CMakeLists.txt
          sed -i 's/ -Werror / /' CMakeLists.txt
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKIP_GIT=ON
          cmake --build build --parallel "$(nproc)"
          ls -la build/tfs

      - name: Portable MariaDB (official Linux build)
        run: bash chaos/tools/linux/fetch_mariadb.sh "$MARIADB_VERSION" mariadb-linux

      - name: Put the Linux server together
        run: |
          set -euo pipefail
          P=CindersOfChaos-Server-Linux
          bash chaos/tools/linux/package_server.sh work/server work/server/build/tfs mariadb-linux "$SERVER_HOST" "$P"
          {
            echo "chaos commit: $GITHUB_SHA"
            echo "assets: $ASSETS_REF"
            echo "server host: $SERVER_HOST"
            echo "mariadb: $MARIADB_VERSION"
            echo "engine: built on $(lsb_release -ds), $(g++ --version | head -n 1)"
            echo "built: $(date -u +%Y-%m-%dT%H:%MZ) by run $GITHUB_RUN_ID"
          } > "$P/BUILD_INFO.txt"
          tar -czf "$P.tar.gz" "$P"
          ls -la "$P.tar.gz"
          rm -rf "$P" work mariadb-linux

      # the archive as a player gets it: extract, first start (database, sql-setup), "Server Online", the login port
      # answers, stop (the engine saves, the database stops)
      - name: Start test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf CindersOfChaos-Server-Linux.tar.gz -C "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke/CindersOfChaos-Server-Linux"
          ./start-server.sh -d
          ok=0
          for _ in $(seq 1 600); do
            if grep -q "Server Online" logs/server.log 2>/dev/null; then ok=1; break; fi
            # start-server.sh's own messages when it gives up (the engine's output is not matched)
            if grep -qE "^(Stopped\.|Missing: |mariadb-install-db failed|The database did not start|It crashed 5 times)" \
              logs/server.log 2>/dev/null; then break; fi
            sleep 1
          done
          tail -n 60 logs/server.log
          if [ $ok -ne 1 ]; then
            echo "::error::The Linux server package did not reach Server Online"
            tail -n 40 logs/mariadb.err logs/database-setup.log 2>/dev/null || true
            ./stop-server.sh || true
            exit 1
          fi
          timeout 5 bash -c 'echo > /dev/tcp/127.0.0.1/7171' && timeout 5 bash -c 'echo > /dev/tcp/127.0.0.1/7172'
          ./add-account.sh smoketest smoketest1 "Smoke Tester" mystic
          ./stop-server.sh
          if pgrep -af "$RUNNER_TEMP/smoke"; then
            echo "::error::processes of the package still run after stop-server.sh"
            exit 1
          fi
          cd / && rm -rf "$RUNNER_TEMP/smoke"

      - name: Publish the Linux server on the release
        run: gh release upload "$PKG_TAG" CindersOfChaos-Server-Linux.tar.gz -R "$GITHUB_REPOSITORY" --clobber

  client-linux:
    name: Linux client (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      # client/LINUX.md "Build", plus patchelf (tools/linux/bundle_libs.sh) and Xvfb / Mesa (the start test)
      APT_PACKAGES: >-
        cmake g++ libboost-all-dev libphysfs-dev libogg-dev libvorbis-dev zlib1g-dev libzip-dev libbz2-dev libssl-dev
        libopenal-dev libglew-dev libluajit-5.1-dev libgl1-mesa-dev libglu1-mesa-dev libx11-dev
        patchelf file xvfb xauth libgl1-mesa-dri
    steps:
      - name: Check out Cinders of Chaos
        uses: actions/checkout@v4
        with:
          path: chaos

      - name: Check out the assets
        uses: actions/checkout@v4
        with:
          ref: ${{ env.ASSETS_REF }}
          path: assets
          sparse-checkout: |
            client
            things
            SHA256SUMS.parts
          sparse-checkout-cone-mode: true

      - name: Restore the apt download cache
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: apt-chaos-client-ubuntu-22.04-v1

      - name: Build tools and libraries (apt)
        run: |
          mkdir -p ~/apt-cache/partial
          sudo apt-get update -qq
          # shellcheck disable=SC2086 # APT_PACKAGES is a list of package names
          sudo apt-get install -y -qq --no-install-recommends -o Dir::Cache::archives="$HOME/apt-cache" $APT_PACKAGES
          sudo chown -R "$(id -u):$(id -g)" ~/apt-cache

      - name: Assemble the Cinders of Chaos client (base + client/base-patches + client/overlay)
        run: |
          (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts)
          mkdir base
          cat assets/client/base-client.tar.xz.part* | xz -d | tar -xf - -C base
          mv base/*/ base-client  # the archive holds one folder: the base client
          patch --version | head -n 1
          bash chaos/client/tools/assemble_client.sh "$GITHUB_WORKSPACE/base-client" "$GITHUB_WORKSPACE/game"
          rm -rf base base-client

      - name: No other server or client names in the assembled client (check_names.py --client, client/BASE.md)
        run: python3 -I chaos/tools/ci/check_names.py --client "$GITHUB_WORKSPACE/game"

      - name: Client guard inputs (build number, key secret)
        env:
          CHAOS_CLIENT_KEY: ${{ secrets.CHAOS_CLIENT_KEY }}
          CHAOS_RSA_PUBLIC: ${{ secrets.CHAOS_RSA_PUBLIC || vars.CHAOS_RSA_PUBLIC }}
        run: |
          if ! [[ "$CLIENT_BUILD" =~ ^[0-9]+$ ]] || [ "$CLIENT_BUILD" -lt 1 ] || [ "$CLIENT_BUILD" -gt 65535 ]; then
            echo "::error::client_build must be a number from 1 to 65535"
            exit 1
          fi
          if [ -z "$CHAOS_CLIENT_KEY" ] && [ "$ALLOW_DEV_KEY" != true ]; then
            echo "::error::No CHAOS_CLIENT_KEY secret. Set it (docs/SECURITY_CHECKLIST.md), or tick allow_dev_key for a test build."
            exit 1
          elif [ -z "$CHAOS_CLIENT_KEY" ]; then
            echo "::warning::No CHAOS_CLIENT_KEY secret (allow_dev_key): this client gets the public DEVELOPMENT key; a production server (clientGuardMode enforce) kicks it."
          elif ! [[ "$CHAOS_CLIENT_KEY" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::The CHAOS_CLIENT_KEY secret must be 64 hex digits (openssl rand -hex 32)"
            exit 1
          fi
          if [ -z "$CHAOS_RSA_PUBLIC" ] && [ "$ALLOW_DEV_KEY" != true ]; then
            echo "::error::No CHAOS_RSA_PUBLIC (the game server's login key, server/tools/rsa_key.py public). Set it, or tick allow_dev_key for a test build."
            exit 1
          fi
          echo "Client build $CLIENT_BUILD"

      # client/LINUX.md "Build"; the key reaches CMake only as this step's environment variable (base patch 0035)
      - name: Build
        env:
          CHAOS_CLIENT_KEY: ${{ secrets.CHAOS_CLIENT_KEY }}
        run: |
          set -euo pipefail
          mkdir build
          cd build
          cmake "$GITHUB_WORKSPACE/game" -DCMAKE_BUILD_TYPE=Release -DLUAJIT=ON \
            -DPHYSFS_LIBRARY=/usr/lib/x86_64-linux-gnu/libphysfs.so -DOPENAL_LIBRARY=/usr/lib/x86_64-linux-gnu/libopenal.so \
            -DCHAOS_CLIENT_BUILD="$CLIENT_BUILD"
          make -j"$(nproc)"

      - name: Put the Linux client together
        env:
          CHAOS_RSA_PUBLIC: ${{ secrets.CHAOS_RSA_PUBLIC || vars.CHAOS_RSA_PUBLIC }}
        run: |
          set -euo pipefail
          P=CindersOfChaos-Client-Linux
          bash chaos/tools/linux/package_client.sh game build "$P"
          (cd assets && sha256sum --ignore-missing -c SHA256SUMS.parts)
          mkdir -p "$P/data/things/1098"
          tar -xJf assets/things/things-1098.tar.xz -C "$P/data/things/1098"
          # the same updater settings as the Windows client (client/MANIFEST.md "Signed updater")
          if [ -n "$UPDATE_MANIFEST" ] && [ -n "$UPDATE_PUBLIC_KEY" ]; then
            python3 -I chaos/client/tools/set_update_config.py "$P" \
              --manifest "$UPDATE_MANIFEST" --public-key "$UPDATE_PUBLIC_KEY" --package "$CLIENT_BUILD" \
              --baseline "${PKG_TAG#winpkg-}"
          fi
          python3 -I chaos/client/tools/set_server_host.py "$P" "$SERVER_HOST" --site-url "$SITE_URL"
          python3 -I chaos/client/tools/set_rsa_key.py "$P" --from-env CHAOS_RSA_PUBLIC \
            $([ "$ALLOW_DEV_KEY" = true ] && echo --allow-default)
          python3 -I chaos/client/tools/make_update_manifest.py build "$P" --dry-run
          {
            echo "chaos commit: $GITHUB_SHA"
            echo "assets: $ASSETS_REF @ $(git -C assets rev-parse HEAD)"
            echo "server host: $SERVER_HOST"
            echo "client build: $CLIENT_BUILD"
            echo "built: $(date -u +%Y-%m-%dT%H:%MZ) by run $GITHUB_RUN_ID on $(lsb_release -ds)"
          } > "$P/BUILD_INFO.txt"
          tar -czf "$P.tar.gz" "$P"
          ls -la "$P.tar.gz"
          rm -rf "$P" game build

      # the archive as a player gets it, on a virtual display with software OpenGL and no sound card: the client must
      # still be running after 30 seconds (it waits at the login screen). CHAOS_UPDATE_OFF=1: the updater makes no
      # request and mounts nothing (updater_core.lua offByEnv), so the test runs this package's own files whatever the
      # live update server publishes.
      - name: Start test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/smoke/home"
          tar -xzf CindersOfChaos-Client-Linux.tar.gz -C "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke/CindersOfChaos-Client-Linux"
          code=0
          HOME="$RUNNER_TEMP/smoke/home" LIBGL_ALWAYS_SOFTWARE=1 ALSOFT_DRIVERS=null CHAOS_UPDATE_OFF=1 \
            xvfb-run -a -s "-screen 0 1280x720x24" timeout 30 ./run-client.sh > "$RUNNER_TEMP/client.log" 2>&1 || code=$?
          tail -n 40 "$RUNNER_TEMP/client.log"
          if [ $code -ne 124 ]; then
            echo "::error::The Linux client stopped within 30 seconds (exit code $code)"
            exit 1
          fi
          if ! grep -q 'updater: off (CHAOS_UPDATE_OFF is set)' "$RUNNER_TEMP/client.log"; then
            echo "::error::The start test did not turn the updater off (CHAOS_UPDATE_OFF): it may have used the live update server"
            exit 1
          fi
          cd / && rm -rf "$RUNNER_TEMP/smoke"

      - name: Release of this run (created by whichever job gets here first)
        run: |
          gh release view "$PKG_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$PKG_TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Windows package ${{ github.run_number }}" \
              --notes "Windows test package built by run ${{ github.run_id }} from $GITHUB_SHA (assets: $ASSETS_REF)." || \
            gh release view "$PKG_TAG" -R "$GITHUB_REPOSITORY" >/dev/null

      - name: Publish the Linux client on the release
        run: gh release upload "$PKG_TAG" CindersOfChaos-Client-Linux.tar.gz -R "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish (release notes, links, cleanup)
    needs: [package, engine-linux, client-linux]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KEY_STATE: ${{ secrets.CHAOS_CLIENT_KEY != '' && 'the official key (secret CHAOS_CLIENT_KEY)' || 'the public development key (no CHAOS_CLIENT_KEY secret)' }}
      RSA_STATE: ${{ (secrets.CHAOS_RSA_PUBLIC || vars.CHAOS_RSA_PUBLIC) && 'our own key (CHAOS_RSA_PUBLIC)' || 'the PUBLIC DEFAULT key (no CHAOS_RSA_PUBLIC), never for players' }}
      ALL_OK: ${{ needs.package.result == 'success' && needs.engine-linux.result == 'success' && needs.client-linux.result == 'success' }}
    steps:
      - name: Release notes and download links
        run: |
          set -euo pipefail
          if ! gh release view "$PKG_TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::No release $PKG_TAG: the first jobs failed"
            exit 1
          fi
          have=$(gh release view "$PKG_TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$PKG_TAG"
          line() {  # asset, description
            if grep -qxF "$1" <<< "$have"; then
              echo "- [$1]($base/$1): $2"
            else
              echo "- $1: not built in this run (see the run's failed job)"
            fi
          }
          {
            echo "Cinders of Chaos packages built by run [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from $GITHUB_SHA (assets: $ASSETS_REF)."
            echo
            line CindersOfChaos-Windows.zip "the whole game on one Windows PC: server, client, portable MariaDB, map editor; start-server.bat, then start-client.bat (test accounts, local play)."
            line CindersOfChaos-Client-Windows.zip "the Windows client alone (Chaos.exe), connects to $SERVER_HOST."
            line CindersOfChaos-Server-Windows.zip "the Windows server alone: ChaosServer.exe, portable MariaDB, start-server.bat / stop-server.bat."
            line CindersOfChaos-Server-Linux.tar.gz "the Linux server (Ubuntu 22.04+, Debian 12+) with its own MariaDB: ./start-server.sh."
            line CindersOfChaos-Client-Linux.tar.gz "the Linux client (Ubuntu 22.04+, Debian 12+): ./run-client.sh, connects to $SERVER_HOST."
            echo
            echo "Client build $CLIENT_BUILD, built with $KEY_STATE. Server host of the separate downloads: $SERVER_HOST."
            echo "Login encryption of the separate client downloads: $RSA_STATE."
          } > notes.md
          cat notes.md
          gh release edit "$PKG_TAG" -R "$GITHUB_REPOSITORY" --title "Cinders of Chaos packages ${{ github.run_number }}" \
            --notes-file notes.md
          {
            echo "## Downloads ($PKG_TAG)"
            echo
            cat notes.md
            echo
            echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$PKG_TAG"
          } >> "$GITHUB_STEP_SUMMARY"

      # kept after a failure, so that "Re-run failed jobs" still finds them (the release is pruned later anyway)
      - name: Delete the intermediate parts
        if: ${{ env.ALL_OK == 'true' }}
        run: |
          for part in server.tar server-exe.tar client.tar; do
            gh release delete-asset "$PKG_TAG" "$part" -R "$GITHUB_REPOSITORY" -y || true
          done

      - name: Keep the newest 3 package releases
        if: ${{ needs.package.result == 'success' }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("winpkg-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" -y --cleanup-tag || true
          done
