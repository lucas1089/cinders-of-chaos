[package]
name = "cinders-admin"
version = "0.1.0"
edition = "2021"
description = "Cinders of Chaos desktop admin app (O312): the Android admin app's tabs and chaos-ctl.sh commands on the PC"
publish = false

[lib]
name = "cinders_admin"
path = "src/lib.rs"

[[bin]]
name = "cinders-admin"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde_json = "1.0"
ed25519-compact = { version = "2", default-features = false, features = ["std"] }
cinders-selfupdate = { path = "../crates/selfupdate" }

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
